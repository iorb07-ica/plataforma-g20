<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b0f">
<title>Progresso do Aluno — G20 Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b0f;--bg2:#0f1117;--bg3:#171b23;--surface:#1c2030;--sur2:#242838;--border:rgba(255,255,255,0.08);--gold:#e8b84b;--red:#e63946;--green:#2ecc71;--blue:#3498db;--text:#f4f6fa;--text2:#b0bac8;--text3:#6b7a94}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100svh;padding:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--gold)}
.page-sub{font-size:13px;color:var(--text3);margin-top:2px}
.btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-back{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-back:hover{background:rgba(232,184,75,0.1)}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:hover{background:#f0c84a}

.hero{display:grid;grid-template-columns:80px 1fr;gap:16px;align-items:start;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px}
.avatar{width:80px;height:80px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.hero-info h1{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:var(--gold);margin-bottom:4px}
.hero-info p{font-size:13px;color:var(--text2);margin-bottom:8px}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:600;background:rgba(232,184,75,.15);color:var(--gold)}
.badge.pending{background:rgba(52,152,219,.15);color:var(--blue)}
.badge.approved{background:rgba(46,204,113,.15);color:var(--green)}
.badge.blocked{background:rgba(230,57,70,.15);color:var(--red)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sc,var(--gold))}
.stat-label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.stat-val{font-size:22px;font-weight:800;color:var(--sc,var(--gold))}

.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:auto;margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th{text-align:left;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
tr:hover td{background:var(--sur2)}
tr:last-child td{border-bottom:none}
.modulo-header{background:var(--surface);font-weight:700;color:var(--gold)}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600}
.status-done{background:rgba(46,204,113,.15);color:var(--green)}
.status-pending{background:rgba(52,152,219,.15);color:var(--blue)}
.data-conclusao{font-size:11px;color:var(--text3)}

.acoes{display:flex;gap:8px;margin-top:24px}
.acoes .btn{flex:1}

.carregando{text-align:center;color:var(--text3);padding:40px 20px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script src="auth-guard.js" data-admin="1"></script>
</head>
<body>

<div id="g20LoadingOverlay" style="position:fixed;inset:0;background:#090b0f;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <img src="G20_Masterclass_-_logo_dashboard.png" style="width:80px;opacity:0.8">
  <div style="width:32px;height:32px;border-radius:50%;border:3px solid rgba(232,184,75,.2);border-top-color:#e8b84b;animation:spin .8s linear infinite"></div>
</div>

<div class="topbar">
  <div>
    <div class="page-title" id="pageTitle">📈 Progresso</div>
    <div class="page-sub" id="pageSub">Evolução de um aluno</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-back" onclick="voltarAcompanhamento()">← Voltar</button>
    <button class="btn btn-gold" onclick="editarAluno()" id="btnEditar">✎ Editar</button>
    <button class="btn" style="border:1px solid rgba(46,204,113,.5);background:rgba(46,204,113,.1);color:#2ecc71" onclick="verComoAluno('gestao-patrimonial.html')" title="Abre a Minha Carteira do aluno, só para leitura">👁 Minha Carteira dele</button>
    <button class="btn" style="border:1px solid rgba(52,152,219,.5);background:rgba(52,152,219,.1);color:#3498db" onclick="verComoAluno('gestao-financeira.html')" title="Abre a Gestão Financeira do aluno, só para leitura">👁 Gestão Financeira dele</button>
  </div>
</div>

<!-- FICHA 360° DO ALUNO (out/2026) -->
<style id="f360-css">
.f-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.f-av{width:72px;height:72px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#c9a961,#8a6d1f);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#16151a;overflow:hidden}
.f-av img{width:100%;height:100%;object-fit:cover}
.f-nome{font-size:22px;font-weight:900}
.f-sub{font-size:13px;color:var(--text3);margin-top:4px;line-height:1.6}

.f-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}

.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:16px}
.f-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;min-width:0}
.f-box h3{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text3);font-weight:800;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.f-li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:13px}

.f-bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}

.f-bar .t{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.07)}
.f-bar .t i{display:block;height:100%;border-radius:5px;background:var(--gold)}
.f-bar .q{width:60px;text-align:right;color:var(--text)}
.f-cols{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.f-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.f-col i{display:block;width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#e8c766,#c9a961);min-height:2px}
.f-col small{font-size:9.5px;color:var(--text3)}
.f-com{padding:9px 0;border-top:1px solid var(--border);font-size:13px}
.f-com .m{font-size:11.5px;color:var(--text3);margin-bottom:3px}
.f-tl{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--border);font-size:13px}
.f-tl span{width:118px;flex-shrink:0;color:var(--text3)}
.f-vazio{color:var(--text3);font-size:13px;padding:6px 0}
.f-tab{width:100%;border-collapse:collapse;font-size:12.5px;min-width:0 !important}
.f-tab th{padding:5px 4px !important;border-bottom:none !important}
.f-tab th{color:var(--text3);font-size:10px;letter-spacing:1px;text-transform:uppercase;text-align:right;padding:5px 4px}
.f-tab th:first-child,.f-tab td:first-child{text-align:left}
.f-tab td{padding:6px 4px;border-top:1px solid var(--border);text-align:right;white-space:nowrap}
details.f-aulas summary{cursor:pointer;color:var(--gold);font-size:12.5px;margin-top:8px}
</style>

<div class="f-hero">
  <div class="f-av" id="fAv">–</div>
  <div style="flex:1;min-width:220px">
    <div class="f-nome" id="fNome">Carregando…</div>

</div>

<div class="f-grid">

  <div class="f-box"><h3>Carteira <span id="fCartTit"></span></h3><div id="fCart" class="f-vazio">Carregando…</div></div>

  <div class="f-box"><h3>Comentários nas aulas <span id="fComTit"></span></h3><div id="fCom" class="f-vazio">Carregando…</div></div>

</div>
<div class="f-box" style="margin-bottom:16px"><h3>Linha do tempo</h3><div id="fTl" class="f-vazio">Carregando…</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
var _aluno = {};
var _uid = new URLSearchParams(window.location.search).get('uid') || sessionStorage.getItem('alunoUID');
/* "Ver como o aluno" (out/2026): abre a página do aluno em outra aba, somente
   leitura (assets/g20-ver-aluno.js bloqueia qualquer gravação). */
function verComoAluno(pagina){ if (!_uid) return; location.href = pagina + '?ver=' + encodeURIComponent(_uid); }

firebase.initializeApp({
  apiKey: "AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",
  authDomain: "g20-masterclass.firebaseapp.com",
  projectId: "g20-masterclass",
  storageBucket: "g20-masterclass.firebasestorage.app",
  messagingSenderId: "1052719482127",
  appId: "1:1052719482127:web:537c1d67c96532be8a2a7a"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async function(user) {
  if (!user) { window.location.href = 'login.html'; return; }
  const doc = await db.collection('users').doc(user.uid).get();
  if (!doc.exists || doc.data().role !== 'admin') {
    alert('Acesso restrito a administradores.');
    window.location.href = 'dashboard.html';
    return;
  }
  
  // É admin! Carregar a ficha
  if (!_uid) { window.location.href = 'admin-acompanhamento.html'; return; }
  try { await f360Carregar(); } catch(e){ console.error('[Ficha 360]', e); }
  const ol = document.getElementById('g20LoadingOverlay'); if (ol) ol.style.display = 'none';
});

/* ═══════════════════════════════════════════════════════════════════════
   FICHA 360° (out/2026) · tudo do aluno num lugar só, só leitura
   Leituras: perfil, curso (módulos/aulas), progresso, retomada, comentários
   (das aulas), carteira (4 docs), Gestão Financeira (1 doc), Game,
   Biblioteca e consultorias. Abre sob demanda, uma ficha por vez.
   ═══════════════════════════════════════════════════════════════════════ */
const fEsc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fDt = v => { try { const d = v && v.toDate ? v.toDate() : (typeof v === 'number' ? new Date(v) : (v ? new Date(String(v).length === 10 ? v + 'T12:00:00' : v) : null)); return d && !isNaN(d) ? d : null; } catch(e){ return null; } };
const fData = d => d ? d.toLocaleDateString('pt-BR') : '–';
const fRel = d => { if (!d) return '–'; const n = Math.floor((Date.now() - d.getTime()) / 864e5); return n <= 0 ? 'hoje' : n === 1 ? 'ontem' : 'há ' + n + ' dias'; };
const fBRL = (v, c) => (v == null || isNaN(v)) ? '–' : (c && Math.abs(v) >= 1e6 ? 'R$ ' + (v / 1e6).toFixed(2).replace('.', ',') + ' mi' : v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }));
const fLi = (a, b) => '<div class="f-li"><span>' + a + '</span><b>' + b + '</b></div>';
const fTl = [];
function fEvento(d, txt){ if (d) fTl.push({ d: d, t: txt }); }
function fSet(id, html){ const e = document.getElementById(id); if (e) { e.innerHTML = html; e.classList.remove('f-vazio'); } }

async function f360Carregar(){
  const uref = db.collection('users').doc(_uid);
  const [udoc, mods] = await Promise.all([uref.get(), db.collection('cursos').doc('g20-masterclass').collection('modulos').orderBy('ordem').get()]);
  const u = udoc.exists ? (udoc.data() || {}) : {}; _aluno = u;
  const pf = u.perfil || {};
  const nome = u.name || u.nome || pf.nome || u.email || 'Aluno';
  document.getElementById('pageTitle').textContent = '📈 ' + nome;
  document.getElementById('fNome').textContent = nome;
  const av = document.getElementById('fAv');
  const foto = u.photoURL || u.foto || pf.foto;
  if (foto && /^(https:|data:image\/)/.test(foto)) av.innerHTML = '<img src="' + fEsc(foto) + '" alt="">'; else av.textContent = nome.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
  const cad = fDt(u.criadoEm || u.createdAt), apr = fDt(u.aprovadoEm);
  document.getElementById('fSub').innerHTML = fEsc(u.email || '') + ' · ' + fEsc(u.turma || 'sem turma') + '<br>Cadastro ' + fData(cad) + (apr ? ' · aprovado ' + fData(apr) : '') + (pf.cidade ? ' · ' + fEsc(pf.cidade) + (pf.estado ? '/' + fEsc(pf.estado) : '') : '') + (pf.profissao ? ' · ' + fEsc(pf.profissao) : '');
  const pill = (t, c, bg) => '<span class="f-pill" style="color:' + c + ';background:' + bg + '">' + t + '</span>';
  document.getElementById('fPills').innerHTML =
    (u.aprovado ? pill('Aprovado', '#2ecc71', 'rgba(46,204,113,.12)') : pill(u.bloqueado ? 'Bloqueado' : 'Aguardando aprovação', '#e8b84b', 'rgba(232,184,75,.12)')) +
    ((u.g20Infinity || u.infinite) ? pill('∞ G20 Infinite', '#c4b5fd', 'rgba(196,181,253,.14)') : '') +
    (typeof u.perfilNota === 'number' ? pill('Perfil ' + u.perfilNota + '/100', u.perfilNota >= 80 ? '#2ecc71' : '#e8b84b', 'rgba(255,255,255,.06)') : '');
  const fone = String(pf.whatsapp || pf.telefone || pf.celular || u.whatsapp || u.telefone || '').replace(/\D/g, '');
  if (fone.length >= 10) { const z = document.getElementById('fZap'); z.href = 'https://wa.me/' + (fone.length <= 11 ? '55' + fone : fone) + '?text=' + encodeURIComponent('Oi ' + nome.split(' ')[0] + ', tudo bem? Aqui é o Israel, do G20.'); z.style.display = ''; }
  fEvento(cad, 'Fez o cadastro'); fEvento(apr, 'Cadastro aprovado' + (u.turma ? ' · ' + u.turma : ''));

  // tudo em paralelo
  const dados = uref.collection('dados');
  const ler = d => d.get().then(x => x.exists ? (x.data() || {}) : null).catch(() => null);
  const [prog, cfgSA, rv, rf, bens, prov, gf, net, estante, gameCart, consult] = await Promise.all([
    uref.collection('progresso').get().catch(() => null), ler(uref.collection('config').doc('salaDeAula')),
    ler(dados.doc('rvAportes')), ler(dados.doc('rendaFixa')), ler(dados.doc('patrimonioBens')), ler(dados.doc('rvDividendos')), ler(dados.doc('financeiro_Pessoal')),
    ler(db.collection('networking_public').doc(_uid)),
    uref.collection('minhaEstante').get().catch(() => null),
    db.collection('game-g20').doc(_uid).collection('carteiras').get().catch(() => null),
    db.collection('consultoria').doc('agendamentos').collection('items').where('uid', '==', _uid).get().catch(() => null)
  ]);
  const aulas = await f360Curso(mods, prog, cfgSA);
  await f360Comentarios(mods, aulas);
  const cart = f360Carteira(rv, rf, bens, prov);
  const fin = f360Gf(gf);
  f360Perfil(u, net);
  f360Outras(estante, gameCart, consult);
  // KPIs
  const k = (l, v, s, c) => '<div class="f-kpi"><div class="l">' + l + '</div><div class="v"' + (c ? ' style="color:' + c + '"' : '') + '>' + v + '</div><div class="s">' + s + '</div></div>';
  document.getElementById('fKpis').innerHTML =
    k('Curso', aulas.pct + '%', aulas.feitas + ' de ' + aulas.total + ' aulas', 'var(--green)') +
    k('Última aula concluída', aulas.ult ? fRel(aulas.ult) : '–', aulas.ult ? fData(aulas.ult) : 'nenhuma ainda') +
    k('Patrimônio', cart.patr ? fBRL(cart.patr, true) : '–', cart.patr ? 'pelo custo · ' + cart.nAtivos + ' ativos' : 'não importou a carteira', 'var(--gold)') +
    k('Aportes 12 meses', cart.ap12 ? fBRL(cart.ap12, true) : '–', cart.ultAp ? 'último ' + fRel(cart.ultAp) : '–') +
    k('Economia (mês passado)', fin.econ == null ? '–' : fin.econ + '%', fin.nLanc ? fin.nLanc + ' lançamentos' : 'não usa a Gestão Financeira', fin.econ == null ? '' : fin.econ >= 20 ? 'var(--green)' : fin.econ >= 10 ? 'var(--gold)' : 'var(--red)') +
    k('Comentários', String(window._fNCom || 0), (window._fNSemResp ? window._fNSemResp + ' sem resposta' : 'nas aulas'), 'var(--blue)');
  // linha do tempo
  fTl.sort((x, y) => y.d - x.d);
  fSet('fTl', fTl.length ? fTl.slice(0, 40).map(e => '<div class="f-tl"><span>' + e.d.toLocaleDateString('pt-BR') + '</span><div>' + e.t + '</div></div>').join('') : '<div class="f-vazio">Sem eventos ainda.</div>');
}

async function f360Curso(mods, prog, cfg){
  const concl = {}; let ult = null, primeira = null;
  if (prog) prog.forEach(d => { const p = d.data() || {}; if (p.concluida === true) { const t = fDt(Number(p.ts) || null); concl[d.id] = t; if (t && (!ult || t > ult)) ult = t; if (t && (!primeira || t < primeira)) primeira = t; } });
  const lista = [], porMod = [];
  await Promise.all(mods.docs.map(async (m, idx) => {
    const au = await db.collection('cursos').doc('g20-masterclass').collection('modulos').doc(m.id).collection('aulas').orderBy('ordem').get().catch(() => null);
    const md = m.data() || {}, arr = [];
    if (au) au.forEach(a => { const ad = a.data() || {}; if (ad.publicada === false) return; arr.push({ id: a.id, mod: m.id, titulo: ad.titulo || ad.title || a.id, feita: concl[a.id] || null }); });
    porMod[idx] = { id: m.id, nome: (md.tag ? md.tag + ' · ' : '') + (md.title || md.titulo || m.id), aulas: arr };
  }));
  porMod.forEach(m => m && m.aulas.forEach(a => lista.push(a)));
  const total = lista.length, feitas = lista.filter(a => a.feita).length;
  const pos = (cfg && cfg.posicoes) || {}, abertas = lista.filter(a => !a.feita && pos[a.id] && pos[a.id].t > 30);
  let html = porMod.filter(Boolean).map(m => { const f = m.aulas.filter(a => a.feita).length, p = m.aulas.length ? Math.round(f / m.aulas.length * 100) : 0;
    return '<div class="f-bar"><span class="n">' + fEsc(m.nome) + '</span><div class="t"><i style="width:' + p + '%;' + (p === 100 ? 'background:var(--green)' : '') + '"></i></div><span class="q">' + f + '/' + m.aulas.length + '</span></div>'; }).join('');
  const ultA = cfg && cfg.ultima && cfg.ultima.aulaId ? lista.find(a => a.id === cfg.ultima.aulaId) : null;
  if (ultA) html += fLi('Última aula aberta', fEsc(ultA.titulo) + ' · ' + fRel(fDt(cfg.ultima.em)));
  if (abertas.length) html += fLi('Começou e não terminou', abertas.length + ' aula(s): ' + abertas.slice(0, 3).map(a => fEsc(a.titulo) + ' (parou em ' + Math.floor(pos[a.id].t / 60) + ' min)').join(', '));
  html += '<details class="f-aulas"><summary>Ver todas as aulas</summary>' + lista.map(a => '<div class="f-li"><span>' + fEsc(a.titulo) + '</span><b style="color:' + (a.feita ? 'var(--green)' : 'var(--text3)') + '">' + (a.feita ? '✓ ' + fData(a.feita) : '–') + '</b></div>').join('') + '</details>';
  fSet('fCurso', html || '<div class="f-vazio">Nenhuma aula publicada.</div>');
  const pct = total ? Math.round(feitas / total * 100) : 0;
  document.getElementById('fCursoTit').textContent = pct + '%';
  fEvento(primeira, 'Concluiu a primeira aula');
  if (ult && ult !== primeira) { const a = lista.filter(x => x.feita && x.feita.getTime() === ult.getTime())[0]; fEvento(ult, 'Concluiu a aula ' + (a ? '<b>' + fEsc(a.titulo) + '</b>' : '')); }
  [25, 50, 75, 100].forEach(meta => { const ord = lista.filter(a => a.feita).map(a => a.feita).sort((x, y) => x - y); const n = Math.ceil(total * meta / 100); if (total && ord.length >= n && n > 0) fEvento(ord[n - 1], 'Chegou a ' + meta + '% do curso'); });
  return { total, feitas, pct, ult, lista };
}

async function f360Comentarios(mods, aulas){
  const meus = []; let semResp = 0;
  // só as aulas publicadas; lê os comentários de cada aula e separa os do aluno
  await Promise.all(aulas.lista.map(async a => {
    const sn = await db.collection('cursos').doc('g20-masterclass').collection('modulos').doc(a.mod).collection('aulas').doc(a.id).collection('comentarios').get().catch(() => null);
    if (!sn) return;
    const todos = sn.docs.map(d => Object.assign({ _id: d.id }, d.data() || {}));
    todos.filter(c => c.autorId === _uid).forEach(c => {
      const resp = todos.some(r => r.respostaDe === c._id && (r.admin === true || r.autorId !== _uid));
      const pergunta = !c.respostaDe;
      if (pergunta && !resp) semResp++;
      meus.push({ aula: a, c: c, resp: resp, pergunta: pergunta, d: fDt(c.criadoEm) });
    });
  }));
  meus.sort((x, y) => (y.d || 0) - (x.d || 0));
  window._fNCom = meus.length; window._fNSemResp = semResp;
  document.getElementById('fComTit').textContent = meus.length ? meus.length + (semResp ? ' · ' + semResp + ' sem resposta' : '') : '';
  fSet('fCom', meus.length ? meus.slice(0, 12).map(x => '<div class="f-com"><div class="m">' + fData(x.d) + ' · ' + fEsc(x.aula.titulo) + (x.pergunta ? (x.resp ? ' · <span style="color:var(--green)">respondido</span>' : ' · <span style="color:var(--red)">sem resposta</span>') : ' · resposta') + '</div>' + fEsc(String(x.c.texto || '').slice(0, 220)) + '</div>').join('') + (meus.length > 12 ? '<div class="f-vazio">+ ' + (meus.length - 12) + ' comentário(s)</div>' : '') : '<div class="f-vazio">Nenhum comentário ainda.</div>');
  if (meus.length) { const pri = meus[meus.length - 1]; fEvento(pri.d, 'Primeiro comentário, na aula <b>' + fEsc(pri.aula.titulo) + '</b>'); if (meus.length > 1) fEvento(meus[0].d, 'Comentou na aula <b>' + fEsc(meus[0].aula.titulo) + '</b>'); }
}

function f360Carteira(rv, rf, bens, prov){
  const ap = (rv && Array.isArray(rv.value)) ? rv.value : [];
  const hoje = new Date(), lim12 = new Date(hoje.getFullYear() - 1, hoje.getMonth(), 1).toISOString().slice(0, 10);
  const pos = {}, meses = {}, classes = {}; let ap12 = 0, ult = '', pri = '', orig = {};
  const nomeClasse = t => ({ Acao: 'Ações', FII: 'FIIs', FIAGRO: 'FIIs', FIInfra: 'FIIs', Stock: 'Exterior', REIT: 'Exterior', ETF: 'Exterior', Cripto: 'Cripto' }[t] || 'Outros');
  ap.slice().sort((x, y) => String(x.data).localeCompare(String(y.data))).forEach(t => {
    const fx = t.moeda === 'USD' ? (Number(t.fxRate) || 5) : 1, q = Number(t.qtd) || 0, v = q * (Number(t.preco) || 0) * fx, k = String(t.ticker || '').toUpperCase();
    const p = pos[k] = pos[k] || { q: 0, c: 0, cl: nomeClasse(t.tipo) };
    if (t.op === 'V') { const pm = p.q > 0 ? p.c / p.q : 0; p.q -= q; p.c -= pm * q; if (p.q <= 1e-9) { p.q = 0; p.c = 0; } }
    else { p.q += q; p.c += v; if (!t.bonificacao) { if (!pri) pri = t.data; if (t.data > ult) ult = t.data; if (t.data >= lim12) { ap12 += v; const m = String(t.data).slice(0, 7); meses[m] = (meses[m] || 0) + v; } } }
    const og = String(t.origem || '').toLowerCase();
    const o = (t.idV1 || og.indexOf('plataforma') === 0) ? 'Plataforma antiga' : og === 'myprofit' ? 'MyProfit' : t.idSI ? 'Status Invest' : 'Manual';
    orig[o] = (orig[o] || 0) + 1;
  });
  Object.keys(pos).forEach(k => { if (pos[k].c > 0) classes[pos[k].cl] = (classes[pos[k].cl] || 0) + pos[k].c; });
  const rfl = (rf && Array.isArray(rf.value)) ? rf.value : [];
  const rfv = rfl.filter(r => !r.resgatado && !r.resgatadoEm).reduce((s, r) => s + (Number(r.valorAtual) || Number(r.valorInv) || 0), 0);
  rfl.forEach(r => { if (r.dataInicio >= lim12) { const m = String(r.dataInicio).slice(0, 7); meses[m] = (meses[m] || 0) + (Number(r.valorInv) || 0); ap12 += Number(r.valorInv) || 0; } });
  if (rfv) classes['Renda fixa'] = rfv;
  const bl = (bens && Array.isArray(bens.value)) ? bens.value : [], bv = bl.reduce((s, b) => s + (Number(b.valor) || 0) - (Number(b.divida) || 0), 0);
  if (bv) classes['Bens'] = bv;
  const patr = Object.keys(classes).reduce((s, k) => s + classes[k], 0);
  const pl = (prov && Array.isArray(prov.value)) ? prov.value : [];
  const prov12 = pl.filter(p => String(p.dataPag || '') >= lim12 && String(p.dataPag || '') <= hoje.toISOString().slice(0, 10)).reduce((s, p) => s + (Number(p.valor) || 0) * (p.moeda === 'USD' ? 5 : 1), 0);
  const nAtivos = Object.keys(pos).filter(k => pos[k].q > 0).length;
  document.getElementById('fCartTit').textContent = patr ? fBRL(patr, true) : '';
  if (!ap.length && !rfl.length && !bl.length) { fSet('fCart', '<div class="f-vazio">Ainda não importou nem lançou a carteira.</div>'); return { patr: 0, nAtivos: 0, ap12: 0, ultAp: null }; }
  // aportes mês a mês (12 meses)
  const ks = []; for (let i = 11; i >= 0; i--) { const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1); ks.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); }
  const mx = Math.max(1, ...ks.map(k => meses[k] || 0)), mn = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  let html = '<div style="font-size:11.5px;color:var(--text3)">Aportes mês a mês (12 meses)</div><div class="f-cols">' + ks.map(k => '<div class="f-col" title="' + fBRL(meses[k] || 0) + '"><i style="height:' + Math.round((meses[k] || 0) / mx * 90) + 'px"></i><small>' + mn[+k.slice(5) - 1] + '</small></div>').join('') + '</div>';
  html += Object.keys(classes).sort((x, y) => classes[y] - classes[x]).map(c => '<div class="f-bar"><span class="n">' + c + '</span><div class="t"><i style="width:' + Math.round(classes[c] / patr * 100) + '%"></i></div><span class="q">' + Math.round(classes[c] / patr * 100) + '%</span></div>').join('');
  html += fLi('Ativos na carteira', nAtivos) + fLi('Aportes em 12 meses', fBRL(ap12)) + fLi('Proventos em 12 meses', fBRL(prov12)) + fLi('Origem dos lançamentos', fEsc(Object.keys(orig).join(', ') || '–'));
  html += '<div style="margin-top:10px"><button class="btn btn-back" onclick="verComoAluno(\'gestao-patrimonial.html\')">👁 Abrir a Minha Carteira dele</button></div>';
  fSet('fCart', html);
  fEvento(fDt(pri), 'Primeira compra registrada na Minha Carteira');
  if (ult && ult !== pri) fEvento(fDt(ult), 'Último aporte registrado');
  return { patr, nAtivos, ap12, ultAp: fDt(ult) };
}

function f360Gf(gf){
  const r = { nLanc: 0, econ: null };
  let d = null; try { d = gf && gf.data ? (typeof gf.data === 'string' ? JSON.parse(gf.data) : gf.data) : null; } catch(e){}
  if (!d || !Array.isArray(d.transactions) || !d.transactions.length) { fSet('fGf', '<div class="f-vazio">Ainda não usa a Gestão Financeira.</div>'); return r; }
  const hj = new Date(), hoje = hj.toISOString().slice(0, 10), meses = {}; let ul = '', pri = '';
  d.transactions.forEach(t => { if (!t || !t.date || t.date > hoje) return; r.nLanc++; if (t.date > ul) ul = t.date; if (!pri || t.date < pri) pri = t.date;
    const m = t.date.slice(0, 7), o = meses[m] = meses[m] || { rec: 0, desp: 0, cats: {} };
    if (t.amount > 0) o.rec += t.amount; else { o.desp += -t.amount; o.cats[t.category || 'Geral'] = (o.cats[t.category || 'Geral'] || 0) - t.amount; } });
  const ks = []; for (let i = 6; i >= 1; i--) { const x = new Date(hj.getFullYear(), hj.getMonth() - i, 1); ks.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); }
  const mn = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const ant = meses[ks[ks.length - 1]];
  if (ant && ant.rec > 0) r.econ = Math.round((ant.rec - ant.desp) / ant.rec * 100);
  let html = '<table class="f-tab"><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Economia</th></tr></thead><tbody>' + ks.map(k => { const o = meses[k]; if (!o) return '<tr><td>' + mn[+k.slice(5) - 1] + '/' + k.slice(2, 4) + '</td><td colspan="3" style="text-align:right;color:var(--text3)">sem lançamentos</td></tr>';
    const e = o.rec > 0 ? Math.round((o.rec - o.desp) / o.rec * 100) : null;
    return '<tr><td>' + mn[+k.slice(5) - 1] + '/' + k.slice(2, 4) + '</td><td style="color:var(--green)">' + fBRL(o.rec) + '</td><td style="color:var(--red)">' + fBRL(o.desp) + '</td><td style="font-weight:800;color:' + (e == null ? 'var(--text3)' : e >= 20 ? 'var(--green)' : e >= 10 ? 'var(--gold)' : 'var(--red)') + '">' + (e == null ? '–' : e + '%') + '</td></tr>'; }).join('') + '</tbody></table>';
  if (ant && Object.keys(ant.cats).length) { const tot = ant.desp || 1; html += '<div style="font-size:11.5px;color:var(--text3);margin-top:10px">Para onde foi o dinheiro no mês passado</div>' + Object.keys(ant.cats).sort((x, y) => ant.cats[y] - ant.cats[x]).slice(0, 5).map(c => '<div class="f-bar"><span class="n">' + fEsc(c) + '</span><div class="t"><i style="width:' + Math.round(ant.cats[c] / tot * 100) + '%"></i></div><span class="q">' + fBRL(ant.cats[c]) + '</span></div>').join(''); }
  html += fLi('Lançamentos', r.nLanc + ' · último ' + fRel(fDt(ul))) + fLi('Usa orçamento', (Object.keys(d.budgets || {}).length || Object.keys(d.tagBudgets || {}).length) ? 'sim' : 'não') + fLi('Cartões cadastrados', Object.keys(d.cartoes || {}).length || 'nenhum');
  html += '<div style="margin-top:10px"><button class="btn btn-back" onclick="verComoAluno(\'gestao-financeira.html\')">👁 Abrir a Gestão Financeira dele</button></div>';
  fSet('fGf', html);
  document.getElementById('fGfTit').textContent = r.nLanc + ' lançamentos';
  fEvento(fDt(pri), 'Primeiro lançamento na Gestão Financeira');
  return r;
}

function f360Perfil(u, net){
  const pf = u.perfil || {};
  const campos = [['Profissão', pf.profissao], ['Cidade', pf.cidade ? pf.cidade + (pf.estado ? '/' + pf.estado : '') : ''], ['Por que o G20', pf.porqueG20 || pf.motivo], ['Objetivo', pf.objetivo || pf.meta], ['Dívidas', pf.dividas], ['Renda', pf.renda || pf.faixaRenda], ['Sobre', pf.sobre || pf.sobreMim]];
  let html = '';
  campos.forEach(c => { if (c[1]) html += fLi(c[0], fEsc(String(c[1]).slice(0, 140))); });
  html += fLi('Networking', net ? 'cartão público ativo' : 'não ativou');
  fSet('fPerf', html || '<div class="f-vazio">Perfil sem informações.</div>');

function f360Outras(estante, game, consult){
  let html = '';
  const est = estante ? estante.docs.map(d => d.data() || {}) : [];
  const lidos = est.filter(b => /lid|conclu/i.test(String(b.status || ''))).length, lendo = est.filter(b => /lendo|andamento/i.test(String(b.status || ''))).length;
  html += fLi('Biblioteca', est.length ? est.length + ' livro(s) · ' + lendo + ' lendo · ' + lidos + ' lido(s)' : 'não usa');
  const ciclos = game ? game.docs.map(d => d.id) : [];
  html += fLi('Game G20', ciclos.length ? 'participou de ' + ciclos.length + ' ciclo(s) · último ' + fEsc(ciclos.sort().pop()) : 'não participou');
  const ag = consult ? consult.docs.map(d => d.data() || {}) : [];
  const datas = ag.map(a => fDt(a.data || a.dataHora || a.quando)).filter(Boolean).sort((x, y) => y - x);
  html += fLi('Consultorias', ag.length ? ag.length + ' agendada(s)' + (datas[0] ? ' · última ' + fData(datas[0]) : '') : 'nenhuma');
  datas.forEach(d => fEvento(d, 'Consultoria'));
  fSet('fOutras', html);
}
