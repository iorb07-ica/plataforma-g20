<style>
:root{--bg:#1a191e;--surface:#27252c;--sur2:#2e2b36;--sur3:#332f3d;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--gold:#c9a961;--gold2:#e8c766;--gold-soft:rgba(201,169,97,.15);--gold-border:rgba(201,169,97,.3);--red:#e63946;--green:#2ecc71;--blue:#3498db;--text:#e8e6e3;--text2:#9a9aa8;--text3:#6b6862;--sidebar:200px;--topbar:56px;--ease:cubic-bezier(.4,0,.2,1)}
.light{--bg:#f5f3ee;--surface:#fff;--sur2:#f0ede8;--sur3:#e8e4de;--border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.14);--text:#1a191e;--text2:#4a4860;--text3:#8890a4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;display:flex}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199}.overlay.show{display:block}
.btn-menu{display:none;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text2);font-size:18px;cursor:pointer}
@media(max-width:768px){.btn-menu{display:flex;align-items:center}}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
@media(max-width:768px){.main{margin-left:0}}
.content{padding:24px 32px 60px;flex:1}
.admin-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.admin-hdr-left{display:flex;align-items:center;gap:.85rem}
.badge-admin{background:var(--gold-soft);border:.5px solid var(--gold-border);color:var(--gold2);font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.1em;text-transform:uppercase}
.admin-title{font-size:22px;font-weight:800;color:var(--text)}
.admin-hdr-right{display:flex;gap:.6rem;flex-wrap:wrap}
.btn-back{background:transparent;border:.5px solid var(--border2);color:var(--text2);border-radius:9px;padding:.55rem 1rem;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-back:hover{border-color:var(--gold-border);color:var(--gold)}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.5rem}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--surface);border-radius:14px;padding:1rem 1.25rem;border:.5px solid var(--border)}
.stat-num{font-size:28px;font-weight:700;color:var(--gold2);font-family:"JetBrains Mono",monospace;line-height:1}
.stat-lbl{font-size:12px;color:var(--text2);margin-top:5px}

.filters-bar{display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap}
.cat-tab{background:var(--surface);border:.5px solid var(--border);color:var(--text2);border-radius:8px;padding:.35rem .9rem;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.cat-tab:hover{border-color:var(--gold-border);color:var(--gold)}
.cat-tab.active{background:var(--gold-soft);border-color:var(--gold-border);color:var(--gold)}
.search-wrap{margin-left:auto;position:relative}
.search-wrap input{background:var(--surface);border:.5px solid var(--border);border-radius:9px;padding:.45rem .85rem .45rem 2.1rem;font-size:13px;color:var(--text);width:240px;outline:none;font-family:inherit;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--gold-border)}
.search-wrap .s-ico{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}

.fb-list{display:flex;flex-direction:column;gap:.6rem}
.fb-card{background:var(--surface);border-radius:13px;border:.5px solid var(--border);padding:1rem 1.15rem;transition:border-color .15s}
.fb-card:hover{border-color:var(--border2)}
.fb-card.novo{border-left:3px solid var(--gold);border-radius:0 13px 13px 0;padding-left:calc(1.15rem - 2px)}
.fb-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.55rem}
.fb-tipo{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.03em}
.fb-tipo.bug{background:rgba(230,57,70,.14);color:#ff8a8a}
.fb-tipo.sugestao{background:var(--gold-soft);color:var(--gold2)}
.fb-tipo.duvida{background:rgba(52,152,219,.14);color:#7bc4ec}
.fb-tipo.outro{background:rgba(255,255,255,.07);color:var(--text2)}
.fb-status{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.fb-status.novo{background:var(--gold-soft);color:var(--gold2)}
.fb-status.lendo{background:rgba(52,152,219,.14);color:#7bc4ec}
.fb-status.resolvido{background:rgba(46,204,113,.14);color:#7ddca0}
.fb-data{font-size:11px;color:var(--text3);font-family:"JetBrains Mono",monospace;margin-left:auto}
.fb-titulo{font-size:15px;font-weight:700;color:var(--text);margin-bottom:.25rem}
.fb-msg{font-size:13.5px;color:var(--text2);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.fb-meta{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.7rem;font-size:11.5px;color:var(--text3)}
.fb-meta b{color:var(--text2);font-weight:600}
.fb-prints{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.fb-print{width:84px;height:84px;border-radius:8px;border:.5px solid var(--border2);overflow:hidden;cursor:zoom-in}
.fb-print img{width:100%;height:100%;object-fit:cover;display:block}
.fb-actions{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.85rem;padding-top:.75rem;border-top:.5px solid var(--border)}
.fb-btn{background:transparent;border:.5px solid var(--border2);color:var(--text2);border-radius:8px;padding:.4rem .85rem;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.fb-btn:hover{border-color:var(--gold-border);color:var(--gold)}
.fb-btn.active{background:var(--gold-soft);border-color:var(--gold-border);color:var(--gold)}
.fb-btn.danger:hover{border-color:rgba(230,57,70,.5);color:#ff8a8a}

.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .ico{font-size:44px;margin-bottom:12px}
.loading{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}

.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9998;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:.5px solid var(--gold-border);color:var(--text);padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
</style>
</head>

<main class="main">
  <header class="topbar">

      <div class="stat-card"><div class="stat-num" id="statResolvidos">—</div><div class="stat-lbl">Resolvidos</div></div>

      <button class="cat-tab" data-filtro="bug" onclick="setFiltro('bug')">Bugs</button>
      <button class="cat-tab" data-filtro="sugestao" onclick="setFiltro('sugestao')">Sugestões</button>
      <button class="cat-tab" data-filtro="duvida" onclick="setFiltro('duvida')">Dúvidas</button>

<script>
var _cfg={apiKey:"AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",authDomain:"g20-masterclass.firebaseapp.com",projectId:"g20-masterclass",storageBucket:"g20-masterclass.firebasestorage.app",messagingSenderId:"1052719482127",appId:"1:1052719482127:web:537c1d67c96532be8a2a7a"};
if(!firebase.apps.length)firebase.initializeApp(_cfg);
var auth=firebase.auth(),db=firebase.firestore();

var _itens=[],_filtro='todos',_busca='';

// ── AUTH — somente admin ──
auth.onAuthStateChanged(function(user){
  if(!user){location.href='login.html';return;}
  db.collection('users').doc(user.uid).get().then(function(doc){
    var d=doc.exists?doc.data():{};
    var role=d.role||(d.profile&&d.profile.role)||'';
    if(role!=='admin'){ location.href='dashboard.html'; return; }
    var profile=d.profile||d;
    var name=profile.name||profile.nome||user.email||'Israel';
    var el=document.getElementById('sidebarName');
    if(el){var nt=el.querySelector('.user-name-text');if(nt)nt.textContent=name;}
    var ini=name.split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase();
    var eli=document.getElementById('sidebarInitials');if(eli)eli.textContent=ini;
    carregarFeedback();
  }).catch(function(){ location.href='dashboard.html'; });
});

// ── CARREGAR DA COLLECTION sugestoes ──
function carregarFeedback(){
  document.getElementById('fbList').innerHTML='<div class="loading">Carregando feedback...</div>';
  db.collection('sugestoes').orderBy('criadoEm','desc').get().then(function(snap){
    _itens=[];
    snap.forEach(function(doc){
      var d=doc.data()||{};
      d._id=doc.id;
      _itens.push(d);
    });
    render();
  }).catch(function(err){
    // fallback: sem orderBy (caso algum doc não tenha criadoEm)
    db.collection('sugestoes').get().then(function(snap){
      _itens=[];
      snap.forEach(function(doc){var d=doc.data()||{};d._id=doc.id;_itens.push(d);});
      _itens.sort(function(a,b){return _ts(b)-_ts(a);});
      render();
    }).catch(function(e){
      document.getElementById('fbList').innerHTML='<div class="empty-state"><div class="ico">⚠️</div><div>Erro ao carregar: '+escHtml(e.message||'')+'</div></div>';
    });
  });
}

function _ts(d){ try{ return d.criadoEm&&d.criadoEm.toMillis?d.criadoEm.toMillis():0; }catch(e){ return 0; } }

// ── STATS ──
function atualizarStats(){
  var total=_itens.length;
  var novos=_itens.filter(function(d){return (d.status||'novo')==='novo';}).length;
  var bugs=_itens.filter(function(d){return d.tipo==='bug';}).length;
  var resolvidos=_itens.filter(function(d){return d.status==='resolvido';}).length;
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statNovos').textContent=novos;
  document.getElementById('statBugs').textContent=bugs;
  document.getElementById('statResolvidos').textContent=resolvidos;
}

// ── FILTRO / BUSCA ──
function setFiltro(f){
  _filtro=f;
  document.querySelectorAll('.cat-tab').forEach(function(t){
    t.classList.toggle('active',t.getAttribute('data-filtro')===f);
  });
  render();
}
function onBusca(v){ _busca=(v||'').toLowerCase().trim(); render(); }

function _passaFiltro(d){
  var st=d.status||'novo';
  if(_filtro==='todos')return true;
  if(_filtro==='novo')return st==='novo';
  if(_filtro==='resolvido')return st==='resolvido';
  return d.tipo===_filtro; // bug / sugestao / duvida
}
function _passaBusca(d){
  if(!_busca)return true;
  var alvo=((d.mensagem||'')+' '+(d.titulo||'')+' '+(d.nome||'')+' '+(d.email||'')+' '+(d.pagina||'')).toLowerCase();
  return alvo.indexOf(_busca)>=0;
}

// ── RENDER ──
function render(){
  atualizarStats();
  var list=document.getElementById('fbList');
  var filtrados=_itens.filter(function(d){return _passaFiltro(d)&&_passaBusca(d);});
  if(!_itens.length){
    list.innerHTML='<div class="empty-state"><div class="ico">📭</div><div>Nenhum feedback recebido ainda.</div></div>';
    return;
  }
  if(!filtrados.length){
    list.innerHTML='<div class="empty-state"><div class="ico">🔍</div><div>Nenhum feedback para esse filtro.</div></div>';
    return;
  }
  list.innerHTML=filtrados.map(cardHtml).join('');
}

var TIPO_LBL={bug:'🐛 Bug',sugestao:'💡 Sugestão',duvida:'❓ Dúvida',outro:'💬 Outro'};
var STATUS_LBL={novo:'Novo',lendo:'Lendo',resolvido:'Resolvido'};

function cardHtml(d){
  var tipo=d.tipo||'outro';
  var status=d.status||'novo';
  var prints=(d.imagens||[]).map(function(src,i){
    return '<div class="fb-print" onclick="abrirPrint(\''+d._id+'\','+i+')"><img src="'+src+'" alt="print"></div>';
  }).join('');
  var meta=[];
  if(d.nome)   meta.push('<span><b>Aluno:</b> '+escHtml(d.nome)+'</span>');
  if(d.email)  meta.push('<span><b>Email:</b> '+escHtml(d.email)+'</span>');
  if(d.pagina) meta.push('<span><b>Página:</b> '+escHtml(d.pagina)+'</span>');
  if(d.tela)   meta.push('<span><b>Tela:</b> '+escHtml(d.tela)+'</span>');
  return ''
  +'<div class="fb-card '+(status==='novo'?'novo':'')+'">'
  + '<div class="fb-top">'
  +   '<span class="fb-tipo '+tipo+'">'+(TIPO_LBL[tipo]||'💬 Outro')+'</span>'
  +   '<span class="fb-status '+status+'">'+(STATUS_LBL[status]||'Novo')+'</span>'
  +   '<span class="fb-data">'+fmtData(d.criadoEm)+'</span>'
  + '</div>'
  + (d.titulo?'<div class="fb-titulo">'+escHtml(d.titulo)+'</div>':'')
  + '<div class="fb-msg">'+escHtml(d.mensagem||'(sem mensagem)')+'</div>'
  + (prints?'<div class="fb-prints">'+prints+'</div>':'')
  + (meta.length?'<div class="fb-meta">'+meta.join('')+'</div>':'')
  + '<div class="fb-actions">'
  +   '<button class="fb-btn '+(status==='novo'?'active':'')+'" onclick="setStatus(\''+d._id+'\',\'novo\')">Novo</button>'
  +   '<button class="fb-btn '+(status==='lendo'?'active':'')+'" onclick="setStatus(\''+d._id+'\',\'lendo\')">Lendo</button>'
  +   '<button class="fb-btn '+(status==='resolvido'?'active':'')+'" onclick="setStatus(\''+d._id+'\',\'resolvido\')">Resolvido</button>'
  +   '<button class="fb-btn danger" style="margin-left:auto" onclick="apagar(\''+d._id+'\')">Excluir</button>'
  + '</div>'
  +'</div>';
}

// ── AÇÕES ──
function setStatus(id,novoStatus){
  db.collection('sugestoes').doc(id).update({status:novoStatus}).then(function(){
    var it=_itens.filter(function(x){return x._id===id;})[0];
    if(it)it.status=novoStatus;
    render();
    toast('Status atualizado: '+(STATUS_LBL[novoStatus]||novoStatus));
  }).catch(function(e){ toast('Erro: '+(e.message||'tente de novo')); });
}

function apagar(id){
  if(!confirm('Excluir este feedback? Esta ação não pode ser desfeita.'))return;
  db.collection('sugestoes').doc(id).delete().then(function(){
    _itens=_itens.filter(function(x){return x._id!==id;});
    render();
    toast('Feedback excluído');
  }).catch(function(e){ toast('Erro: '+(e.message||'tente de novo')); });
}

// ── PRINT / LIGHTBOX ──
function abrirPrint(id,idx){
  var it=_itens.filter(function(x){return x._id===id;})[0];
  if(!it||!it.imagens||!it.imagens[idx])return;
  document.getElementById('lightboxImg').src=it.imagens[idx];
  document.getElementById('lightbox').classList.add('show');
}

// ── HELPERS ──
function fmtData(ts){
  try{
    var dt=ts&&ts.toDate?ts.toDate():null;
    if(!dt)return '—';
    var dd=String(dt.getDate()).padStart(2,'0');
    var mm=String(dt.getMonth()+1).padStart(2,'0');
    var hh=String(dt.getHours()).padStart(2,'0');
    var mi=String(dt.getMinutes()).padStart(2,'0');
    return dd+'/'+mm+'/'+dt.getFullYear()+' '+hh+':'+mi;
  }catch(e){ return '—'; }
}
function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},3000);}

// ── SIDEBAR (padrão G20) ──
function toggleSidebar(){var sb=document.getElementById('sidebar'),ov=document.getElementById('overlay');sb.classList.toggle('open');ov.classList.toggle('show');document.body.style.overflow=sb.classList.contains('open')?'hidden':'';}
function closeSidebar(){var sb=document.getElementById('sidebar'),ov=document.getElementById('overlay');sb.classList.remove('open');ov.classList.remove('show');document.body.style.overflow='';}
function csm(){if(window.innerWidth<=768)closeSidebar();}
function toggleSidebarCollapse(){var sb=document.getElementById('sidebar'),main=document.querySelector('.main');if(!sb||window.innerWidth<=768)return;var col=sb.classList.contains('sidebar-collapsed');if(!col){sb.classList.add('sidebar-collapsed');sb.style.setProperty('width','68px','important');if(main)main.style.setProperty('margin-left','68px','important');localStorage.setItem('g20_sidebar_collapsed','1');}else{sb.classList.remove('sidebar-collapsed');sb.style.removeProperty('width');if(main)main.style.removeProperty('margin-left');localStorage.setItem('g20_sidebar_collapsed','0');}}

if(window.lucide)lucide.createIcons();
