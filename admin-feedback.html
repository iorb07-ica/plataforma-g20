<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Feedback · G20 Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/g20-topbar.css?v=10">
<link rel="stylesheet" href="assets/g20-sidebar.css?v=10">
<link rel="stylesheet" href="assets/g20-scrollbar.css?v=10">
<link rel="stylesheet" href="assets/g20-topbar-v21.css?v=12">
<script src="assets/g20-sidebar.js?v=11"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#1a191e;--surface:#27252c;--sur2:#2e2b36;--sur3:#332f3d;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--gold:#c9a961;--gold2:#e8c766;--gold-soft:rgba(201,169,97,.15);--gold-border:rgba(201,169,97,.3);--red:#e63946;--green:#2ecc71;--blue:#3498db;--text:#e8e6e3;--text2:#9a9aa8;--text3:#6b6862;--sidebar:200px;--topbar:56px;--ease:cubic-bezier(.4,0,.2,1)}
.light{--bg:#f5f3ee;--surface:#fff;--sur2:#f0ede8;--sur3:#e8e4de;--border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.14);--text:#1a191e;--text2:#4a4860;--text3:#8890a4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;display:flex}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199}.overlay.show{display:block}
.btn-menu{display:none;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text2);font-size:18px;cursor:pointer}
@media(max-width:768px){.btn-menu{display:flex;align-items:center}}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
@media(max-width:768px){.main{margin-left:0}}
.content{padding:24px 32px 60px;flex:1}
.admin-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.admin-hdr-left{display:flex;align-items:center;gap:.85rem}
.badge-admin{background:var(--gold-soft);border:.5px solid var(--gold-border);color:var(--gold2);font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.1em;text-transform:uppercase}
.admin-title{font-size:22px;font-weight:800;color:var(--text)}
.admin-hdr-right{display:flex;gap:.6rem;flex-wrap:wrap}
.btn-back{background:transparent;border:.5px solid var(--border2);color:var(--text2);border-radius:9px;padding:.55rem 1rem;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-back:hover{border-color:var(--gold-border);color:var(--gold)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.5rem}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--surface);border-radius:14px;padding:1rem 1.25rem;border:.5px solid var(--border)}
.stat-num{font-size:28px;font-weight:700;color:var(--gold2);font-family:"JetBrains Mono",monospace;line-height:1}
.stat-lbl{font-size:12px;color:var(--text2);margin-top:5px}
.filters-bar{display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap}
.cat-tab{background:var(--surface);border:.5px solid var(--border);color:var(--text2);border-radius:8px;padding:.35rem .9rem;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.cat-tab:hover{border-color:var(--gold-border);color:var(--gold)}
.cat-tab.active{background:var(--gold-soft);border-color:var(--gold-border);color:var(--gold)}
.search-wrap{margin-left:auto;position:relative}
.search-wrap input{background:var(--surface);border:.5px solid var(--border);border-radius:9px;padding:.45rem .85rem .45rem 2.1rem;font-size:13px;color:var(--text);width:240px;outline:none;font-family:inherit;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--gold-border)}
.search-wrap .s-ico{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.fb-list{display:flex;flex-direction:column;gap:.8rem}
.fb-card{background:var(--surface);border-radius:13px;border:.5px solid var(--border);padding:1.25rem;transition:all .15s}
.fb-card:hover{border-color:var(--border2);background:var(--sur2)}
.fb-card.novo{border-left:3px solid var(--gold)}
.fb-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.75rem}
.fb-tipo{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.03em}
.fb-tipo.bug{background:rgba(230,57,70,.14);color:#ff8a8a}
.fb-tipo.sugestao{background:var(--gold-soft);color:var(--gold2)}
.fb-tipo.duvida{background:rgba(52,152,219,.14);color:#7bc4ec}
.fb-tipo.outro{background:rgba(255,255,255,.07);color:var(--text2)}
.fb-status{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.fb-status.novo{background:var(--gold-soft);color:var(--gold2)}
.fb-status.respondido{background:rgba(46,204,113,.14);color:#7ddca0}
.fb-status.resolvido{background:rgba(46,204,113,.14);color:#7ddca0}
.fb-data{font-size:11px;color:var(--text3);font-family:"JetBrains Mono",monospace;margin-left:auto}
.fb-titulo{font-size:15px;font-weight:700;color:var(--text);margin-bottom:.25rem}
.fb-msg{font-size:13.5px;color:var(--text2);line-height:1.55;white-space:pre-wrap;word-break:break-word;margin-bottom:.75rem}
.fb-meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:11.5px;color:var(--text3);margin-bottom:.75rem}
.fb-meta b{color:var(--text2);font-weight:600}
.fb-prints{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.fb-print{width:84px;height:84px;border-radius:8px;border:.5px solid var(--border2);overflow:hidden;cursor:zoom-in}
.fb-print img{width:100%;height:100%;object-fit:cover;display:block}
.fb-resp-section{background:var(--bg);border-radius:10px;padding:1rem;border:.5px solid var(--border);margin-bottom:1rem}
.fb-resp-lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem}
.fb-resp-saved{background:var(--gold-soft);border:.5px solid var(--gold-border);border-radius:9px;padding:.85rem;font-size:13px;color:var(--text);line-height:1.5;white-space:pre-wrap;word-break:break-word}
.fb-resp-saved .fb-resp-meta{display:block;margin-top:.4rem;font-size:10.5px;color:var(--text3);font-family:"JetBrains Mono",monospace}
.fb-resp textarea{width:100%;box-sizing:border-box;background:var(--bg);border:.5px solid var(--border2);border-radius:9px;padding:.6rem .75rem;font-size:13px;color:var(--text);font-family:inherit;resize:vertical;min-height:80px;outline:none;transition:border-color .15s}
.fb-resp textarea:focus{border-color:var(--gold-border)}
.fb-resp-row{display:flex;gap:.45rem;align-items:center;margin-top:.75rem}
.fb-btn-resp{background:var(--gold);color:#1a191e;border:none;border-radius:8px;padding:.45rem 1rem;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.fb-btn-resp:hover:not(:disabled){opacity:.88}
.fb-btn-resp:disabled{opacity:.5;cursor:not-allowed}
.fb-actions{display:flex;gap:.45rem;flex-wrap:wrap;padding-top:.75rem;border-top:.5px solid var(--border)}
.fb-btn{background:transparent;border:.5px solid var(--border2);color:var(--text2);border-radius:8px;padding:.4rem .85rem;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.fb-btn:hover{border-color:var(--gold-border);color:var(--gold)}
.fb-btn.active{background:var(--gold-soft);border-color:var(--gold-border);color:var(--gold)}
.fb-btn.danger:hover{border-color:rgba(230,57,70,.5);color:#ff8a8a}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .ico{font-size:44px;margin-bottom:12px}
.loading{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9998;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:.5px solid var(--gold-border);color:var(--text);padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<nav class="sidebar" id="sidebar"></nav>
<div class="main">
  <div class="topbar"></div>
  <div class="content">
    <div class="admin-hdr">
      <div class="admin-hdr-left">
        <span class="badge-admin">Admin</span>
        <h1 class="admin-title">Feedback dos alunos</h1>
      </div>
      <div class="admin-hdr-right">
        <button class="btn-back" onclick="location.href='dashboard.html'">← Voltar ao Dashboard</button>
        <button class="btn-back" id="btnAtualizar" onclick="carregarDados()">⟳ Atualizar</button>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="filters-bar">
      <button class="cat-tab active" data-cat="Todas" onclick="setCategoria('Todas',this)">Todas</button>
      <button class="cat-tab" data-cat="Novos" onclick="setCategoria('Novos',this)">Novos</button>
      <button class="cat-tab" data-cat="Bugs" onclick="setCategoria('Bugs',this)">Bugs</button>
      <button class="cat-tab" data-cat="Sugestões" onclick="setCategoria('Sugestões',this)">Sugestões</button>
      <button class="cat-tab" data-cat="Dúvidas" onclick="setCategoria('Dúvidas',this)">Dúvidas</button>
      <button class="cat-tab" data-cat="Respondidos" onclick="setCategoria('Respondidos',this)">Respondidos</button>
      <button class="cat-tab" data-cat="Resolvidos" onclick="setCategoria('Resolvidos',this)">Resolvidos</button>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Buscar na mensagem nome..." onkeyup="filtrar()">
        <span class="s-ico">🔍</span>
      </div>
    </div>

    <div id="fbLista" class="fb-list"></div>
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="fecharLightbox(event)"><img id="lightboxImg"></div>
<div id="toast" class="toast"></div>

<script>
const TIPO_LBL={bug:'🐛 Bug',sugestao:'💡 Sugestão',duvida:'❓ Dúvida',outro:'💬 Outro'};
const STATUS_LBL={novo:'Novo',respondido:'Respondido',resolvido:'✓ Resolvido'};
var db, auth, _itens=[], _categoriaSelecionada='Todas';

// ════════════════════════════════════════════════════════════════
// INIT FIREBASE (v60 — COM DEBUG)
// ════════════════════════════════════════════════════════════════
firebase.initializeApp({
  apiKey:"AIzaSyBGPo-MtdPCBbUvYc8nKtVBxSy4pJN-0GA",
  projectId:"g20-masterclass",
  authDomain:"g20-masterclass.firebaseapp.com",
  databaseURL:"https://g20-masterclass.firebaseio.com",
  storageBucket:"g20-masterclass.appspot.com",
  messagingSenderId:"803089651789",
  appId:"1:803089651789:web:ef72c36b3a2d42c0cd3a46"
});

db = firebase.firestore();
auth = firebase.auth();

console.log('[Admin Feedback] Firebase inicializado');

// ════════════════════════════════════════════════════════════════
// MONITOR DE AUTENTICACAO (v60.3 — COM FALLBACK LOCALSTORAGE)
// ════════════════════════════════════════════════════════════════
var _authRetries = 0;
var _maxRetries = 3;

function verificarAuth(){
  _authRetries++;
  var user = auth.currentUser;
  console.log('[Admin Feedback] Verificação #'+_authRetries+': auth.currentUser =', user ? user.uid : 'null');
  
  if (user) {
    console.log('[Admin Feedback] ✓ Autenticado via Firebase! UID:', user.uid);
    carregarDados();
    return;
  }
  
  // Se Firebase falhou, tenta localStorage (fallback)
  if (_authRetries >= _maxRetries) {
    console.log('[Admin Feedback] Firebase falhou. Tentando fallback localStorage...');
    try {
      var perfil = JSON.parse(localStorage.getItem('g20_user_profile') || '{}');
      var uid = perfil.uid;
      if (uid) {
        console.log('[Admin Feedback] ✓ Autenticado via localStorage! UID:', uid);
        carregarDados();
        return;
      }
    } catch(e) {
      console.error('[Admin Feedback] Erro ao ler localStorage:', e);
    }
    console.log('[Admin Feedback] ✗ Falha total: não autenticado em lugar nenhum.');
    document.getElementById('fbLista').innerHTML = '<div class="empty-state">Não autenticado. Faça login na plataforma antes de acessar feedback.</div>';
    return;
  }
  
  console.log('[Admin Feedback] Retry em 1 segundo... (tentativa '+_authRetries+'/'+_maxRetries+')');
  setTimeout(verificarAuth, 1000);
}

// Inicia verificação após 1 segundo
setTimeout(verificarAuth, 1000);

// ════════════════════════════════════════════════════════════════
// CARREGAR DADOS
// ════════════════════════════════════════════════════════════════
function carregarDados(){
  var lista = document.getElementById('fbLista');
  lista.innerHTML = '<div class="loading">Carregando feedback...</div>';
  
  console.log('[Admin Feedback] Iniciando consulta db.collection("sugestoes").get()');
  
  db.collection('sugestoes').get()
    .then(function(snap){
      console.log('[Admin Feedback] Sucesso! Documentos encontrados:', snap.size);
      _itens = [];
      snap.forEach(function(d){
        _itens.push({_id: d.id, ...d.data()});
      });
      console.log('[Admin Feedback] Itens carregados:', _itens);
      render();
    })
    .catch(function(e){
      console.error('[Admin Feedback] ERRO ao carregar:', e.code, e.message);
      lista.innerHTML = '<div class="empty-state">Erro: ' + escHtml(e.message) + '</div>';
    });
}

// ════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════
function render(){
  var stats={total:_itens.length,novos:0,respondidos:0,resolvidos:0};
  _itens.forEach(function(it){
    if(it.status==='novo')stats.novos++;
    if(it.status==='respondido')stats.respondidos++;
    if(it.status==='resolvido')stats.resolvidos++;
  });
  document.getElementById('statsGrid').innerHTML=
    '<div class="stat-card"><div class="stat-num">'+stats.total+'</div><div class="stat-lbl">Total recebidos</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+stats.novos+'</div><div class="stat-lbl">Novos (não lido)</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+stats.respondidos+'</div><div class="stat-lbl">Respondidos</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+stats.resolvidos+'</div><div class="stat-lbl">Resolvidos</div></div>';
  filtrar();
}

function filtrar(){
  var search=(document.getElementById('searchInput').value||'').toLowerCase();
  var lista=document.getElementById('fbLista');
  var filtrados=_itens.filter(function(it){
    var match=search===''||it.titulo&&it.titulo.toLowerCase().includes(search)||it.mensagem&&it.mensagem.toLowerCase().includes(search)||it.nome&&it.nome.toLowerCase().includes(search);
    var catMatch=_categoriaSelecionada==='Todas'||(_categoriaSelecionada==='Novos'&&it.status==='novo')||(_categoriaSelecionada==='Bugs'&&it.tipo==='bug')||(_categoriaSelecionada==='Sugestões'&&it.tipo==='sugestao')||(_categoriaSelecionada==='Dúvidas'&&it.tipo==='duvida')||(_categoriaSelecionada==='Respondidos'&&it.status==='respondido')||(_categoriaSelecionada==='Resolvidos'&&it.status==='resolvido');
    return match&&catMatch;
  });
  if(filtrados.length===0){lista.innerHTML='<div class="empty-state"><div class="ico">📭</div><div>Nenhum feedback encontrado</div></div>';return;}
  lista.innerHTML=filtrados.map(function(d){return renderCard(d);}).join('');
}

function renderCard(d){
  var status=d.status||'novo';
  var tipo=d.tipo||'outro';
  var prints=(d.imagens||[]).map(function(url,idx){return '<div class="fb-print" onclick="abrirPrint(\''+d._id+'\','+idx+')"><img src="'+escHtml(url)+'" onerror="this.src=\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22%3E%3C/svg%3E\'"></div>';}).join('');
  var meta=[];
  if(d.nome)meta.push('<b>Aluno:</b> '+escHtml(d.nome));
  if(d.email)meta.push('<b>Email:</b> '+escHtml(d.email));
  if(d.pagina)meta.push('<b>Página:</b> '+escHtml(d.pagina));
  if(d.tela)meta.push('<b>Tela:</b> '+escHtml(d.tela));
  var respSection='';
  if(d.resposta){respSection='<div class="fb-resp-section"><div class="fb-resp-lbl">✓ Resposta enviada</div><div class="fb-resp-saved">'+escHtml(d.resposta);if(d.respondidoEm)respSection+='<div class="fb-resp-meta">'+fmtData(d.respondidoEm)+'</div>';respSection+='</div><div class="fb-resp-row"><button class="fb-btn" onclick="editarResposta(\''+d._id+'\')">Editar</button></div></div>';}else{respSection='<div class="fb-resp-section"><div class="fb-resp-lbl">Responda</div><textarea id="resp-'+d._id+'" placeholder="Escreva sua resposta para este aluno..."></textarea><div class="fb-resp-row"><button class="fb-btn-resp" onclick="salvarResposta(\''+d._id+'\')">Salvar e enviar</button></div></div>';}
  return '<div class="fb-card '+(status==='novo'?'novo':'')+'">'+'<div class="fb-top"><span class="fb-tipo '+tipo+'">'+(TIPO_LBL[tipo]||'💬 Outro')+'</span><span class="fb-status '+status+'">'+(STATUS_LBL[status]||'Novo')+'</span><span class="fb-data">'+fmtData(d.criadoEm)+'</span></div>'+(d.titulo?'<div class="fb-titulo">'+escHtml(d.titulo)+'</div>':'')+' <div class="fb-msg">'+escHtml(d.mensagem||'(sem mensagem)')+'</div>'+(prints?'<div class="fb-prints">'+prints+'</div>':'')+( meta.length?'<div class="fb-meta">'+meta.join(' • ')+'</div>':'')+respSection+'<div class="fb-actions">'+'<button class="fb-btn '+(status==='novo'?'active':'')+'" onclick="setStatus(\''+d._id+'\',\'novo\')">Novo</button>'+'<button class="fb-btn '+(status==='respondido'?'active':'')+'" onclick="setStatus(\''+d._id+'\',\'respondido\')">Respondido</button>'+'<button class="fb-btn '+(status==='resolvido'?'active':'')+'" onclick="setStatus(\''+d._id+'\',\'resolvido\')">✓ Resolvido</button>'+'<button class="fb-btn danger" style="margin-left:auto" onclick="apagar(\''+d._id+'\')">Excluir</button>'+'</div>'+'</div>';
}

function setCategoria(cat,el){_categoriaSelecionada=cat;document.querySelectorAll('.cat-tab').forEach(function(x){x.classList.remove('active');});el.classList.add('active');filtrar();}
function setStatus(id,novoStatus){db.collection('sugestoes').doc(id).update({status:novoStatus}).then(function(){var it=_itens.filter(function(x){return x._id===id;})[0];if(it)it.status=novoStatus;render();toast('Status atualizado: '+(STATUS_LBL[novoStatus]||novoStatus));}).catch(function(e){toast('Erro: '+(e.message||'tente de novo'));});}
function apagar(id){if(!confirm('Excluir este feedback? Esta ação não pode ser desfeita.'))return;db.collection('sugestoes').doc(id).delete().then(function(){_itens=_itens.filter(function(x){return x._id!==id;});render();toast('Feedback excluído');}).catch(function(e){toast('Erro: '+(e.message||'tente de novo'));});}
function editarResposta(id){var it=_itens.filter(function(x){return x._id===id;})[0];if(!it)return;var novaResp=prompt('Editar resposta:',it.resposta||'');if(novaResp===null)return;novaResp=novaResp.trim();if(!novaResp){toast('A resposta não pode ser vazia.');return;}db.collection('sugestoes').doc(id).update({resposta:novaResp,respondidoEm:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){it.resposta=novaResp;render();toast('Resposta atualizada');}).catch(function(e){toast('Erro ao atualizar: '+(e.message||'tente de novo'));});}
function salvarResposta(id){var ta=document.getElementById('resp-'+id);if(!ta)return;var texto=(ta.value||'').trim();if(!texto){toast('Escreva uma resposta antes de salvar.');ta.focus();return;}ta.disabled=true;var it=_itens.filter(function(x){return x._id===id;})[0];db.collection('sugestoes').doc(id).update({resposta:texto,respondidoEm:firebase.firestore.FieldValue.serverTimestamp(),status:'respondido'}).then(function(){var alunoUid=it&&it.uid;if(alunoUid){var payload={uid:alunoUid,resposta:texto,feedbackId:id,criadoEm:firebase.firestore.FieldValue.serverTimestamp()};db.collection('feedback_respostas').add(payload).catch(function(){});}if(it){it.resposta=texto;it.status='respondido';it.respondidoEm={toDate:function(){return new Date();}};}render();toast(alunoUid?'Resposta salva e enviada ao aluno':'Resposta salva');}).catch(function(e){toast('Erro ao salvar: '+(e.message||'tente de novo'));ta.disabled=false;});}
function abrirPrint(id,idx){var it=_itens.filter(function(x){return x._id===id;})[0];if(!it||!it.imagens||!it.imagens[idx])return;document.getElementById('lightboxImg').src=it.imagens[idx];document.getElementById('lightbox').classList.add('show');}
function fecharLightbox(e){if(e.target.id==='lightbox')document.getElementById('lightbox').classList.remove('show');}
function fmtData(ts){try{var dt=ts&&ts.toDate?ts.toDate():null;if(!dt)return '—';var dd=String(dt.getDate()).padStart(2,'0');var mm=String(dt.getMonth()+1).padStart(2,'0');var hh=String(dt.getHours()).padStart(2,'0');var mi=String(dt.getMinutes()).padStart(2,'0');return dd+'/'+mm+'/'+dt.getFullYear()+' '+hh+':'+mi;}catch(e){return '—';}}
function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},3000);}
if(window.lucide)lucide.createIcons();
</script>
