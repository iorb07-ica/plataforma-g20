<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback dos Alunos</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d0c10; color: #e8e7ec; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    header h1 { font-size: 28px; font-weight: 800; }
    .btn-voltar { padding: 10px 20px; background: rgba(201,169,97,.2); border: 1px solid rgba(201,169,97,.4); border-radius: 8px; color: #c9a961; text-decoration: none; cursor: pointer; transition: all .2s; font-size: 14px; }
    .btn-voltar:hover { background: rgba(201,169,97,.3); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .stat { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 20px; text-align: center; }
    .stat-num { font-size: 32px; font-weight: 800; color: #c9a961; }
    .stat-label { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn { padding: 8px 16px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; color: #e8e7ec; cursor: pointer; transition: all .2s; font-size: 13px; }
    .filter-btn.active { background: #c9a961; color: #0d0c10; border-color: #c9a961; }
    .filter-btn:hover { background: rgba(201,169,97,.3); }
    .fb-lista { display: flex; flex-direction: column; gap: 15px; }
    .fb-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 20px; transition: all .2s; }
    .fb-card.novo { border-color: rgba(74,222,128,.4); background: rgba(74,222,128,.08); }
    .fb-card:hover { background: rgba(255,255,255,.06); }
    .fb-top { display: flex; gap: 12px; margin-bottom: 12px; font-size: 12px; }
    .fb-tipo { padding: 4px 10px; background: rgba(255,255,255,.1); border-radius: 6px; font-weight: 700; }
    .fb-tipo.bug { background: rgba(239,68,68,.2); color: #ef4444; }
    .fb-tipo.sugestao { background: rgba(59,130,246,.2); color: #3b82f6; }
    .fb-status { padding: 4px 10px; border-radius: 6px; font-weight: 700; }
    .fb-status.novo { background: rgba(74,222,128,.2); color: #4ade80; }
    .fb-status.respondido { background: rgba(96,165,250,.2); color: #60a5fa; }
    .fb-status.resolvido { background: rgba(168,85,247,.2); color: #a855f7; }
    .fb-data { color: rgba(255,255,255,.5); }
    .fb-titulo { font-size: 16px; font-weight: 700; margin: 12px 0 8px; }
    .fb-msg { font-size: 14px; color: rgba(255,255,255,.8); line-height: 1.6; margin-bottom: 12px; }
    .fb-meta { font-size: 12px; color: rgba(255,255,255,.6); display: flex; gap: 12px; margin: 12px 0; }
    .fb-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .fb-btn { padding: 8px 14px; border: 1px solid rgba(255,255,255,.2); background: transparent; color: #e8e7ec; border-radius: 6px; cursor: pointer; transition: all .2s; font-size: 12px; font-weight: 700; }
    .fb-btn:hover { background: rgba(255,255,255,.1); }
    .fb-btn.active { background: #c9a961; color: #0d0c10; border-color: #c9a961; }
    .fb-btn.danger { color: #ef4444; border-color: rgba(239,68,68,.3); }
    .fb-btn.danger:hover { background: rgba(239,68,68,.2); }
    .empty-state { text-align: center; padding: 60px 20px; color: rgba(255,255,255,.5); }
    .loading { text-align: center; padding: 40px 20px; color: rgba(255,255,255,.6); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Feedback dos alunos</h1>
      <button class="btn-voltar" onclick="window.location.href='dashboard.html'">← Voltar ao Dashboard</button>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Total recebidos</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statNovos">0</div>
        <div class="stat-label">Novos (não lido)</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statRespondidos">0</div>
        <div class="stat-label">Respondidos</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statResolvidos">0</div>
        <div class="stat-label">Resolvidos</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="filtrar('todos')">Todos</button>
      <button class="filter-btn" onclick="filtrar('novo')">Novos</button>
      <button class="filter-btn" onclick="filtrar('bug')">Bugs</button>
      <button class="filter-btn" onclick="filtrar('sugestao')">Sugestões</button>
      <button class="filter-btn" onclick="filtrar('duvida')">Dúvidas</button>
      <button class="filter-btn" onclick="filtrar('respondido')">Respondidos</button>
      <button class="filter-btn" onclick="filtrar('resolvido')">Resolvidos</button>
    </div>

    <div id="fbLista" class="fb-lista"></div>
  </div>

  <script>
    // ════════════════════════════════════════════════════════════════
    // FIREBASE INIT (v62 — COMPARTILHADO COM DASHBOARD)
    // ════════════════════════════════════════════════════════════════
    console.log('[Admin Feedback v62] Iniciando...');
    
    // Verifica se Firebase já foi inicializado (pelo dashboard)
    if (!firebase.apps.length) {
      console.log('[Admin Feedback v62] Inicializando Firebase...');
      firebase.initializeApp({
        apiKey: "AIzaSyBGPo-MtdPCBbUvYc8nKtVBxSy4pJN-0GA",
        projectId: "g20-masterclass",
        authDomain: "g20-masterclass.firebaseapp.com",
        databaseURL: "https://g20-masterclass.firebaseio.com",
        storageBucket: "g20-masterclass.appspot.com",
        messagingSenderId: "803089651789",
        appId: "1:803089651789:web:ef72c36b3a2d42c0cd3a46"
      });
    } else {
      console.log('[Admin Feedback v62] Firebase já estava inicializado (compartilhado com Dashboard)');
    }

    var db = firebase.firestore();
    var auth = firebase.auth();
    var _itens = [];
    var _filtroAtual = 'todos';

    console.log('[Admin Feedback v62] Firebase pronto');

    // ════════════════════════════════════════════════════════════════
    // AUTENTICACAO
    // ════════════════════════════════════════════════════════════════
    var _authReady = false;

    auth.onAuthStateChanged(function(user) {
      console.log('[Admin Feedback v62] onAuthStateChanged:', user ? 'LOGADO (UID: '+user.uid+')' : 'NÃO LOGADO');
      
      if (user) {
        _authReady = true;
        console.log('[Admin Feedback v62] ✓ Autenticado! Carregando feedbacks...');
        carregarDados();
      } else {
        console.log('[Admin Feedback v62] ✗ Não autenticado. Redirecionando...');
        setTimeout(function() {
          window.location.href = 'dashboard.html';
        }, 1000);
      }
    });

    // ════════════════════════════════════════════════════════════════
    // CARREGAR DADOS
    // ════════════════════════════════════════════════════════════════
    function carregarDados() {
      document.getElementById('fbLista').innerHTML = '<div class="loading">Carregando feedbacks...</div>';
      console.log('[Admin Feedback v62] Consultando Firestore...');

      db.collection('sugestoes').orderBy('criadoEm', 'desc').get()
        .then(function(snap) {
          console.log('[Admin Feedback v62] Sucesso! ' + snap.size + ' feedbacks encontrados');
          _itens = [];
          snap.forEach(function(doc) {
            _itens.push({ _id: doc.id, ...doc.data() });
          });
          atualizarStats();
          render();
        })
        .catch(function(err) {
          console.error('[Admin Feedback v62] Erro:', err);
          document.getElementById('fbLista').innerHTML = '<div class="empty-state">❌ Erro ao carregar: ' + (err.message || 'tente novamente') + '</div>';
        });
    }

    // ════════════════════════════════════════════════════════════════
    // RENDER
    // ════════════════════════════════════════════════════════════════
    function render() {
      var lista = document.getElementById('fbLista');
      var filtrados = _itens.filter(function(item) {
        if (_filtroAtual === 'todos') return true;
        if (_filtroAtual === 'novo') return item.status === 'novo';
        if (_filtroAtual === 'respondido') return item.status === 'respondido';
        if (_filtroAtual === 'resolvido') return item.status === 'resolvido';
        return item.tipo === _filtroAtual;
      });

      if (filtrados.length === 0) {
        lista.innerHTML = '<div class="empty-state">Nenhum feedback neste filtro</div>';
        return;
      }

      lista.innerHTML = filtrados.map(function(d) {
        var tipoLbl = { bug: '🐛 Bug', sugestao: '💡 Sugestão', duvida: '❓ Dúvida', outro: '💬 Outro' };
        var statusLbl = { novo: 'Novo', respondido: 'Respondido', resolvido: 'Resolvido' };
        
        return '<div class="fb-card ' + (d.status === 'novo' ? 'novo' : '') + '">' +
          '<div class="fb-top">' +
            '<span class="fb-tipo ' + (d.tipo || 'outro') + '">' + (tipoLbl[d.tipo] || '💬 Outro') + '</span>' +
            '<span class="fb-status ' + (d.status || 'novo') + '">' + (statusLbl[d.status] || 'Novo') + '</span>' +
            '<span class="fb-data">' + new Date(d.criadoEm?.toDate?.() || d.criadoEm).toLocaleDateString('pt-BR') + '</span>' +
          '</div>' +
          (d.titulo ? '<div class="fb-titulo">' + escHtml(d.titulo) + '</div>' : '') +
          '<div class="fb-msg">' + escHtml(d.mensagem || '(sem mensagem)') + '</div>' +
          (d.aluno ? '<div class="fb-meta"><strong>Aluno:</strong> ' + escHtml(d.aluno) + '</div>' : '') +
          '<div class="fb-actions">' +
            '<button class="fb-btn ' + (d.status === 'novo' ? 'active' : '') + '" onclick="setStatus(\'' + d._id + '\', \'novo\')">Novo</button>' +
            '<button class="fb-btn ' + (d.status === 'respondido' ? 'active' : '') + '" onclick="setStatus(\'' + d._id + '\', \'respondido\')">Respondido</button>' +
            '<button class="fb-btn ' + (d.status === 'resolvido' ? 'active' : '') + '" onclick="setStatus(\'' + d._id + '\', \'resolvido\')">✓ Resolvido</button>' +
            '<button class="fb-btn danger" style="margin-left: auto" onclick="deletar(\'' + d._id + '\')">Excluir</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function atualizarStats() {
      var total = _itens.length;
      var novos = _itens.filter(function(x) { return x.status === 'novo'; }).length;
      var respondidos = _itens.filter(function(x) { return x.status === 'respondido'; }).length;
      var resolvidos = _itens.filter(function(x) { return x.status === 'resolvido'; }).length;
      
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statNovos').textContent = novos;
      document.getElementById('statRespondidos').textContent = respondidos;
      document.getElementById('statResolvidos').textContent = resolvidos;
    }

    function filtrar(tipo) {
      _filtroAtual = tipo;
      document.querySelectorAll('.filter-btn').forEach(function(btn) { btn.classList.remove('active'); });
      event.target.classList.add('active');
      render();
    }

    function setStatus(id, status) {
      console.log('[Admin Feedback v62] Atualizando status:', id, status);
      db.collection('sugestoes').doc(id).update({ status: status })
        .then(function() {
          var item = _itens.find(function(x) { return x._id === id; });
          if (item) item.status = status;
          atualizarStats();
          render();
          console.log('[Admin Feedback v62] Status atualizado');
        })
        .catch(function(err) {
          console.error('[Admin Feedback v62] Erro:', err);
          alert('Erro: ' + (err.message || 'tente novamente'));
        });
    }

    function deletar(id) {
      if (!confirm('Excluir este feedback? Esta ação não pode ser desfeita.')) return;
      console.log('[Admin Feedback v62] Deletando:', id);
      
      db.collection('sugestoes').doc(id).delete()
        .then(function() {
          _itens = _itens.filter(function(x) { return x._id !== id; });
          atualizarStats();
          render();
          console.log('[Admin Feedback v62] Feedback excluído');
        })
        .catch(function(err) {
          console.error('[Admin Feedback v62] Erro:', err);
          alert('Erro: ' + (err.message || 'tente novamente'));
        });
    }

    function escHtml(txt) {
      var div = document.createElement('div');
      div.textContent = txt;
      return div.innerHTML;
    }
  </script>
</body>
</html>
