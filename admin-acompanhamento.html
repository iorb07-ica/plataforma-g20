<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b0f">
<title>Acompanhamento — G20 Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b0f;--bg2:#0f1117;--bg3:#171b23;--surface:#1c2030;--sur2:#242838;--border:rgba(255,255,255,0.08);--gold:#e8b84b;--red:#e63946;--green:#2ecc71;--blue:#3498db;--text:#f4f6fa;--text2:#b0bac8;--text3:#6b7a94}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100svh;padding:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--gold)}
.page-sub{font-size:13px;color:var(--text3);margin-top:2px}
.btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:hover{background:#f0c84a}
.btn-back{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-back:hover{background:rgba(232,184,75,0.1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sc,var(--gold))}
.stat-label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:800;color:var(--sc,var(--gold))}
.filters{display:flex;gap:12px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.filter-select{background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:8px 12px;border-radius:8px;font-size:12px;font-family:inherit;outline:none;cursor:pointer}
.filter-select:focus{border-color:var(--gold)}
.chart-container{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px;position:relative;height:300px}
.chart-title{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:16px}
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:auto;margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th{text-align:left;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
tr:hover td{background:var(--sur2)}
tr:last-child td{border-bottom:none}
.aluno-link{cursor:pointer;color:var(--gold);text-decoration:none;font-weight:600}
.aluno-link:hover{text-decoration:underline}
.progress-bar{background:rgba(232,184,75,0.2);border-radius:4px;height:6px;overflow:hidden}
.progress-fill{background:var(--gold);height:100%;transition:width .3s}
.turma-badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600;background:rgba(232,184,75,.15);color:var(--gold)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;padding:24px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);margin-bottom:16px}
.modal-data{display:grid;gap:12px}
.modal-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.modal-label{color:var(--text3);font-size:12px}
.modal-val{color:var(--text);font-weight:600}
.modal-close{background:transparent;border:none;color:var(--text);font-size:20px;cursor:pointer;position:absolute;top:16px;right:16px}
.close-btn{background:var(--gold);color:#000;margin-top:16px;width:100%}
</style>
</head>
<body>

<div id="g20LoadingOverlay" style="position:fixed;inset:0;background:#090b0f;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <img src="G20_Masterclass_-_logo_dashboard.png" style="width:80px;opacity:0.8">
  <div style="width:32px;height:32px;border-radius:50%;border:3px solid rgba(232,184,75,.2);border-top-color:#e8b84b;animation:spin .8s linear infinite"></div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>

<div class="topbar">
  <div>
    <div class="page-title">📊 Acompanhamento</div>
    <div class="page-sub">Progresso de alunos e aulas</div>
  </div>
  <button class="btn btn-back" onclick="window.location.href='admin-hub.html'">← Voltar</button>
</div>

<!-- ESTATÍSTICAS -->
<div class="stats">
  <div class="stat" style="--sc:var(--gold)">
    <div class="stat-label">Total de Alunos</div>
    <div class="stat-val" id="statTotal">–</div>
  </div>
  <div class="stat" style="--sc:var(--gold)">
    <div class="stat-label">Perfil Médio</div>
    <div class="stat-val" id="statPerfilMed">–</div><span style="font-size:14px">%</span>
  </div>
  <div class="stat" style="--sc:var(--green)">
    <div class="stat-label">Aulas Médias</div>
    <div class="stat-val" id="statAulasMed">–</div><span style="font-size:14px">%</span>
  </div>
  <div class="stat" style="--sc:var(--blue)">
    <div class="stat-label">Taxa Atividade</div>
    <div class="stat-val" id="statAtividade">–</div><span style="font-size:14px">%</span>
  </div>
</div>

<!-- FILTROS -->
<div class="filters">
  <label style="font-size:12px;color:var(--text3)">Filtrar por turma:</label>
  <select class="filter-select" id="filterTurma" onchange="atualizarDados()">
    <option value="">Todas as turmas</option>
    <option value="Turma 1">Turma 1</option>
    <option value="Turma 2">Turma 2</option>
    <option value="Turma 3">Turma 3</option>
    <option value="Turma 4">Turma 4</option>
    <option value="Turma 5">Turma 5</option>
    <option value="Turma 6">Turma 6</option>
    <option value="Turma 7">Turma 7</option>
    <option value="Turma 8">Turma 8</option>
    <option value="Turma 9">Turma 9</option>
    <option value="Turma 10">Turma 10</option>
    <option value="Turma 11">Turma 11</option>
    <option value="Turma 12">Turma 12</option>
    <option value="Turma 13">Turma 13</option>
    <option value="Turma 14">Turma 14</option>
    <option value="Turma 15">Turma 15</option>
    <option value="Turma 16">Turma 16</option>
    <option value="Turma 17">Turma 17</option>
    <option value="Turma 18">Turma 18</option>
    <option value="Turma 19">Turma 19</option>
    <option value="Turma 20">Turma 20</option>
    <option value="Turma 21">Turma 21</option>
  </select>
</div>

<!-- GRÁFICO PROGRESSO POR TURMA -->
<div class="chart-container">
  <div class="chart-title">Progresso Médio por Turma</div>
  <canvas id="chartTurmas"></canvas>
</div>

<!-- GRÁFICO SCATTER PERFIL VS AULAS -->
<div class="chart-container">
  <div class="chart-title">Perfil Preenchido vs Aulas Completadas</div>
  <canvas id="chartScatter"></canvas>
</div>

<!-- TOP 10 ALUNOS -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Aluno</th>
        <th>Turma</th>
        <th>Perfil</th>
        <th>Aulas</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="topAlunosBody">
      <tr><td colspan="5" style="text-align:center;color:var(--text3)">Carregando…</td></tr>
    </tbody>
  </table>
</div>

<!-- MODAL DETALHES -->
<div class="modal-overlay" id="modalDetalhes">
  <div class="modal">
    <button class="modal-close" onclick="fecharModal()">✕</button>
    <div class="modal-title" id="modalTitle">–</div>
    <div class="modal-data" id="modalContent"></div>
    <button class="btn btn-gold close-btn" onclick="fecharModal()">Fechar</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<script>
var chartTurmas, chartScatter;

firebase.initializeApp({
  apiKey: "AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",
  authDomain: "g20-masterclass.firebaseapp.com",
  projectId: "g20-masterclass",
  storageBucket: "g20-masterclass.firebasestorage.app",
  messagingSenderId: "1052719482127",
  appId: "1:1052719482127:web:537c1d67c96532be8a2a7a"
});

const auth = firebase.auth();
const db = firebase.firestore();
let _users = [];

auth.onAuthStateChanged(async function(user) {
  if (!user) { window.location.href = 'login.html'; return; }
  const doc = await db.collection('users').doc(user.uid).get();
  if (!doc.exists || doc.data().role !== 'admin') {
    alert('Acesso restrito a administradores.');
    window.location.href = 'dashboard.html';
    return;
  }
  // É admin! Carregar dados
  console.log('✓ Admin verificado');
  carregarDados();
});

function carregarDados() {
  console.log('[Acompanhamento] Iniciando carregamento de dados...');
  
  try {
    db.collection('users').get().then(snap => {
      _users = [];
      snap.forEach(doc => {
        var u = doc.data();
        u.id = doc.id;
        _users.push(u);
      });
      
      console.log('[Acompanhamento] ' + _users.length + ' usuários carregados');
      atualizarDados();
    }).catch(err => {
      console.error('[Acompanhamento] Erro ao carregar usuários:', err);
    });
  } catch(e) {
    console.error('[Acompanhamento] Erro geral:', e);
  }
}

function atualizarDados() {
  console.log('[Acompanhamento] Atualizando dados...');
  
  try {
    var turmaFiltro = document.getElementById('filterTurma')?.value || '';
    var alunosFiltrados = turmaFiltro 
      ? _users.filter(u => u.turma === turmaFiltro)
      : _users;

    console.log('[Acompanhamento] ' + alunosFiltrados.length + ' alunos filtrados');

    // Estatísticas
    var perfilMedia = alunosFiltrados.reduce((sum, u) => sum + (u.perfilPct || 0), 0) / (alunosFiltrados.length || 1);
    
    // Buscar progresso de todos para calcular média de aulas
    var promises = alunosFiltrados.map(u => {
      return db.collection('users').doc(u.id).collection('progresso').get().then(snap => {
        u.aulasFeitas = snap.size;
        u.aulasProgress = Math.round((snap.size / 50) * 100); // ~50 aulas total
        return snap.size;
      });
    });
    
    Promise.all(promises).then(aulasFeitas => {
      var aulasMedia = alunosFiltrados.length > 0 
        ? Math.round(aulasFeitas.reduce((a,b) => a+b, 0) / alunosFiltrados.length)
        : 0;
      
      // Atualizar stats
      var statTotal = document.getElementById('statTotal');
      var statPerfilMed = document.getElementById('statPerfilMed');
      var statAulasMed = document.getElementById('statAulasMed');
      var statAtividade = document.getElementById('statAtividade');
      
      if (statTotal) statTotal.textContent = alunosFiltrados.length;
      if (statPerfilMed) statPerfilMed.textContent = Math.round(perfilMedia);
      if (statAulasMed) statAulasMed.textContent = aulasMedia;
      if (statAtividade) statAtividade.textContent = Math.round((alunosFiltrados.filter(u => u.perfilPct > 0).length / (alunosFiltrados.length || 1)) * 100);
      
      console.log('[Acompanhamento] Stats atualizadas');
      renderizarTopAlunos(alunosFiltrados);
      renderizarGraficos(alunosFiltrados);
    });
  } catch(e) {
    console.error('[Acompanhamento] Erro em atualizarDados:', e);
  }
}

function renderizarTopAlunos(alunos) {
  console.log('[Acompanhamento] Renderizando top alunos...');
  
  try {
    // Buscar progresso de TODOS os alunos
    var promises = alunos.map(u => {
      return db.collection('users').doc(u.id).collection('progresso').get().then(snap => {
        u.aulasFeitas = snap.size; // Número de aulas completadas
        u.aulasProgress = Math.round((snap.size / 50) * 100); // Assume ~50 aulas no total (ajusta conforme necessário)
        return u;
      });
    });

    Promise.all(promises).then(alunosComAulas => {
      var ordenados = alunosComAulas.sort((a, b) => {
        var scoreA = (a.perfilPct || 0) + (a.aulasProgress || 0);
        var scoreB = (b.perfilPct || 0) + (b.aulasProgress || 0);
        return scoreB - scoreA;
      }).slice(0, 10);

      var html = '';
      ordenados.forEach(u => {
        var perfil = u.perfilPct || 0;
        var aulas = u.aulasProgress || 0;
        var status = perfil > 75 ? '✓ Ativo' : '⏳ Pendente';
        html += `
          <tr onclick="abrirDetalhes('${u.id}', '${u.name}')">
            <td><span class="aluno-link">${u.name || '–'}</span></td>
            <td><span class="turma-badge">${u.turma || 'N/A'}</span></td>
            <td><div class="progress-bar"><div class="progress-fill" style="width:${perfil}%"></div></div>${perfil}%</td>
            <td><div class="progress-bar"><div class="progress-fill" style="width:${aulas}%"></div></div>${aulas}%</td>
            <td style="color:${perfil > 75 ? 'var(--green)' : 'var(--text3)'}">${status}</td>
          </tr>
        `;
      });

      var tabelaBody = document.getElementById('topAlunosBody');
      if (tabelaBody) {
        tabelaBody.innerHTML = html || '<tr><td colspan="5" style="text-align:center">Nenhum aluno</td></tr>';
      }
      
      console.log('[Acompanhamento] Top alunos renderizados');
    });
  } catch(e) {
    console.error('[Acompanhamento] Erro em renderizarTopAlunos:', e);
  }
}

function renderizarGraficos(alunos) {
  console.log('[Acompanhamento] Renderizando gráficos...');
  
  try {
    // Gráfico por turma
    var turmas = [...new Set(alunos.map(u => u.turma))].sort();
    var perfilPorTurma = turmas.map(t => {
      var alunosTurma = alunos.filter(u => u.turma === t);
      return alunosTurma.reduce((sum, u) => sum + (u.perfilPct || 0), 0) / (alunosTurma.length || 1);
    });

    var ctx1 = document.getElementById('chartTurmas');
    if (ctx1) {
      if (chartTurmas) chartTurmas.destroy();
      var ctxObj = ctx1.getContext('2d');
      chartTurmas = new Chart(ctxObj, {
        type: 'bar',
        data: {
          labels: turmas,
          datasets: [{
            label: 'Perfil Médio (%)',
            data: perfilPorTurma,
            backgroundColor: '#e8b84b',
            borderRadius: 6
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { max: 100, ticks: { color: '#b0bac8' }, grid: { color: 'rgba(255,255,255,0.08)' } },
            y: { ticks: { color: '#b0bac8' }, grid: { display: false } }
          }
        }
      });
    }

    // Scatter: Perfil vs Aulas
    var dados = alunos.map(u => ({
      x: u.perfilPct || 0,
      y: u.aulasProgress || 0,
      label: u.name
    }));

    var ctx2 = document.getElementById('chartScatter');
    if (ctx2) {
      if (chartScatter) chartScatter.destroy();
      var ctxObj2 = ctx2.getContext('2d');
      chartScatter = new Chart(ctxObj2, {
        type: 'bubble',
        data: {
          datasets: [{
            label: 'Alunos',
            data: dados.map(d => ({ x: d.x, y: d.y, r: 5 })),
            backgroundColor: '#e8b84b',
            borderColor: '#f0c84a',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: {
            x: { min: 0, max: 100, title: { display: true, text: 'Perfil Preenchido (%)', color: '#b0bac8' }, ticks: { color: '#b0bac8' }, grid: { color: 'rgba(255,255,255,0.08)' } },
            y: { min: 0, max: 100, title: { display: true, text: 'Aulas Completadas (%)', color: '#b0bac8' }, ticks: { color: '#b0bac8' }, grid: { color: 'rgba(255,255,255,0.08)' } }
          }
        }
      });
    }
    
    console.log('[Acompanhamento] Gráficos renderizados');
  } catch(e) {
    console.error('[Acompanhamento] Erro em renderizarGraficos:', e);
  }
}

function abrirDetalhes(uid, nome) {
  // Redireciona para a página de progresso detalhado do aluno
  window.location.href = 'admin-aluno-progresso.html?uid=' + uid;
}

function fecharModal() {
  document.getElementById('modalDetalhes').classList.remove('show');
}

// Remover overlay ao carregar
window.addEventListener('load', function() {
  var ol = document.getElementById('g20LoadingOverlay');
  if (ol) ol.style.display = 'none';
});
</script>

</body>
</html>
