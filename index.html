<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G20Flix - G20 Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b0f;--bg2:#0f1117;--bg3:#171b23;--surface:#1c2030;--sur2:#242838;--border:rgba(255,255,255,0.06);--gold:#e8b84b;--red:#e63946;--text:#eef0f4;--text2:#8a95a8;--text3:#4a5268;--r:10px;--ease:cubic-bezier(.4,0,.2,1);--sidebar:220px}
.light{--bg:#f0f3f8;--bg2:#e5e9f2;--bg3:#d5dae6;--surface:#fff;--sur2:#f2f4f9;--border:rgba(0,0,0,0.08);--text:#0b0d14;--text2:#4a526a;--text3:#8892a8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;overflow-x:hidden;display:flex}
button{font-family:inherit;cursor:pointer}a{text-decoration:none;color:inherit}
/* SIDEBAR */
.sidebar{width:var(--sidebar);min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;transition:transform .3s var(--ease)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.logo-mark{font-family:"Bebas Neue",sans-serif;font-size:22px;background:linear-gradient(135deg,var(--gold),#c8943a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:10px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
.nav-section{padding:8px 16px 4px;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text3);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--text2);font-size:13px;font-weight:500;transition:.2s;cursor:pointer;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text);border-left-color:rgba(232,184,75,.3)}
.nav-item.active{background:rgba(232,184,75,.08);color:var(--gold);border-left-color:var(--gold);font-weight:600}
.nav-item .ico{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:10px;margin-left:auto}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.sidebar-footer a{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);padding:6px 0;transition:.2s}
.sidebar-footer a:hover{color:var(--text)}
/* MAIN */
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh}
@media(max-width:768px){.main{margin-left:0}}
/* TOPBAR */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(9,11,15,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);gap:10px}
.light .topbar{background:rgba(240,243,248,.96)}
.topbar-left{display:flex;align-items:center;gap:10px}
.btn-menu{display:none;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text2);font-size:16px;cursor:pointer}
@media(max-width:768px){.btn-menu{display:flex;align-items:center}}
.topbar-title{font-family:"Bebas Neue",sans-serif;font-size:16px;letter-spacing:2px;color:var(--text2)}
.topbar-right{display:flex;align-items:center;gap:8px}
.searchbar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;transition:.2s}
.searchbar:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,184,75,.1)}
.searchbar input{background:none;border:none;outline:none;color:var(--text);font:13px "DM Sans",sans-serif;width:160px}
@media(max-width:480px){.searchbar input{width:90px}}
.searchbar input::placeholder{color:var(--text3)}
.btn-icon{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text2);font-size:15px;transition:.2s;cursor:pointer}
.btn-icon:hover{border-color:var(--gold);color:var(--gold)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}
.overlay.show{display:block}
/* ===================== HERO STAGE (Netflix style) ===================== */
/* Contentor principal do stage — ocupa largura total */
.stage{position:relative;background:#000;overflow:hidden}
/* Desktop: duas colunas — player/hero | lista */
@media(min-width:900px){
  .stage{display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto auto}
}
/* ---- HERO (thumbnail cinematografica) ---- */
.hero-wrap{position:relative;overflow:hidden;background:#090b0f;cursor:pointer}
.hero-wrap{height:240px}
@media(min-width:480px){.hero-wrap{height:320px}}
@media(min-width:900px){.hero-wrap{height:460px;grid-row:1;grid-column:1}}
.hero-wrap.playing{cursor:default}
/* Thumbnail de fundo */
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:15% center;transition:transform .6s ease;display:block}
.hero-wrap:not(.playing):hover .hero-bg{transform:scale(1.02)}
/* Gradiente escurece fortemente o lado direito — elimina fundo rosa */
.hero-bg-overlay{
  position:absolute;inset:0;
  background:
    linear-gradient(to right,  rgba(0,0,0,.97) 0%, rgba(0,0,0,.88) 30%, rgba(0,0,0,.72) 52%, rgba(0,0,0,.96) 72%, rgba(0,0,0,1) 100%),
    linear-gradient(to top,    rgba(0,0,0,.6)  0%, transparent 50%);
  pointer-events:none;
}
/* Player inline substitui a thumbnail */
.hero-player{position:absolute;inset:0;z-index:10;display:none}
.hero-player.show{display:block}
.hero-player iframe{width:100%;height:100%;border:none;display:block}
/* Info sobre o gradiente */
.hero-info{position:absolute;bottom:0;left:0;right:0;padding:20px;z-index:5;pointer-events:none}
@media(min-width:480px){.hero-info{padding:28px}}
@media(min-width:900px){.hero-info{padding:40px 44px;max-width:70%}}
.hero-info.playing{display:none}
.hero-tag{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:2px 8px;border-radius:4px;margin-bottom:8px;width:fit-content}
.hero-ep-label{font-family:"Bebas Neue",sans-serif;font-size:12px;letter-spacing:3px;color:var(--gold);margin-bottom:4px}
.hero-title{font-family:"Bebas Neue",sans-serif;font-size:28px;line-height:1.05;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.9);margin-bottom:8px}
@media(min-width:480px){.hero-title{font-size:36px}}
@media(min-width:900px){.hero-title{font-size:50px;margin-bottom:10px}}
.hero-title em{color:var(--gold);font-style:normal}
.hero-meta-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hero-season-badge{background:rgba(232,184,75,.15);border:1px solid rgba(232,184,75,.3);color:var(--gold);font-size:11px;font-weight:700;padding:2px 9px;border-radius:4px}
.hero-date-txt{color:rgba(255,255,255,.5);font-size:12px}
.hero-desc{color:rgba(255,255,255,.55);font-size:13px;line-height:1.55;max-width:380px;margin-bottom:18px;display:none}
@media(min-width:900px){.hero-desc{display:block}}
/* Botoes pointer-events: all para clicar */
.hero-btns{display:flex;gap:8px;pointer-events:all}
.btn-play-hero{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--gold),#c8943a);color:#090b0f;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:700;transition:.2s;cursor:pointer}
@media(min-width:900px){.btn-play-hero{padding:13px 28px;font-size:15px}}
.btn-play-hero:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,184,75,.4)}
.btn-yt-hero{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:10px 16px;font-size:13px;backdrop-filter:blur(6px);transition:.2s;cursor:pointer;text-decoration:none}
.btn-yt-hero:hover{background:rgba(255,255,255,.2)}
/* Barra de controle enquanto player ativo */
.hero-ctrl{position:absolute;top:0;left:0;right:0;padding:12px 16px;z-index:20;display:none;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent)}
.hero-wrap.playing .hero-ctrl{display:flex}
.ctrl-info{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.ctrl-info span{color:var(--gold);margin-right:8px}
.btn-close-hero{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px);transition:.2s;white-space:nowrap}
.btn-close-hero:hover{background:rgba(255,255,255,.25)}
/* ---- EPISODE LIST (sidebar direita) ---- */
.ep-sidebar{background:rgba(0,0,0,.6);overflow-y:auto;border-left:1px solid rgba(255,255,255,.05)}
@media(max-width:899px){.ep-sidebar{display:none}}
@media(min-width:900px){.ep-sidebar{grid-row:1;grid-column:2;max-height:460px}}
.ep-sidebar-hdr{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(9,11,15,.95);backdrop-filter:blur(8px)}
.ep-sidebar-hdr h3{font-family:"Bebas Neue",sans-serif;font-size:14px;letter-spacing:2px;color:var(--text2)}
.ep-sidebar-cnt{font-size:11px;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1px 7px}
.ep-row{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:.2s;border-bottom:1px solid rgba(255,255,255,.04)}
.ep-row:hover{background:rgba(255,255,255,.05)}
.ep-row.active{background:rgba(232,184,75,.08);border-left:3px solid var(--gold)}
.ep-thumb{width:80px;flex-shrink:0;aspect-ratio:16/9;border-radius:5px;overflow:hidden;position:relative;background:var(--bg3)}
.ep-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ep-thumb-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);opacity:0;transition:.2s}
.ep-row:hover .ep-thumb-play{opacity:1}
.ep-row.active .ep-thumb-play{opacity:1}
.ep-thumb-play span{width:24px;height:24px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:10px;color:#090b0f}
.ep-info{flex:1;min-width:0}
.ep-info-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.ep-num{font-family:"Bebas Neue",sans-serif;font-size:11px;letter-spacing:1px;color:var(--gold)}
.ep-new{background:var(--red);color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:3px;letter-spacing:1px;text-transform:uppercase}
.ep-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-date{font-size:10px;color:var(--text3);margin-top:2px}
/* ---- FILTERS + GRID (abaixo do stage) ---- */
.filters{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;flex-wrap:wrap;gap:10px;border-top:1px solid var(--border)}
@media(min-width:768px){.filters{padding:20px 32px 14px}}
.sec-title{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:2px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";display:block;width:4px;height:20px;border-radius:2px;background:linear-gradient(180deg,var(--gold),#c8943a)}
.cnt{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--text3);font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 14px;color:var(--text2);font-size:12px;font-weight:500;transition:.2s;cursor:pointer}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab.on{background:linear-gradient(135deg,var(--gold),#c8943a);border-color:transparent;color:#090b0f;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 48px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:14px;padding:0 20px 52px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:16px;padding:0 32px 64px}}
@media(min-width:1300px){.grid{grid-template-columns:repeat(5,1fr);gap:18px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:.22s var(--ease);animation:fadeUp .35s ease both}
.card:hover{transform:translateY(-5px) scale(1.015);border-color:rgba(232,184,75,.5);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.card.playing{border-color:var(--gold)!important;box-shadow:0 0 0 2px var(--gold),0 12px 36px rgba(232,184,75,.25)!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg3)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .4s ease;display:block}
.card:hover .thumb img{transform:scale(1.07)}
.thumb-ov{position:absolute;inset:0;background:rgba(9,11,15,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:.22s var(--ease)}
.card:hover .thumb-ov,.card.playing .thumb-ov{opacity:1}
.play-circle{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#c8943a);display:flex;align-items:center;justify-content:center;font-size:16px;color:#090b0f;box-shadow:0 4px 16px rgba(232,184,75,.5);transform:scale(.8);transition:transform .2s ease}
@media(min-width:600px){.play-circle{width:48px;height:48px;font-size:18px}}
.card:hover .play-circle,.card.playing .play-circle{transform:scale(1)}
.card.playing .play-circle{background:var(--red)}
.ep-badge{position:absolute;top:6px;left:6px;background:rgba(9,11,15,.88);border:1px solid var(--gold);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;color:var(--gold)}
.new-badge{position:absolute;top:6px;right:6px;background:var(--red);border-radius:4px;padding:1px 6px;font-size:9px;font-weight:800;color:#fff;letter-spacing:1px;text-transform:uppercase}
.now-playing{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap}
.card-body{padding:9px 11px}
@media(min-width:600px){.card-body{padding:11px 13px}}
.card-title{font-size:11px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(min-width:900px){.card-title{font-size:12px}}
.card-footer{display:flex;align-items:center;justify-content:space-between;color:var(--text3);font-size:10px}
.card-date{color:var(--gold);font-weight:600}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3)}
.empty .ico{font-size:40px;margin-bottom:12px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--sur2);border-radius:2px}
</style></head><body>

var activeSeason="Todos",searchTerm="",selectedIdx=0,playingId=null;
/* === HERO === */
function setHero(idx){
  selectedIdx=idx;
  var v=videos[idx];
  var bg=document.getElementById("heroBg");
  bg.dataset.id=v.id;
  bg.src="https://img.youtube.com/vi/"+v.id+"/maxresdefault.jpg";
  document.getElementById("heroEpLabel").textContent="EPISODIO #"+v.ep+" - TEMPORADA "+v.season;
  document.getElementById("heroTitle").innerHTML="<em>"+v.title+"</em> - "+v.date;
  document.getElementById("heroSeason").textContent="T"+v.season;
  document.getElementById("heroDate").textContent=v.date;
  document.getElementById("heroDesc").textContent=v.desc||"";
  document.getElementById("heroYtLink").href=v.url;
  /* Atualiza tag "Mais recente" so no primeiro */
  document.querySelector(".hero-tag").style.display=idx===0?"inline-flex":"none";
  renderEpSidebar();
  renderGrid();
}
function handleHeroClick(){
  /* So clica se nao tiver player aberto */
  if(document.getElementById("heroPlayer").classList.contains("show"))return;
  playHero();
}
function playHero(){
  var v=videos[selectedIdx];
  playingId=v.id;
  document.getElementById("heroIframe").src="https://www.youtube.com/embed/"+v.id+"?autoplay=1&rel=0&modestbranding=1&fs=1";
  document.getElementById("heroPlayer").classList.add("show");
  document.getElementById("heroWrap").classList.add("playing");
  document.getElementById("heroInfo").classList.add("playing");
  document.getElementById("ctrlEp").textContent="#"+v.ep+" ";
  document.getElementById("ctrlTitle").textContent=v.title+" - "+v.date;
  document.getElementById("ctrlYt").href=v.url;
  renderEpSidebar();
  renderGrid();
}
function closeHero(){
  playingId=null;
  document.getElementById("heroIframe").src="about:blank";
  document.getElementById("heroPlayer").classList.remove("show");
  document.getElementById("heroWrap").classList.remove("playing");
  document.getElementById("heroInfo").classList.remove("playing");
  renderEpSidebar();
  renderGrid();
}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeHero();});
/* === EP SIDEBAR LIST === */
function renderEpSidebar(){
  var list=document.getElementById("epSidebarList");
  document.getElementById("epSidebarCnt").textContent=videos.length;
  list.innerHTML=videos.map(function(v,i){
    var active=i===selectedIdx;
    var playing=v.id===playingId;
    return "<div class=\"ep-row"+(active?" active":"")+"\" onclick=\"onEpClick("+i+")\" >"+
      "<div class=\"ep-thumb\">"+
        "<img src=\"https://img.youtube.com/vi/"+v.id+"/hqdefault.jpg\" alt=\"\">"+
        "<div class=\"ep-thumb-play\"><span>"+(playing?"&#9646;&#9646;":"&#9654;")+"</span></div>"+
      "</div>"+
      "<div class=\"ep-info\">"+
        "<div class=\"ep-info-top\"><span class=\"ep-num\">#"+v.ep+"</span>"+(v.isNew?"<span class=\"ep-new\">Novo</span>":"")+"</div>"+
        "<div class=\"ep-title\">"+v.title+" - "+v.date+"</div>"+
        "<div class=\"ep-date\">"+v.date+" &middot; T"+v.season+"</div>"+
      "</div>"+
    "</div>";
  }).join("");
}
function onEpClick(i){
  /* Se ja estava selecionado, da play direto */
  if(i===selectedIdx&&!document.getElementById("heroPlayer").classList.contains("show")){
    playHero();return;
  }
  closeHero();
  setHero(i);
  window.scrollTo({top:0,behavior:"smooth"});
}
/* === TABS & GRID === */
function initTabs(){
  var seen={},seasons=["Todos"];
  videos.forEach(function(v){if(!seen[v.season]){seen[v.season]=1;seasons.push(v.season);}});
  document.getElementById("tabs").innerHTML=seasons.map(function(s){
    return "<button class=\"tab "+(s===activeSeason?"on":"")+"\" onclick=\"setSeason('"+s+"')\">"+(s==="Todos"?"Todos":"T"+s)+"</button>";
  }).join("");
}
function setSeason(s){
  activeSeason=s;
  document.querySelectorAll(".tab").forEach(function(b){var l=b.textContent.trim();b.classList.toggle("on",(s==="Todos"&&l==="Todos")||(s!=="Todos"&&l==="T"+s));});
  renderGrid();
}
function renderGrid(){
  var list=videos.filter(function(v){
    return(activeSeason==="Todos"||v.season===activeSeason)
      &&(v.title.toLowerCase().indexOf(searchTerm.toLowerCase())>=0
      ||String(v.ep).indexOf(searchTerm)>=0
      ||v.date.toLowerCase().indexOf(searchTerm.toLowerCase())>=0);
  });
  document.getElementById("cnt").textContent=list.length;
  var grid=document.getElementById("grid");
  if(!list.length){grid.innerHTML="<div class=\"empty\"><div class=\"ico\">&#127916;</div><p>Nenhum episodio encontrado.</p></div>";return;}
  grid.innerHTML=list.map(function(v,i){
    var sel=videos.indexOf(v)===selectedIdx;
    var play=v.id===playingId;
    return "<div class=\"card"+(play?" playing":sel?" playing":"")+"\" style=\"animation-delay:"+(i*.04)+"s\" onclick=\"gridClick('"+v.id+"')\">"+
      "<div class=\"thumb\">"+
        "<img src=\"https://img.youtube.com/vi/"+v.id+"/hqdefault.jpg\" alt=\"\" loading=\"lazy\">"+
        "<div class=\"thumb-ov\"><div class=\"play-circle\">"+(play?"&#9646;&#9646;":"&#9654;")+"</div></div>"+
        "<div class=\"ep-badge\">#"+v.ep+"</div>"+
        (v.isNew?"<div class=\"new-badge\">Novo</div>":"")+
        (play?"<div class=\"now-playing\">&#9679; Reproduzindo</div>":"")+
      "</div>"+
      "<div class=\"card-body\">"+
        "<div class=\"card-title\">"+v.title+" - "+v.date+"</div>"+
        "<div class=\"card-footer\"><span class=\"card-date\">"+v.date+"</span><span style=\"color:var(--text3)\">T"+v.season+"</span></div>"+
      "</div></div>";
  }).join("");
}
function gridClick(id){
  var idx=videos.findIndex(function(v){return v.id===id;});
  if(idx<0)return;
  closeHero();
  setHero(idx);
  window.scrollTo({top:0,behavior:"smooth"});
  /* No mobile, dar play direto */
  if(window.innerWidth<900)setTimeout(playHero,200);
}
function doFilter(){searchTerm=document.getElementById("q").value;renderGrid();}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("overlay").classList.toggle("show");}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("overlay").classList.remove("show");}
function toggleTheme(){var l=document.body.classList.toggle("light");document.getElementById("themeBtn").textContent=l?"&#9728;":"&#127769;";try{localStorage.setItem("g20flix-theme",l?"light":"dark");}catch(e){}}
(function(){
  try{if(localStorage.getItem("g20flix-theme")==="light"){document.body.classList.add("light");document.getElementById("themeBtn").textContent="&#9728;";}}catch(e){}
  setHero(0);
  initTabs();
  renderGrid();
})();
</script></body></html>
