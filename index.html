<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G20Flix - G20 Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b0f;--bg2:#0f1117;--bg3:#171b23;--surface:#1c2030;--sur2:#242838;--border:rgba(255,255,255,0.06);--gold:#e8b84b;--red:#e63946;--text:#eef0f4;--text2:#8a95a8;--text3:#4a5268;--r:10px;--ease:cubic-bezier(.4,0,.2,1)}
.light{--bg:#f0f3f8;--bg2:#e5e9f2;--bg3:#d5dae6;--surface:#fff;--sur2:#f2f4f9;--border:rgba(0,0,0,0.08);--text:#0b0d14;--text2:#4a526a;--text3:#8892a8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
/* HEADER */
.hdr{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(9,11,15,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.light .hdr{background:rgba(240,243,248,.96)}
.hdr-logo{display:flex;align-items:center;gap:8px}
.logo-pill{background:linear-gradient(135deg,var(--gold),#c8943a);color:#090b0f;font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:1px;line-height:1;padding:4px 10px;border-radius:6px}
.logo-word{font-family:"Bebas Neue",sans-serif;font-size:16px;letter-spacing:4px;color:var(--text2)}
.hdr-right{display:flex;align-items:center;gap:8px}
.searchbar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;transition:.2s var(--ease)}
.searchbar:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,184,75,.1)}
.searchbar input{background:none;border:none;outline:none;color:var(--text);font:13px "DM Sans",sans-serif;width:120px}
@media(min-width:480px){.searchbar input{width:180px}}
.searchbar input::placeholder{color:var(--text3)}
.btn-icon{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text2);font-size:15px;transition:.2s var(--ease)}
.btn-icon:hover{border-color:var(--gold);color:var(--gold)}
/* PLAYER */
#player-zone{background:#000;max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}
#player-zone.open{max-height:800px}
.player-wrap iframe{width:100%;aspect-ratio:16/9;height:auto;border:none;display:block}
.player-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.p-info{flex:1;min-width:0}
.p-ep{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:2px}
.p-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-meta{font-size:11px;color:var(--text3)}
.p-actions{display:flex;gap:6px;flex-shrink:0}
.btn-yt{display:flex;align-items:center;gap:5px;background:var(--red);color:#fff;border:none;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;transition:.2s var(--ease)}
.btn-yt:hover{background:#c0303b}
.btn-close-p{background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:7px 12px;font-size:12px;transition:.2s var(--ease)}
.btn-close-p:hover{background:var(--sur2);color:var(--text)}
/* HERO */
.hero{position:relative;height:220px;overflow:hidden;cursor:pointer;background:var(--bg3);transition:height .45s var(--ease),opacity .35s ease}
@media(min-width:480px){.hero{height:320px}}
@media(min-width:768px){.hero{height:460px}}
.hero.hidden{height:0!important;opacity:0;pointer-events:none}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .6s ease;display:block}
.hero:hover .hero-img{transform:scale(1.03)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,11,15,.97) 0%,rgba(9,11,15,.82) 40%,rgba(9,11,15,.62) 65%,rgba(9,11,15,.45) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:20px 16px}
@media(min-width:480px){.hero-grad{padding:28px 24px}}
@media(min-width:768px){.hero-grad{padding:48px 52px}}
.hero-tag{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-bottom:8px;width:fit-content}
.hero-title{font-family:"Bebas Neue",sans-serif;font-size:28px;line-height:1;color:#fff;margin-bottom:6px;text-shadow:0 2px 16px rgba(0,0,0,.7)}
@media(min-width:480px){.hero-title{font-size:38px}}
@media(min-width:768px){.hero-title{font-size:52px}}
.hero-title em{color:var(--gold);font-style:normal}
.hero-sub{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.5);font-size:11px;margin-bottom:14px}
.hero-sub strong{color:var(--gold);font-weight:600}
.hero-btns{display:flex;gap:8px}
.btn-play-h{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--gold),#c8943a);color:#090b0f;border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:700;transition:.2s var(--ease)}
@media(min-width:480px){.btn-play-h{padding:11px 22px;font-size:14px}}
.btn-play-h:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,184,75,.4)}
.btn-info-h{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:9px 14px;font-size:13px;backdrop-filter:blur(6px);transition:.2s var(--ease)}
.btn-info-h:hover{background:rgba(255,255,255,.22)}
/* FILTERS */
.filters{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;flex-wrap:wrap;gap:10px}
@media(min-width:480px){.filters{padding:24px 24px 14px}}
@media(min-width:768px){.filters{padding:28px 32px 16px}}
.sec-title{font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:2px;display:flex;align-items:center;gap:8px}
@media(min-width:480px){.sec-title{font-size:22px}}
.sec-title::before{content:"";display:block;width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--gold),#c8943a)}
.cnt{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--text3);font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 12px;color:var(--text2);font-size:12px;font-weight:500;transition:.2s var(--ease)}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab.on{background:linear-gradient(135deg,var(--gold),#c8943a);border-color:transparent;color:#090b0f;font-weight:700}
/* GRID — 2 colunas no mobile, mais no desktop */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 48px}
@media(min-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:14px;padding:0 16px 52px}}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px;padding:0 20px 56px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:18px;padding:0 32px 64px}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:.22s var(--ease);animation:fadeUp .35s ease both}
.card:hover{transform:translateY(-4px) scale(1.01);border-color:rgba(232,184,75,.5);box-shadow:0 10px 28px rgba(0,0,0,.4)}
.card.playing{border-color:var(--gold)!important;box-shadow:0 0 0 2px var(--gold),0 10px 32px rgba(232,184,75,.25)!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg3)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .4s ease;display:block}
.card:hover .thumb img{transform:scale(1.06)}
.thumb-ov{position:absolute;inset:0;background:rgba(9,11,15,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:.22s var(--ease)}
.card:hover .thumb-ov,.card.playing .thumb-ov{opacity:1}
.play-circle{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#c8943a);display:flex;align-items:center;justify-content:center;font-size:15px;color:#090b0f;box-shadow:0 4px 16px rgba(232,184,75,.5);transform:scale(.8);transition:transform .2s ease}
@media(min-width:480px){.play-circle{width:48px;height:48px;font-size:18px}}
.card:hover .play-circle,.card.playing .play-circle{transform:scale(1)}
.card.playing .play-circle{background:var(--red)}
.ep-badge{position:absolute;top:6px;left:6px;background:rgba(9,11,15,.88);border:1px solid var(--gold);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;color:var(--gold);backdrop-filter:blur(4px)}
.new-badge{position:absolute;top:6px;right:6px;background:var(--red);border-radius:4px;padding:1px 6px;font-size:9px;font-weight:800;color:#fff;letter-spacing:1px;text-transform:uppercase}
.now-playing{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap}
.card-body{padding:8px 10px}
@media(min-width:480px){.card-body{padding:11px 13px}}
.card-title{font-size:11px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(min-width:480px){.card-title{font-size:12px}}
@media(min-width:768px){.card-title{font-size:13px}}
.card-footer{display:flex;align-items:center;justify-content:space-between;color:var(--text3);font-size:10px}
.card-date{color:var(--gold);font-weight:600;font-size:10px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3)}
.empty .ico{font-size:40px;margin-bottom:12px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--sur2);border-radius:2px}
</style></head><body>
<header class="hdr">
<div class="hdr-logo"><div class="logo-pill">G20</div><span class="logo-word">FLIX</span></div>
<div class="hdr-right">
<div class="searchbar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--text3)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="q" type="text" placeholder="Buscar..." oninput="doFilter()"></div>
<button class="btn-icon" id="themeBtn" onclick="toggleTheme()">&#127769;</button>
</div></header>
<div id="player-zone">
<div class="player-wrap"><iframe id="yt-frame" allowfullscreen allow="encrypted-media; picture-in-picture" src="about:blank"></iframe></div>
<div class="player-bar">
<div class="p-info"><div class="p-ep" id="p-ep"></div><div class="p-title" id="p-title"></div><div class="p-meta" id="p-meta"></div></div>
<div class="p-actions"><a class="btn-yt" id="p-yt" href="#" target="_blank">&#9654; YouTube</a><button class="btn-close-p" onclick="closePlayer()">&#10005;</button></div>
</div></div>
<div class="hero" id="hero" onclick="playVideo(videos[0])">
<img class="hero-img" id="hero-img" src="" alt="" onerror="this.src='https://img.youtube.com/vi/'+this.dataset.id+'/hqdefault.jpg'">
<div class="hero-grad">
<div class="hero-tag">&#9679; Mais recente</div>
<div class="hero-title" id="hero-title"></div>
<div class="hero-sub"><strong id="hero-season"></strong><span>&#183;</span><span id="hero-date"></span></div>
<div class="hero-btns">
<button class="btn-play-h">&#9654; Assistir</button>
<button class="btn-info-h" onclick="event.stopPropagation()">&#9432;</button>
</div></div></div>
<div class="filters">
<div class="sec-title">Episodios&#160;<span class="cnt" id="cnt">0</span></div>
<div class="tabs" id="tabs"></div>
</div>
<div class="grid" id="grid"></div>
<script>
var videos=[
{id:"uRuxonYqLn4",ep:80,title:"Aporte G20 - Marco 2026",season:"2026",date:"Mar 2026",isNew:true,url:"https://www.youtube.com/watch?v=uRuxonYqLn4"},
{id:"5Bb0v9tTpq8",ep:79,title:"Aporte G20 - Fevereiro 2026",season:"2026",date:"Fev 2026",isNew:false,url:"https://www.youtube.com/watch?v=5Bb0v9tTpq8"},
{id:"GdQJzXsICTM",ep:78,title:"Aporte G20 - Janeiro 2026",season:"2026",date:"Jan 2026",isNew:false,url:"https://www.youtube.com/watch?v=GdQJzXsICTM"},
{id:"e7zbxQSch24",ep:77,title:"Aporte G20 - Dezembro 2025",season:"2025",date:"Dez 2025",isNew:false,url:"https://www.youtube.com/watch?v=e7zbxQSch24"},
{id:"cbyCHlyKIp0",ep:76,title:"Aporte G20 - Novembro 2025",season:"2025",date:"Nov 2025",isNew:false,url:"https://www.youtube.com/watch?v=cbyCHlyKIp0"},
{id:"lwvX9_RrFvc",ep:75,title:"Aporte G20 - Outubro 2025",season:"2025",date:"Out 2025",isNew:false,url:"https://www.youtube.com/watch?v=lwvX9_RrFvc"},
{id:"5GYsxwh7JoE",ep:74,title:"Aporte G20 - Setembro 2025",season:"2025",date:"Set 2025",isNew:false,url:"https://www.youtube.com/watch?v=5GYsxwh7JoE"},
{id:"8KlPHG1gIMw",ep:73,title:"Aporte G20 - Agosto 2025",season:"2025",date:"Ago 2025",isNew:false,url:"https://www.youtube.com/watch?v=8KlPHG1gIMw"}
];
var activeSeason="Todos",searchTerm="",playingId=null,isDark=true;
function initHero(){var v=videos[0],img=document.getElementById("hero-img");img.dataset.id=v.id;img.src="https://img.youtube.com/vi/"+v.id+"/maxresdefault.jpg";document.getElementById("hero-title").innerHTML="#"+v.ep+" - <em>"+v.title.replace("Aporte G20 - ","")+"</em>";document.getElementById("hero-season").textContent="Temporada "+v.season;document.getElementById("hero-date").textContent=v.date;}
function initTabs(){var seen={},seasons=["Todos"];videos.forEach(function(v){if(!seen[v.season]){seen[v.season]=1;seasons.push(v.season);}});document.getElementById("tabs").innerHTML=seasons.map(function(s){return "<button class=\"tab "+(s===activeSeason?"on":"")+"\" onclick=\"setSeason('"+s+"')\">"+(s==="Todos"?"Todos":"T"+s)+"</button>";}).join("");}
function setSeason(s){activeSeason=s;document.querySelectorAll(".tab").forEach(function(b){var l=b.textContent.trim();b.classList.toggle("on",(s==="Todos"&&l==="Todos")||(s!=="Todos"&&l==="T"+s));});render();}
function render(){var list=videos.filter(function(v){return(activeSeason==="Todos"||v.season===activeSeason)&&(v.title.toLowerCase().indexOf(searchTerm.toLowerCase())>=0||String(v.ep).indexOf(searchTerm)>=0);});document.getElementById("cnt").textContent=list.length;var grid=document.getElementById("grid");if(!list.length){grid.innerHTML="<div class=\"empty\"><div class=\"ico\">&#127916;</div><p>Nenhum episodio encontrado.</p></div>";return;}grid.innerHTML=list.map(function(v,i){return "<div class=\"card "+(v.id===playingId?"playing":"")+"\" style=\"animation-delay:"+(i*.04)+"s\" onclick=\"playVideo(videos.filter(function(x){return x.id==='"+v.id+"';})[0])\"><div class=\"thumb\"><img src=\"https://img.youtube.com/vi/"+v.id+"/hqdefault.jpg\" alt=\"\" loading=\"lazy\"><div class=\"thumb-ov\"><div class=\"play-circle\">"+(v.id===playingId?"&#9646;&#9646;":"&#9654;")+"</div></div><div class=\"ep-badge\">#"+v.ep+"</div>"+(v.isNew?"<div class=\"new-badge\">Novo</div>":"")+(v.id===playingId?"<div class=\"now-playing\">&#9679; Reproduzindo</div>":"")+"</div><div class=\"card-body\"><div class=\"card-title\">"+v.title+"</div><div class=\"card-footer\"><span class=\"card-date\">"+v.date+"</span><span style=\"color:var(--text3)\">T"+v.season+"</span></div></div></div>";}).join("");}
function doFilter(){searchTerm=document.getElementById("q").value;render();}
function playVideo(v){if(!v)return;if(playingId===v.id){closePlayer();return;}playingId=v.id;document.getElementById("yt-frame").src="https://www.youtube.com/embed/"+v.id+"?rel=0&modestbranding=1&fs=1";document.getElementById("p-ep").textContent="EP #"+v.ep+" - T"+v.season;document.getElementById("p-title").textContent=v.title;document.getElementById("p-meta").textContent=v.date;document.getElementById("p-yt").href=v.url;document.getElementById("hero").classList.add("hidden");document.getElementById("player-zone").classList.add("open");window.scrollTo({top:0,behavior:"smooth"});render();}
function closePlayer(){playingId=null;document.getElementById("player-zone").classList.remove("open");document.getElementById("yt-frame").src="about:blank";document.getElementById("hero").classList.remove("hidden");render();}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePlayer();});
function toggleTheme(){isDark=!isDark;document.body.classList.toggle("light",!isDark);document.getElementById("themeBtn").textContent=isDark?"&#127769;":"&#9728;";try{localStorage.setItem("g20flix-theme",isDark?"dark":"light");}catch(e){}}
(function(){try{if(localStorage.getItem("g20flix-theme")==="light"){isDark=false;document.body.classList.add("light");document.getElementById("themeBtn").textContent="&#9728;";}}catch(e){}initHero();initTabs();render();})();
</script></body></html>
