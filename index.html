<div class="main">
<header class="topbar">
  <div class="topbar-left"><button class="btn-menu" onclick="toggleSidebar()">&#9776;</button><span class="topbar-title">G20FLIX</span></div>
  <div class="topbar-right">
    <div class="searchbar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--text3)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="q" type="text" placeholder="Buscar..." oninput="doFilter()"></div>
    <button class="btn-icon" id="themeBtn" onclick="toggleTheme()">&#127769;</button>
  </div>
</header>
<!-- HERO: largura total, thumbnail real de fundo -->
<div class="hero-wrap" id="heroWrap" onclick="handleHeroClick()">
  <img class="hero-bg" id="heroBg" src="" alt="" onerror="if(this.src.indexOf('maxres')>=0){this.src='https://img.youtube.com/vi/'+this.dataset.id+'/hqdefault.jpg';}">
  <div class="hero-bg-overlay"></div>
  <div class="hero-player" id="heroPlayer">
    <iframe id="heroIframe" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" src="about:blank"></iframe>
  </div>
  <div class="hero-ctrl">
    <div class="ctrl-info"><span id="ctrlEp"></span><span id="ctrlTitle"></span></div>
    <button class="btn-close-hero" onclick="event.stopPropagation();closeHero()">&#10005; Fechar</button>
  </div>
  <div class="hero-info" id="heroInfo">
    <div class="hero-tag" id="heroTag">&#9679; Mais recente</div>
    <div class="hero-ep-label" id="heroEpLabel"></div>
    <div class="hero-title" id="heroTitle"></div>
    <div class="hero-meta-row"><span class="hero-season-badge" id="heroSeason"></span><span class="hero-date-txt" id="heroDate"></span></div>
    <div class="hero-desc" id="heroDesc"></div>
    <div class="hero-btns">
      <button class="btn-play-hero" onclick="event.stopPropagation();playHero()">&#9654;&nbsp; Assistir Agora</button>
      <a class="btn-yt-hero" id="heroYtLink" href="#" target="_blank" onclick="event.stopPropagation()">&#9654; YouTube</a>
    </div>
  </div>
</div>
<div class="filters"><div class="sec-title">Episodios&#160;<span class="cnt" id="cnt">0</span></div><div class="tabs" id="tabs"></div></div>
<div class="grid" id="grid"></div>
</div>
<script>
var videos=[
{id:"uRuxonYqLn4",ep:80,title:"Aporte da Carteira G20",season:"2026",date:"Marco 2026",desc:"Analise completa da carteira G20 com aportes mensais, rebalanceamento e estrategia de longo prazo.",isNew:true,url:"https://www.youtube.com/watch?v=uRuxonYqLn4"},
{id:"5Bb0v9tTpq8",ep:79,title:"Aporte da Carteira G20",season:"2026",date:"Fevereiro 2026",desc:"",isNew:false,url:"https://www.youtube.com/watch?v=5Bb0v9tTpq8"},
{id:"GdQJzXsICTM",ep:78,title:"Aporte da Carteira G20",season:"2026",date:"Janeiro 2026",desc:"",isNew:false,url:"https://www.youtube.com/watch?v=GdQJzXsICTM"},
{id:"e7zbxQSch24",ep:77,title:"Aporte da Carteira G20",season:"2025",date:"Dezembro 2025",desc:"",isNew:false,url:"https://www.youtube.com/watch?v=e7zbxQSch24"},
{id:"cbyCHlyKIp0",ep:76,title:"Aporte da Carteira G20",season:"2025",date:"Novembro 2025",desc:"",isNew:false,url:"https://www.youtube.com/watch?v=cbyCHlyKIp0"},
{id:"lwvX9_RrFvc",ep:75,title:"Aporte da Carteira G20",season:"2025",date:"Outubro 2025",desc:"",isNew:false,url:"https://www.youtube.com/watch?v=lwvX9_RrFvc"},
{id:"5GYsxwh7JoE",ep:74,title:"Aporte da Carteira G20",season:"2025",date:"Setembro 2025",desc:"",isNew:false,url:"https://www.youtube.com/watch?v=5GYsxwh7JoE"},
{id:"8KlPHG1gIMw",ep:73,title:"Aporte da Carteira G20",season:"2025",date:"Agosto 2025",desc:"",isNew:false,url:"https://www.youtube.com/watch?v=8KlPHG1gIMw"}
];
var activeSeason="Todos",searchTerm="",selectedIdx=0,playingId=null;
function setHero(idx){
  selectedIdx=idx;
  var v=videos[idx];
  var bg=document.getElementById("heroBg");
  bg.dataset.id=v.id;
  /* Thumbnail real do YouTube como fundo do hero */
  bg.src="https://img.youtube.com/vi/"+v.id+"/maxresdefault.jpg";
  document.getElementById("heroEpLabel").textContent="EPISODIO #"+v.ep+" · TEMPORADA "+v.season;
  document.getElementById("heroTitle").innerHTML="<em>"+v.title+"</em> - "+v.date;
  document.getElementById("heroSeason").textContent="T"+v.season;
  document.getElementById("heroDate").textContent=v.date;
  document.getElementById("heroDesc").textContent=v.desc||"";
  document.getElementById("heroYtLink").href=v.url;
  document.getElementById("heroTag").style.display=idx===0?"inline-flex":"none";
  renderGrid();
}
function handleHeroClick(){
  if(document.getElementById("heroPlayer").classList.contains("show"))return;
  playHero();
}
function playHero(){
  var v=videos[selectedIdx];
  playingId=v.id;
  document.getElementById("heroIframe").src="https://www.youtube.com/embed/"+v.id+"?autoplay=1&mute=0&rel=0&modestbranding=1&fs=1&enablejsapi=1";
  document.getElementById("heroPlayer").classList.add("show");
  document.getElementById("heroWrap").classList.add("playing");
  document.getElementById("heroInfo").classList.add("playing");
  document.getElementById("ctrlEp").textContent="#"+v.ep+" ";
  document.getElementById("ctrlTitle").textContent=v.title+" - "+v.date;
  
  renderGrid();
}
function closeHero(){
  playingId=null;
  document.getElementById("heroIframe").src="about:blank";
  document.getElementById("heroPlayer").classList.remove("show");
  document.getElementById("heroWrap").classList.remove("playing");
  document.getElementById("heroInfo").classList.remove("playing");
  renderGrid();
}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeHero();});
function initTabs(){
  var seen={},seasons=["Todos"];
  videos.forEach(function(v){if(!seen[v.season]){seen[v.season]=1;seasons.push(v.season);}});
  document.getElementById("tabs").innerHTML=seasons.map(function(s){
    return "<button class=\"tab "+(s===activeSeason?"on":"")+"\" onclick=\"setSeason('"+s+"')\">"+(s==="Todos"?"Todos":"T"+s)+"</button>";
  }).join("");
}
function setSeason(s){
  activeSeason=s;
  document.querySelectorAll(".tab").forEach(function(b){var l=b.textContent.trim();b.classList.toggle("on",(s==="Todos"&&l==="Todos")||(s!=="Todos"&&l==="T"+s));});
  renderGrid();
}
function renderGrid(){
  var list=videos.filter(function(v){
    return(activeSeason==="Todos"||v.season===activeSeason)
      &&(v.title.toLowerCase().indexOf(searchTerm.toLowerCase())>=0
      ||String(v.ep).indexOf(searchTerm)>=0
      ||v.date.toLowerCase().indexOf(searchTerm.toLowerCase())>=0);
  });
  document.getElementById("cnt").textContent=list.length;
  var grid=document.getElementById("grid");
  if(!list.length){grid.innerHTML="<div class=\"empty\"><div class=\"ico\">&#127916;</div><p>Nenhum episodio encontrado.</p></div>";return;}
  grid.innerHTML=list.map(function(v,i){
    var isSel=videos.indexOf(v)===selectedIdx&&!playingId;
    var isPlay=v.id===playingId;
    return "<div class=\"card"+(isPlay?" playing":isSel?" selected":"")+"\" style=\"animation-delay:"+(i*.03)+"s\" onclick=\"gridClick('"+v.id+"')\">"+
      "<div class=\"thumb\">"+
        "<img src=\"https://img.youtube.com/vi/"+v.id+"/hqdefault.jpg\" alt=\"\" loading=\"lazy\">"+
        "<div class=\"thumb-ov\"><div class=\"play-circle\">"+(isPlay?"&#9646;&#9646;":"&#9654;")+"</div></div>"+
        "<div class=\"ep-badge\">#"+v.ep+"</div>"+
        (v.isNew?"<div class=\"new-badge\">Novo</div>":"")+
        (isPlay?"<div class=\"now-playing\">&#9679; Ao Vivo</div>":"")+
      "</div>"+
      "<div class=\"card-body\">"+
        "<div class=\"card-title\">"+v.title+" - "+v.date+"</div>"+
        "<div class=\"card-footer\"><span class=\"card-date\">"+v.date+"</span><span style=\"color:var(--text3)\">T"+v.season+"</span></div>"+
      "</div></div>";
  }).join("");
}
function gridClick(id){
  var idx=videos.findIndex(function(v){return v.id===id;});
  if(idx<0)return;
  if(idx===selectedIdx&&!playingId){playHero();return;}
  closeHero();
  setHero(idx);
  window.scrollTo({top:0,behavior:"smooth"});
}
function doFilter(){searchTerm=document.getElementById("q").value;renderGrid();}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("overlay").classList.toggle("show");}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("overlay").classList.remove("show");}
function toggleTheme(){var l=document.body.classList.toggle("light");document.getElementById("themeBtn").textContent=l?"&#9728;":"&#127769;";try{localStorage.setItem("g20flix-theme",l?"light":"dark");}catch(e){}}
(function(){
  try{if(localStorage.getItem("g20flix-theme")==="light"){document.body.classList.add("light");document.getElementById("themeBtn").textContent="&#9728;";}}catch(e){}
  setHero(0);
  initTabs();
})();
</script></body></html>
