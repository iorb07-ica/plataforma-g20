<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Seed Ranking</title>
<style>
body{background:#1a191e;color:#e8e6e3;font-family:Arial,sans-serif;padding:24px}
h1{color:#c9a961;font-size:20px}
.item{background:#27252c;border-radius:8px;padding:10px 14px;margin:6px 0;font-size:14px}
.ok{color:#5dbb63}.bad{color:#e05d5d}.info{color:#c9a961}
button{background:#c9a961;color:#1a191e;border:none;padding:10px 24px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin:4px}
button:disabled{opacity:.5;cursor:not-allowed}
#status{margin-bottom:12px;font-size:14px;color:#9a958e}
</style>
</head>
<body>
<h1>🌱 Seed — 10 alunos fictícios (ranking junho)</h1>
<div id="status">⏳ Aguardando autenticação…</div>
<button id="btnSeed" onclick="seed()" disabled>▶ Inserir 10 alunos</button>
<button id="btnClean" onclick="limpar()" disabled style="background:#3a2326;color:#e05d5d">🗑 Limpar</button>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",authDomain:"g20-masterclass.firebaseapp.com",projectId:"g20-masterclass",storageBucket:"g20-masterclass.firebasestorage.app",messagingSenderId:"1052719482127",appId:"1:1052719482127:web:537c1d67c96532be8a2a7a"});
var db=firebase.firestore();
var st=document.getElementById('status');

firebase.auth().onAuthStateChanged(function(u){
  if(u){
    st.textContent='✅ Logado como: '+u.email;
    st.style.color='#5dbb63';
    document.getElementById('btnSeed').disabled=false;
    document.getElementById('btnClean').disabled=false;
  } else {
    st.innerHTML='⛔ Não logado. <a href="dashboard.html" style="color:#c9a961">Clique aqui para logar</a> e volte.';
    st.style.color='#e05d5d';
  }
});

var ALUNOS=[
  {uid:"fake_uid_001",nome:"Ana Beatriz Silva"},
  {uid:"fake_uid_002",nome:"Carlos Eduardo Mendes"},
  {uid:"fake_uid_003",nome:"Fernanda Costa"},
  {uid:"fake_uid_004",nome:"Gabriel Oliveira"},
  {uid:"fake_uid_005",nome:"Isabella Martins"},
  {uid:"fake_uid_006",nome:"João Pedro Souza"},
  {uid:"fake_uid_007",nome:"Larissa Ferreira"},
  {uid:"fake_uid_008",nome:"Marcos Rodrigues"},
  {uid:"fake_uid_009",nome:"Natália Lima"},
  {uid:"fake_uid_010",nome:"Rafael Carvalho"},
];
var POOL=[
  {ticker:"BPAC11",nome:"Banco BTG Pactual",classe:"acao-br"},
  {ticker:"AAPL",nome:"Apple Inc.",classe:"stock"},
  {ticker:"MGLU3",nome:"Magazine Luiza",classe:"acao-br"},
  {ticker:"HGLG11",nome:"CSHG Logística FII",classe:"fii"},
  {ticker:"BTC",nome:"Bitcoin",classe:"cripto"},
  {ticker:"INTR",nome:"Inter & Co. Inc.",classe:"stock"},
  {ticker:"RBRR11",nome:"RBR Rendimento High Grade",classe:"fii"},
  {ticker:"DIS",nome:"The Walt Disney Co.",classe:"stock"},
  {ticker:"PLD",nome:"Prologis Inc.",classe:"reit"},
  {ticker:"SCHA",nome:"Schwab U.S. Small-Cap ETF",classe:"etf"},
  {ticker:"XPCA11",nome:"XP Crédito Agro FII",classe:"fii"},
  {ticker:"ROL",nome:"Rollins Inc.",classe:"stock"},
  {ticker:"O",nome:"Realty Income Corp.",classe:"reit"},
  {ticker:"VALE3",nome:"Vale S.A.",classe:"acao-br"},
  {ticker:"ETH",nome:"Ethereum",classe:"cripto"},
];
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}
function rnd(a,b){return+(Math.random()*(b-a)+a).toFixed(2);}
function log(m,c){var d=document.createElement('div');d.className='item '+(c||'info');d.innerHTML=m;document.getElementById('log').appendChild(d);}

async function seed(){
  document.getElementById('btnSeed').disabled=true;
  document.getElementById('log').innerHTML='';
  for(var i=0;i<ALUNOS.length;i++){
    var a=ALUNOS[i];
    var ativos=shuffle(POOL).slice(0,10).map(function(at){
      return Object.assign({},at,{precoBase:rnd(10,500),savedAt:'2026-05-28T22:00:00.000Z'});
    });
    try{
      await db.collection('game-g20').doc(a.uid).collection('carteiras').doc('2026-06').set(
        {uid:a.uid,ciclo:'mensal',cicloKey:'2026-06',cicloLabel:'Junho 2026',ativos:ativos,savedAt:firebase.firestore.FieldValue.serverTimestamp()}
      );
      await db.collection('networking_public').doc(a.uid).set({nome:a.nome,foto:'',turma:'Turma 21 (TESTE)'});
      log('✅ '+a.nome,'ok');
    }catch(e){log('⛔ '+a.nome+': '+e.message,'bad');}
  }
  log('🏁 Pronto! Abra o Game → Ranking como aluno-teste.','info');
  document.getElementById('btnSeed').disabled=false;
}

async function limpar(){
  if(!confirm('Remover os 10 alunos fictícios?'))return;
  document.getElementById('btnClean').disabled=true;
  for(var i=0;i<ALUNOS.length;i++){
    var a=ALUNOS[i];
    try{
      await db.collection('game-g20').doc(a.uid).collection('carteiras').doc('2026-06').delete();
      await db.collection('game-g20').doc(a.uid).delete();
      await db.collection('networking_public').doc(a.uid).delete();
      log('🗑 '+a.nome+' removido','ok');
    }catch(e){log('⛔ '+a.nome+': '+e.message,'bad');}
  }
  log('✅ Limpeza concluída.','ok');
  document.getElementById('btnClean').disabled=false;
}
</script>
</body>
</html>
