<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Consultoria G20</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#1a191e;--bg2:#1f1e22;--bg3:#15141a;--surface:#27252c;--border:rgba(201,169,97,0.08);--gold:#c9a961;--gold2:#e8c766;--gold-soft:rgba(201,169,97,0.12);--gold-border:rgba(201,169,97,0.3);--red:#e63946;--green:#2ecc71;--text:#e8e6e3;--text2:#9a958e;--text3:#6b6862;--shadow:0 24px 48px rgba(0,0,0,.55)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh}

.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100}
.topbar-logo{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:1px}
.topbar-badge{background:var(--gold-soft);border:1px solid var(--gold-border);color:var(--gold);font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:1px}
.topbar-right{margin-left:auto;display:flex;gap:10px}

.layout{display:flex;min-height:calc(100vh-56px)}
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);padding:16px 0}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.sidebar-item:hover{color:var(--text);background:rgba(255,255,255,.03)}
.sidebar-item.active{color:var(--gold);background:var(--gold-soft);border-left-color:var(--gold)}

.main{flex:1;padding:28px 32px;overflow-y:auto}

.adm-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;border:none}
.adm-btn-primary{background:linear-gradient(135deg,#c9a961,#b89751);color:#0d0c10}
.adm-btn-primary:hover{box-shadow:0 4px 14px rgba(201,169,97,.4)}
.adm-btn-ghost{background:transparent;color:var(--text2);border:1px solid rgba(255,255,255,.1)}
.adm-btn-ghost:hover{border-color:var(--gold-border);color:var(--gold)}
.adm-btn-danger{background:rgba(230,57,70,.12);color:var(--red);border:1px solid rgba(230,57,70,.3)}
.adm-btn-success{background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.3)}

.section-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-size:15px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}

/* SLOTS */
.slot-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg2);border-radius:10px;margin-bottom:8px}
.slot-dias{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.dia-chip{padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;user-select:none;transition:all .15s;background:rgba(255,255,255,.05);color:var(--text3);border:1px solid rgba(255,255,255,.08)}
.dia-chip.active{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-border)}
.slot-hora{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:700;color:var(--gold);width:60px;text-align:center}
.slot-hora-input{width:80px;background:var(--bg3);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:6px 10px;font-size:13px;color:var(--text);font-family:"JetBrains Mono",monospace;outline:none;text-align:center}
.slot-hora-input:focus{border-color:var(--gold-border)}

/* BLOQUEIOS */
.block-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.25);color:var(--red);padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;margin:4px}
.block-tag button{background:none;border:none;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 2px}

/* ALUNOS */
.aluno-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-radius:10px;margin-bottom:8px}
.aluno-avatar{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--gold);flex-shrink:0}
.aluno-info{flex:1;min-width:0}
.aluno-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aluno-email{font-size:11px;color:var(--text3)}
.credito-ctrl{display:flex;align-items:center;gap:6px}
.credito-num{font-size:16px;font-weight:800;color:var(--gold);font-family:"JetBrains Mono",monospace;width:32px;text-align:center}
.credito-btn{width:28px;height:28px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:var(--surface);color:var(--text2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
.credito-btn:hover{border-color:var(--gold-border);color:var(--gold)}
.toggle-ilimitado{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);cursor:pointer;user-select:none}
.toggle-ilimitado input{accent-color:var(--gold);cursor:pointer}

/* AGENDA */
.ag-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg2);border-radius:10px;margin-bottom:8px;border-left:3px solid transparent}
.ag-item.confirmado{border-left-color:var(--green)}
.ag-item.pendente{border-left-color:#e69600}
.ag-item.cancelado{border-left-color:var(--red);opacity:.6}
.ag-data{text-align:center;flex-shrink:0;width:48px}
.ag-dia{font-size:20px;font-weight:800;color:var(--text);font-family:"JetBrains Mono",monospace;line-height:1}
.ag-mes{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3)}
.ag-info{flex:1;min-width:0}
.ag-aluno{font-size:13px;font-weight:700;color:var(--text)}
.ag-hora{font-size:12px;color:var(--gold);margin-top:2px}
.ag-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}
.ag-status.confirmado{background:rgba(46,204,113,.1);color:var(--green)}
.ag-status.cancelado{background:rgba(230,57,70,.1);color:var(--red)}

.form-input{width:100%;background:var(--bg2);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:9px 14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;transition:border-color .2s;box-sizing:border-box}
.form-input:focus{border-color:var(--gold-border)}
.form-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}

.tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:24px}
.tab{flex:1;text-align:center;padding:8px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--text2)}
.tab.active{background:var(--surface);color:var(--gold)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--gold-border);color:var(--text);padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-logo">G20</span>
  <span style="font-size:13px;font-weight:700;color:var(--text2)">Admin · Consultoria</span>
  <span class="topbar-badge">ADMIN</span>
  <div class="topbar-right">
    <button class="adm-btn" id="btnGcal" onclick="gcalConectar()" style="background:rgba(66,133,244,.15);color:#4285f4;border:1px solid rgba(66,133,244,.3)">📅 Conectar Google Calendar</button>
    <a href="consultoria.html" class="adm-btn adm-btn-ghost" style="text-decoration:none">👁 Ver como aluno</a>
    <a href="dashboard.html" class="adm-btn adm-btn-ghost" style="text-decoration:none">← Dashboard</a>
  </div>
</div>

<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-item active" onclick="showTab('agenda')">📅 Agenda</div>
    <div class="sidebar-item" onclick="showTab('disponibilidade')">🕐 Disponibilidade</div>
    <div class="sidebar-item" onclick="showTab('bloqueios')">🚫 Bloqueios</div>
    <div class="sidebar-item" onclick="showTab('alunos')">👥 Créditos alunos</div>
  </nav>

  <div class="main">

    <!-- AGENDA -->
    <div id="tab-agenda">
      <div class="section-card">
        <div class="section-header">
          <div class="section-title">📅 Agendamentos</div>
          <div style="display:flex;gap:8px">
            <button class="adm-btn adm-btn-ghost" onclick="filtrarStatus('todos')" id="filt-todos" style="border-color:var(--gold-border);color:var(--gold)">Todos</button>
            <button class="adm-btn adm-btn-ghost" onclick="filtrarStatus('confirmado')" id="filt-confirmado">Confirmados</button>
            <button class="adm-btn adm-btn-ghost" onclick="filtrarStatus('cancelado')" id="filt-cancelado">Cancelados</button>
          </div>
        </div>
        <div id="agendaList"><div style="text-align:center;padding:40px;color:var(--text3)">Carregando...</div></div>
      </div>
    </div>

    <!-- DISPONIBILIDADE -->
    <div id="tab-disponibilidade" style="display:none">
      <div class="section-card">
        <div class="section-header">
          <div class="section-title">🕐 Horários disponíveis</div>
          <button class="adm-btn adm-btn-primary" onclick="addSlot()">+ Novo horário</button>
        </div>
        <div id="slotsList"></div>
        <div style="margin-top:16px;display:flex;gap:10px">
          <button class="adm-btn adm-btn-primary" onclick="salvarDisponibilidade()">💾 Salvar horários</button>
        </div>
      </div>
    </div>

    <!-- BLOQUEIOS -->
    <div id="tab-bloqueios" style="display:none">
      <div class="section-card">
        <div class="section-header">
          <div class="section-title">🚫 Datas bloqueadas</div>
        </div>
        <div style="margin-bottom:16px;display:flex;gap:10px;align-items:flex-end">
          <div style="flex:1">
            <label class="form-label">Bloquear data específica</label>
            <input type="date" class="form-input" id="inputBloqueio" style="max-width:220px">
          </div>
          <button class="adm-btn adm-btn-danger" onclick="addBloqueio()">🚫 Bloquear</button>
        </div>
        <div style="margin-bottom:16px;display:flex;gap:10px;align-items:flex-end">
          <div>
            <label class="form-label">Bloquear período</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="date" class="form-input" id="inputBloqInicio" style="width:160px">
              <span style="color:var(--text3)">até</span>
              <input type="date" class="form-input" id="inputBloqFim" style="width:160px">
              <button class="adm-btn adm-btn-danger" onclick="addBloqueioRange()">🚫 Bloquear período</button>
            </div>
          </div>
        </div>
        <div style="margin-top:16px">
          <label class="form-label">Datas bloqueadas</label>
          <div id="bloqueiosList" style="min-height:40px"></div>
        </div>
      </div>
    </div>

    <!-- ALUNOS / CRÉDITOS -->
    <div id="tab-alunos" style="display:none">
      <div class="section-card">
        <div class="section-header">
          <div class="section-title">👥 Créditos por aluno</div>
          <button class="adm-btn adm-btn-success" onclick="darCreditoTodos()">✅ Dar 1 crédito a todos</button>
        </div>
        <div style="margin-bottom:14px">
          <input class="form-input" placeholder="🔍 Buscar aluno..." id="buscaAluno" oninput="filtrarAlunos()" style="max-width:300px">
        </div>
        <div id="alunosList"><div style="text-align:center;padding:40px;color:var(--text3)">Carregando...</div></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const _cfg={apiKey:"AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",authDomain:"g20-masterclass.firebaseapp.com",projectId:"g20-masterclass",storageBucket:"g20-masterclass.firebasestorage.app",messagingSenderId:"1052719482127",appId:"1:1052719482127:web:537c1d67c96532be8a2a7a"};
if(!firebase.apps.length)firebase.initializeApp(_cfg);
const auth=firebase.auth(),db=firebase.firestore();

const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

var _slots=[], _bloqueios=[], _agendamentos=[], _alunos=[], _filtroStatus='todos', _alunosFiltrados=[];

auth.onAuthStateChanged(function(user){
  if(!user){window.location.href='login.html';return;}
  db.collection('users').doc(user.uid).get().then(function(doc){
    if(!doc.exists||doc.data().role!=='admin'){alert('Acesso restrito.');window.location.href='dashboard.html';return;}
    carregarTudo();
  });
});

function carregarTudo(){
  Promise.all([carregarDisponibilidade(),carregarBloqueios(),carregarAgendamentos(),carregarAlunos()]);
}

function carregarDisponibilidade(){
  return db.collection('consultoria').doc('config').get().then(function(doc){
    _slots=doc.exists?(doc.data().slots||[]):[
      {diasSemana:[1,2,3,4,5],hora:'10:00'},
      {diasSemana:[1,2,3,4,5],hora:'15:00'},
      {diasSemana:[0,1,2,3,4,5,6],hora:'16:00'}
    ];
    renderSlots();
  });
}

function carregarBloqueios(){
  return db.collection('consultoria').doc('bloqueios').collection('datas').get().then(function(snap){
    _bloqueios=[];snap.forEach(function(d){_bloqueios.push(d.id);});
    _bloqueios.sort();renderBloqueios();
  });
}

function carregarAgendamentos(){
  return db.collection('consultoria').doc('agendamentos').collection('items')
    .orderBy('timestamp','desc').limit(100).get()
    .then(function(snap){
      _agendamentos=[];
      snap.forEach(function(d){var a=d.data();a.id=d.id;_agendamentos.push(a);});
      renderAgenda();
    }).catch(function(){renderAgenda();});
}

function carregarAlunos(){
  return db.collection('users').get().then(function(snap){
    _alunos=[];
    snap.forEach(function(d){
      var u=d.data();u.uid=d.id;
      if(u.role!=='admin')_alunos.push(u);
    });
    _alunos.sort(function(a,b){return(a.name||'').localeCompare(b.name||'');});
    _alunosFiltrados=[..._alunos];
    renderAlunos();
  });
}

// ─── TABS ───
function showTab(tab){
  ['agenda','disponibilidade','bloqueios','alunos'].forEach(function(t){
    document.getElementById('tab-'+t).style.display=t===tab?'block':'none';
  });
  document.querySelectorAll('.sidebar-item').forEach(function(el,i){
    el.classList.toggle('active',['agenda','disponibilidade','bloqueios','alunos'][i]===tab);
  });
}

// ─── AGENDA ───
function filtrarStatus(status){
  _filtroStatus=status;
  ['todos','confirmado','cancelado'].forEach(function(s){
    var el=document.getElementById('filt-'+s);
    if(el){el.style.color=s===status?'var(--gold)':'';el.style.borderColor=s===status?'var(--gold-border)':'';}
  });
  renderAgenda();
}

function renderAgenda(){
  var list=document.getElementById('agendaList');
  var items=_filtroStatus==='todos'?_agendamentos:_agendamentos.filter(function(a){return a.status===_filtroStatus;});
  if(!items.length){list.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">Nenhum agendamento.</div>';return;}
  list.innerHTML=items.map(function(a){
    var d=new Date(a.data+'T00:00:00');
    var aluno=_alunos.find(function(u){return u.uid===a.uid;})||{name:'Aluno',email:''};
    var cancelBtn=a.status==='confirmado'?'<button onclick="adminCancelar(\''+a.id+'\',\''+a.uid+'\')" class="adm-btn adm-btn-danger" style="font-size:11px;padding:5px 10px">Cancelar</button>':'';
    var calBtn=a.status==='confirmado'?'<button onclick="adminAdicionarCalendar(\''+a.id+'\')" class="adm-btn" style="font-size:11px;padding:5px 10px;background:rgba(66,133,244,.15);color:#4285f4;border:1px solid rgba(66,133,244,.3);margin-right:4px">📅</button>':'';
    return '<div class="ag-item '+a.status+'">' +
      '<div class="ag-data"><div class="ag-dia">'+String(d.getDate()).padStart(2,'0')+'</div><div class="ag-mes">'+MESES[d.getMonth()]+'</div></div>'+
      '<div class="ag-info"><div class="ag-aluno">'+_esc(aluno.name||aluno.email||a.uid)+'</div><div class="ag-hora">⏰ '+a.hora+' – '+_addHour(a.hora)+'</div></div>'+
      '<span class="ag-status '+a.status+'">'+(a.status==='confirmado'?'✅ Confirmado':'❌ Cancelado')+'</span>'+
      calBtn+cancelBtn+
    '</div>';
  }).join('');
}

function adminCancelar(agId,uid){
  if(!confirm('Cancelar este agendamento e devolver crédito ao aluno?'))return;
  db.collection('consultoria').doc('agendamentos').collection('items').doc(agId)
    .update({status:'cancelado'})
    .then(function(){
      return db.collection('users').doc(uid).update({creditosConsultoria:firebase.firestore.FieldValue.increment(1)});
    })
    .then(function(){
      var idx=_agendamentos.findIndex(function(a){return a.id===agId;});
      if(idx>=0)_agendamentos[idx].status='cancelado';
      renderAgenda();toast('Agendamento cancelado. Crédito devolvido.');
    });
}

// ─── DISPONIBILIDADE ───
function renderSlots(){
  var list=document.getElementById('slotsList');
  list.innerHTML=_slots.map(function(slot,i){
    var diasHtml=DIAS.map(function(d,di){
      return '<div class="dia-chip'+(slot.diasSemana.indexOf(di)!==-1?' active':'')+'" onclick="toggleDia('+i+','+di+')">'+d+'</div>';
    }).join('');
    return '<div class="slot-row">'+
      '<div class="slot-dias">'+diasHtml+'</div>'+
      '<input type="time" class="slot-hora-input" value="'+slot.hora+'" onchange="_slots['+i+'].hora=this.value">'+
      '<button onclick="removeSlot('+i+')" class="adm-btn adm-btn-danger" style="padding:5px 10px;font-size:12px">✕</button>'+
    '</div>';
  }).join('');
}

function toggleDia(slotIdx,dia){
  var idx=_slots[slotIdx].diasSemana.indexOf(dia);
  if(idx===-1)_slots[slotIdx].diasSemana.push(dia);
  else _slots[slotIdx].diasSemana.splice(idx,1);
  renderSlots();
}

function addSlot(){
  _slots.push({diasSemana:[1,2,3,4,5],hora:'09:00'});
  renderSlots();
}

function removeSlot(i){
  if(!confirm('Remover este horário?'))return;
  _slots.splice(i,1);renderSlots();
}

function salvarDisponibilidade(){
  db.collection('consultoria').doc('config').set({
    slots:_slots,duracao:60,meetLink:'https://meet.google.com/psx-kifx-qgc'
  },{merge:true}).then(function(){toast('✅ Horários salvos!');});
}

// ─── BLOQUEIOS ───
function addBloqueio(){
  var val=document.getElementById('inputBloqueio').value;
  if(!val)return;
  if(_bloqueios.indexOf(val)!==-1){toast('Data já bloqueada.');return;}
  db.collection('consultoria').doc('bloqueios').collection('datas').doc(val).set({bloqueado:true})
    .then(function(){_bloqueios.push(val);_bloqueios.sort();renderBloqueios();toast('Data bloqueada.');});
}

function addBloqueioRange(){
  var ini=new Date(document.getElementById('inputBloqInicio').value+'T00:00:00');
  var fim=new Date(document.getElementById('inputBloqFim').value+'T00:00:00');
  if(isNaN(ini)||isNaN(fim)||ini>fim){alert('Período inválido.');return;}
  var promises=[];
  for(var d=new Date(ini);d<=fim;d.setDate(d.getDate()+1)){
    var ds=_fmtDate(new Date(d));
    if(_bloqueios.indexOf(ds)===-1){
      _bloqueios.push(ds);
      promises.push(db.collection('consultoria').doc('bloqueios').collection('datas').doc(ds).set({bloqueado:true}));
    }
  }
  Promise.all(promises).then(function(){_bloqueios.sort();renderBloqueios();toast('Período bloqueado.');});
}

function removerBloqueio(data){
  db.collection('consultoria').doc('bloqueios').collection('datas').doc(data).delete()
    .then(function(){_bloqueios=_bloqueios.filter(function(d){return d!==data;});renderBloqueios();toast('Bloqueio removido.');});
}

function renderBloqueios(){
  var el=document.getElementById('bloqueiosList');
  if(!_bloqueios.length){el.innerHTML='<span style="color:var(--text3);font-size:13px">Nenhuma data bloqueada.</span>';return;}
  el.innerHTML=_bloqueios.map(function(d){
    var dt=new Date(d+'T00:00:00');
    var label=dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
    return '<span class="block-tag">🚫 '+label+'<button onclick="removerBloqueio(\''+d+'\')">×</button></span>';
  }).join('');
}

// ─── ALUNOS / CRÉDITOS ───
function renderAlunos(){
  var list=document.getElementById('alunosList');
  if(!_alunosFiltrados.length){list.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">Nenhum aluno.</div>';return;}
  list.innerHTML=_alunosFiltrados.map(function(u){
    var cred=u.creditosConsultoria!==undefined?u.creditosConsultoria:0;
    var ilim=u.consultoriaIlimitada===true;
    var ini=u.name||u.email||'Aluno';
    return '<div class="aluno-row">'+
      '<div class="aluno-avatar">'+ini.charAt(0).toUpperCase()+'</div>'+
      '<div class="aluno-info"><div class="aluno-name">'+_esc(u.name||'—')+'</div><div class="aluno-email">'+_esc(u.email||u.uid)+'</div></div>'+
      '<div class="credito-ctrl">'+
        (ilim?'<span style="color:var(--gold);font-size:12px;font-weight:700">∞ Ilimitado</span>':(
          '<button class="credito-btn" onclick="ajustarCredito(\''+u.uid+'\',-1)">−</button>'+
          '<div class="credito-num">'+cred+'</div>'+
          '<button class="credito-btn" onclick="ajustarCredito(\''+u.uid+'\',1)">+</button>'
        ))+
      '</div>'+
      '<label class="toggle-ilimitado" style="margin-left:12px">'+
        '<input type="checkbox"'+(ilim?' checked':'')+' onchange="toggleIlimitado(\''+u.uid+'\',this.checked)">'+
        '<span style="font-size:11px">Ilimitado</span>'+
      '</label>'+
    '</div>';
  }).join('');
}

function filtrarAlunos(){
  var q=document.getElementById('buscaAluno').value.toLowerCase();
  _alunosFiltrados=_alunos.filter(function(u){
    return(u.name||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q);
  });
  renderAlunos();
}

function ajustarCredito(uid,delta){
  db.collection('users').doc(uid).update({creditosConsultoria:firebase.firestore.FieldValue.increment(delta)})
    .then(function(){
      var u=_alunos.find(function(a){return a.uid===uid;});
      if(u)u.creditosConsultoria=(u.creditosConsultoria||0)+delta;
      renderAlunos();toast('Crédito atualizado.');
    });
}

function toggleIlimitado(uid,val){
  db.collection('users').doc(uid).update({consultoriaIlimitada:val})
    .then(function(){
      var u=_alunos.find(function(a){return a.uid===uid;});
      if(u)u.consultoriaIlimitada=val;
      renderAlunos();toast(val?'Ilimitado ativado.':'Ilimitado desativado.');
    });
}

function darCreditoTodos(){
  if(!confirm('Dar 1 crédito de consultoria para TODOS os alunos?'))return;
  var promises=_alunos.map(function(u){
    return db.collection('users').doc(u.uid).update({creditosConsultoria:firebase.firestore.FieldValue.increment(1)})
      .then(function(){u.creditosConsultoria=(u.creditosConsultoria||0)+1;});
  });
  Promise.all(promises).then(function(){renderAlunos();toast('✅ 1 crédito dado a '+_alunos.length+' alunos.');});
}

function adminAdicionarCalendar(agId) {
  var ag = _agendamentos.find(function(a){ return a.id === agId; });
  if (!ag) return;
  var aluno = _alunos.find(function(u){ return u.uid === ag.uid; });
  var nomeAluno = aluno ? (aluno.name || aluno.email) : 'Aluno';
  ag.firestoreId = agId;
  if (!_gcalToken) {
    toast('Conecte o Google Calendar primeiro (botão no topo).');
    gcalConectar();
    return;
  }
  gcalCriarEvento(ag, nomeAluno);
}

var MEET_LINK = 'https://meet.google.com/psx-kifx-qgc';

// ─── HELPERS ───
function _esc(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function _fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function _addHour(h){var p=h.split(':');return String(parseInt(p[0])+1).padStart(2,'0')+':'+p[1];}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},2500);}

// ─── GOOGLE CALENDAR INTEGRATION ───
const GCAL_CLIENT_ID = '12978799600-pgdiok4erfhrvbfnjh8qlnu0dree4j1u.apps.googleusercontent.com';
const GCAL_SCOPES = 'https://www.googleapis.com/auth/calendar.events';
var _gcalToken = null;
var _gcalTokenClient = null;

function gcalInit() {
  try {
    _gcalTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GCAL_CLIENT_ID,
      scope: GCAL_SCOPES,
      callback: function(resp) {
        if (resp.error) { console.error('GCal auth error:', resp); return; }
        _gcalToken = resp.access_token;
        localStorage.setItem('g20_gcal_token', _gcalToken);
        document.getElementById('btnGcal').textContent = '✅ Google Calendar conectado';
        document.getElementById('btnGcal').style.background = 'rgba(46,204,113,.15)';
        document.getElementById('btnGcal').style.color = '#2ecc71';
        document.getElementById('btnGcal').style.borderColor = 'rgba(46,204,113,.3)';
        toast('✅ Google Calendar conectado!');
      }
    });
    // Tenta restaurar token salvo
    var saved = localStorage.getItem('g20_gcal_token');
    if (saved) {
      _gcalToken = saved;
      document.getElementById('btnGcal').textContent = '✅ Google Calendar conectado';
      document.getElementById('btnGcal').style.background = 'rgba(46,204,113,.15)';
      document.getElementById('btnGcal').style.color = '#2ecc71';
      document.getElementById('btnGcal').style.borderColor = 'rgba(46,204,113,.3)';
    }
  } catch(e) { console.warn('GCal init:', e); }
}

function gcalConectar() {
  if (!_gcalTokenClient) { gcalInit(); setTimeout(gcalConectar, 500); return; }
  _gcalTokenClient.requestAccessToken({ prompt: '' });
}

function gcalCriarEvento(agendamento, nomeAluno) {
  if (!_gcalToken) {
    console.warn('GCal não conectado — pulando criação de evento');
    return Promise.resolve();
  }
  var dataHoraInicio = agendamento.data + 'T' + agendamento.hora + ':00';
  var horaFim = _addHour(agendamento.hora);
  var dataHoraFim = agendamento.data + 'T' + horaFim + ':00';
  var evento = {
    summary: '📊 Consultoria G20 · ' + (nomeAluno || 'Aluno'),
    description: 'Consultoria 1:1 G20 Masterclass\n\nLink do Meet: ' + MEET_LINK + '\n\nAgendado pela plataforma G20.',
    start: { dateTime: dataHoraInicio, timeZone: 'America/Sao_Paulo' },
    end:   { dateTime: dataHoraFim,   timeZone: 'America/Sao_Paulo' },
    conferenceData: {
      createRequest: { requestId: agendamento.id || Date.now().toString() }
    },
    attendees: [],
    reminders: {
      useDefault: false,
      overrides: [
        { method: 'email',  minutes: 1440 }, // 24h antes
        { method: 'popup',  minutes: 30   }  // 30min antes
      ]
    }
  };

  return fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + _gcalToken,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(evento)
  })
  .then(function(r) {
    if (r.status === 401) {
      // Token expirado — limpa e pede nova autorização
      _gcalToken = null;
      localStorage.removeItem('g20_gcal_token');
      toast('⚠️ Token Google expirado. Reconecte o Calendar.');
      return null;
    }
    return r.json();
  })
  .then(function(data) {
    if (data && data.id) {
      console.log('[GCal] Evento criado:', data.htmlLink);
      toast('📅 Evento criado no Google Calendar!');
      // Salva link do evento no Firestore
      if (agendamento.firestoreId) {
        db.collection('consultoria').doc('agendamentos').collection('items')
          .doc(agendamento.firestoreId)
          .update({ gcalEventLink: data.htmlLink })
          .catch(function(){});
      }
    }
  })
  .catch(function(e) { console.warn('[GCal] Erro ao criar evento:', e); });
}

// Inicializa quando Google API carrega
window.addEventListener('load', function() {
  setTimeout(gcalInit, 1000);
});

</script>
