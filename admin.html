<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b0f">
<title>Admin — G20 Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b0f;--bg2:#0f1117;--bg3:#171b23;--surface:#1c2030;--sur2:#242838;--border:rgba(255,255,255,0.08);--gold:#e8b84b;--red:#e63946;--green:#2ecc71;--blue:#3498db;--text:#f4f6fa;--text2:#b0bac8;--text3:#6b7a94}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100svh;padding:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--gold)}
.page-sub{font-size:13px;color:var(--text3);margin-top:2px}
.btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-red{background:rgba(230,57,70,.15);color:var(--red);border:1px solid rgba(230,57,70,.3)}
.btn-red:hover{background:rgba(230,57,70,.25)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sc,var(--gold))}
.stat-label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:800;color:var(--sc,var(--gold))}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px;width:fit-content}
.tab{padding:7px 18px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;background:none;border:none;color:var(--text2);transition:all .2s;font-family:inherit}
.tab.on{background:var(--gold);color:#000}

/* Search */
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;font-family:inherit;min-width:240px;outline:none}
.search-input:focus{border-color:var(--gold)}

/* Tabela */
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th{text-align:left;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--sur2)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#c8943a);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#090b0f;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.user-cell{display:flex;align-items:center;gap:10px}
.user-info .name{font-weight:700;color:var(--text)}
.user-info .email{font-size:11px;color:var(--text3);margin-top:1px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-pending{background:rgba(232,184,75,.15);color:var(--gold)}
.badge-approved{background:rgba(46,204,113,.15);color:var(--green)}
.badge-blocked{background:rgba(230,57,70,.15);color:var(--red)}
.badge-admin{background:rgba(52,152,219,.15);color:var(--blue)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s;white-space:nowrap}
.btn-approve{background:rgba(46,204,113,.15);color:var(--green);border:1px solid rgba(46,204,113,.3)}
.btn-approve:hover{background:rgba(46,204,113,.3)}
.btn-block{background:rgba(230,57,70,.1);color:var(--red);border:1px solid rgba(230,57,70,.25)}
.btn-block:hover{background:rgba(230,57,70,.2)}
.btn-admin{background:rgba(52,152,219,.1);color:var(--blue);border:1px solid rgba(52,152,219,.25)}
.btn-admin:hover{background:rgba(52,152,219,.2)}
.empty{text-align:center;padding:48px;color:var(--text3);font-size:13px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.4);display:none;animation:slideUp .2s ease}
.toast.show{display:block}
.toast.ok{border-color:rgba(46,204,113,.4);color:var(--green)}
.toast.err{border-color:rgba(230,57,70,.4);color:var(--red)}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="g20LoadingOverlay" style="position:fixed;inset:0;background:#090b0f;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <img src="G20_Masterclass_-_logo_dashboard.png" style="width:80px;opacity:0.8">
  <div style="width:32px;height:32px;border-radius:50%;border:3px solid rgba(232,184,75,.2);border-top-color:#e8b84b;animation:spin .8s linear infinite"></div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>

<div class="topbar">
  <div>
    <div class="page-title">&#x1F6E1;&#xFE0F; Admin G20 Masterclass</div>
    <div class="page-sub">Gerenciamento de alunos e acessos</div>
  </div>
  <button class="btn btn-red" onclick="sair()">&#x1F6AA; Sair</button>
</div>

<!-- Stats -->
<div class="stats" id="statsGrid">
  <div class="stat" style="--sc:var(--gold)"><div class="stat-label">Total</div><div class="stat-val" id="statTotal">–</div></div>
  <div class="stat" style="--sc:var(--green)"><div class="stat-label">Aprovados</div><div class="stat-val" id="statAprovados">–</div></div>
  <div class="stat" style="--sc:var(--gold)"><div class="stat-label">Pendentes</div><div class="stat-val" id="statPendentes">–</div></div>
  <div class="stat" style="--sc:var(--red)"><div class="stat-label">Bloqueados</div><div class="stat-val" id="statBloqueados">–</div></div>
</div>

<!-- Tabs + busca -->
<div class="tabs">
  <button class="tab on" id="tabTodos" onclick="setTab('todos')">Todos</button>
  <button class="tab" id="tabPendentes" onclick="setTab('pendentes')">&#x23F3; Pendentes</button>
  <button class="tab" id="tabAprovados" onclick="setTab('aprovados')">&#x2705; Aprovados</button>
  <button class="tab" id="tabBloqueados" onclick="setTab('bloqueados')">&#x1F6AB; Bloqueados</button>
</div>

<div class="search-bar">
  <input class="search-input" id="searchInput" placeholder="&#x1F50D; Buscar por nome ou e-mail..." oninput="renderTabela()">
  <button class="btn" style="background:var(--gold);color:#000" onclick="carregarUsuarios()">&#x21BA; Atualizar</button>
</div>

<!-- Tabela -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Usuário</th>
        <th>Turma / Role</th>
        <th>Status</th>
        <th>Cadastro</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tbodyUsers">
      <tr><td colspan="5" class="empty">Carregando usuários...</td></tr>
    </tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",
  authDomain:"g20-masterclass.firebaseapp.com",
  projectId:"g20-masterclass",
  storageBucket:"g20-masterclass.firebasestorage.app",
  messagingSenderId:"1052719482127",
  appId:"1:1052719482127:web:537c1d67c96532be8a2a7a"
});
const auth = firebase.auth();
const db   = firebase.firestore();

let _users = [];
let _tabAtual = 'todos';

// ── Verifica se é admin ───────────────────────────────────────
auth.onAuthStateChanged(async function(user) {
  if (!user) { window.location.href = 'login.html'; return; }
  const doc = await db.collection('users').doc(user.uid).get();
  if (!doc.exists || doc.data().role !== 'admin') {
    alert('Acesso restrito a administradores.');
    window.location.href = 'dashboard.html';
    return;
  }
  var ol=document.getElementById('g20LoadingOverlay');if(ol)ol.style.display='none';
  carregarUsuarios();
});

// ── Carrega todos os usuários ─────────────────────────────────
async function carregarUsuarios() {
  try {
    const snap = await db.collection('users').orderBy('createdAt', 'desc').get();
    _users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    atualizarStats();
    renderTabela();
  } catch (e) {
    showToast('Erro ao carregar usuários', 'err');
  }
}

function atualizarStats() {
  document.getElementById('statTotal').textContent      = _users.length;
  document.getElementById('statAprovados').textContent  = _users.filter(u => u.aprovado === true).length;
  document.getElementById('statPendentes').textContent  = _users.filter(u => u.aprovado === false || u.aprovado === null || u.aprovado === undefined).length;
  document.getElementById('statBloqueados').textContent = _users.filter(u => u.aprovado === 'bloqueado').length;
}

function setTab(tab) {
  _tabAtual = tab;
  ['todos','pendentes','aprovados','bloqueados'].forEach(t => {
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).className = 'tab' + (t === tab ? ' on' : '');
  });
  renderTabela();
}

function renderTabela() {
  const busca = document.getElementById('searchInput').value.toLowerCase();
  let lista = _users;

  // Filtra por tab
  if (_tabAtual === 'pendentes')  lista = lista.filter(u => u.aprovado === false || u.aprovado === null || u.aprovado === undefined);
  if (_tabAtual === 'aprovados')  lista = lista.filter(u => u.aprovado === true);
  if (_tabAtual === 'bloqueados') lista = lista.filter(u => u.aprovado === 'bloqueado');

  // Filtra por busca
  if (busca) lista = lista.filter(u =>
    (u.name  || '').toLowerCase().includes(busca) ||
    (u.email || '').toLowerCase().includes(busca)
  );

  const tbody = document.getElementById('tbodyUsers');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Nenhum usuário encontrado</td></tr>';
    return;
  }

  tbody.innerHTML = lista.map(u => {
    const initials = (u.name || u.email || '?').split(' ').map(w => w[0] || '').slice(0,2).join('').toUpperCase();
    const avatarHtml = u.photo
      ? `<div class="avatar"><img src="${u.photo}" alt=""></div>`
      : `<div class="avatar">${initials}</div>`;

    const statusMap = {
      true:        '<span class="badge badge-approved">✓ Aprovado</span>',
      false:       '<span class="badge badge-pending">⏳ Pendente</span>',
      null:        '<span class="badge badge-pending">⏳ Pendente</span>',
      undefined:   '<span class="badge badge-pending">⏳ Pendente</span>',
      bloqueado:   '<span class="badge badge-blocked">✗ Bloqueado</span>',
    };
    const statusHtml = statusMap[u.aprovado] ?? '<span class="badge badge-pending">⏳ Pendente</span>';

    const roleHtml = u.role === 'admin'
      ? '<span class="badge badge-admin">Admin</span>'
      : (u.turma || 'Turma 20') + ' · ' + (u.role || 'Membro');

    const data = u.createdAt?.toDate?.()?.toLocaleDateString('pt-BR') || '–';

    // Botões de ação
    let btns = '';
    if (u.role !== 'admin') {
      if (u.aprovado !== true)       btns += `<button class="btn-sm btn-approve" onclick="aprovar('${u.id}')">✓ Aprovar</button>`;
      if (u.aprovado !== 'bloqueado') btns += `<button class="btn-sm btn-block" onclick="bloquear('${u.id}')">✗ Bloquear</button>`;
      if (u.aprovado === true)       btns += `<button class="btn-sm btn-block" onclick="revogar('${u.id}')">↩ Revogar</button>`;
      btns += `<button class="btn-sm btn-admin" onclick="tornarAdmin('${u.id}')">★ Admin</button>`;
    }

    return `<tr>
      <td>
        <div class="user-cell">
          ${avatarHtml}
          <div class="user-info">
            <div class="name">${u.name || '–'}</div>
            <div class="email">${u.email || '–'}</div>
          </div>
        </div>
      </td>
      <td>${roleHtml}</td>
      <td>${statusHtml}</td>
      <td style="color:var(--text3);font-size:12px">${data}</td>
      <td><div class="actions">${btns}</div></td>
    </tr>`;
  }).join('');
}

// ── Ações ─────────────────────────────────────────────────────
async function aprovar(uid) {
  await db.collection('users').doc(uid).update({ aprovado: true });
  const u = _users.find(x => x.id === uid);
  if (u) u.aprovado = true;
  atualizarStats(); renderTabela();
  showToast('✓ Usuário aprovado!', 'ok');
}

async function bloquear(uid) {
  if (!confirm('Bloquear este usuário?')) return;
  await db.collection('users').doc(uid).update({ aprovado: 'bloqueado' });
  const u = _users.find(x => x.id === uid);
  if (u) u.aprovado = 'bloqueado';
  atualizarStats(); renderTabela();
  showToast('Usuário bloqueado.', 'ok');
}

async function revogar(uid) {
  if (!confirm('Revogar acesso deste usuário?')) return;
  await db.collection('users').doc(uid).update({ aprovado: false });
  const u = _users.find(x => x.id === uid);
  if (u) u.aprovado = false;
  atualizarStats(); renderTabela();
  showToast('Acesso revogado.', 'ok');
}

async function tornarAdmin(uid) {
  if (!confirm('Dar acesso de ADMIN a este usuário?')) return;
  await db.collection('users').doc(uid).update({ role: 'admin', aprovado: true });
  const u = _users.find(x => x.id === uid);
  if (u) { u.role = 'admin'; u.aprovado = true; }
  atualizarStats(); renderTabela();
  showToast('★ Usuário agora é Admin!', 'ok');
}

function sair() { auth.signOut().then(() => window.location.href = 'login.html'); }

function showToast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + tipo;
  setTimeout(() => t.className = 'toast', 3000);
}
</script>
</body>
</html>
