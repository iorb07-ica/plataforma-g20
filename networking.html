<style>
a{text-decoration:none;color:inherit}
button{font-family:inherit}
:root{
  --bg:#0f0e12; --bg-2:#1a191e; --surface:#27252c; --surface-2:#2d2a33;
  --gold:#c9a961; --gold-light:#e8c766; --gold-deep:#a08543;
  --text:#e8e6e3; --text-2:#9a958e; --text-3:#6b6862;
  --border:rgba(255,255,255,.06); --border-gold:rgba(201,169,97,.18);
  --topbar:64px; --sidebar:200px;
  --sans:'DM Sans', system-ui, sans-serif; --mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}

.sidebar .nav-section{padding:10px 0 !important}
.sidebar .nav-item{color:#fff !important}
.sidebar .nav-item:hover{color:#fff !important}
.sidebar .nav-item.active{color:var(--gold) !important}

.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .2s ease}
body.sidebar-collapsed .main{margin-left:68px}

.topbar{background:rgba(15,14,18,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:var(--topbar);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:150;gap:14px}
.topbar-left{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.topbar-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.btn-menu{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer}
.page-title{font-size:18px;font-weight:600;letter-spacing:.3px}
.btn-icon{background:transparent;border:1px solid var(--border);color:var(--text-2);width:38px;height:38px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;position:relative}
.btn-icon:hover{border-color:var(--gold);color:var(--gold)}
.btn-icon i{width:18px;height:18px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99;backdrop-filter:blur(2px)}
.overlay.show{display:block}

/* ─── COMUNIDADE ─── */
.cmn-wrap{padding:24px 72px 60px;width:100%}
.cmn-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.cmn-title{font-size:24px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cmn-sub{font-size:13px;color:var(--text-2);margin-top:3px}
.cmn-count{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;white-space:nowrap}
.cmn-count i{width:15px;height:15px;color:var(--gold)}
.btn-preview{background:rgba(201,169,97,.12);border:1px solid var(--border-gold);color:var(--gold);border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;display:none;align-items:center;gap:6px}
body.is-admin .btn-preview{display:inline-flex}

.cmn-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.cmn-search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 14px}
.cmn-search i{width:16px;height:16px;color:var(--text-2);flex-shrink:0}
.cmn-search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit}
.cmn-search input::placeholder{color:var(--text-3)}
.cmn-chips{display:flex;gap:7px;flex-wrap:wrap}
.cmn-chip{font-size:11px;padding:6px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.cmn-chip:hover{border-color:var(--border-gold);color:var(--text);background:var(--surface-2)}
.cmn-chip.on{background:linear-gradient(135deg,var(--gold),var(--gold-light));border-color:var(--gold-light);color:#1a191e;font-weight:600;box-shadow:0 2px 10px rgba(201,169,97,.35)}
.cmn-chip.on i{color:#1a191e}
.cmn-chip.on span{color:#1a191e}
.cmn-chip i{width:13px;height:13px}

.cmn-cat{margin-top:26px}
.cmn-cat-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.cmn-cat-ico{width:30px;height:30px;border-radius:8px;background:rgba(201,169,97,.1);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.cmn-cat-ico i{width:16px;height:16px}
.cmn-cat-name{font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--gold)}
.cmn-cat-n{font-size:11px;color:var(--text-3);font-family:var(--mono)}
.cmn-cat-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border-gold),transparent)}

.cmn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:16px}
.cmn-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:13px}
.cmn-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.cmn-card-top{display:flex;align-items:center;gap:11px}
.cmn-av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;flex-shrink:0;overflow:hidden}
.cmn-av img{width:100%;height:100%;object-fit:cover}
.cmn-card-id{min-width:0}
.cmn-card-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmn-card-name .inf{color:var(--gold)}
.cmn-card-prof{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmn-card-neg{font-size:11px;color:var(--gold-light);display:flex;align-items:flex-start;gap:5px;line-height:1.4;min-height:30px}
.cmn-card-neg i{width:12px;height:12px;flex-shrink:0;margin-top:2px}
.cmn-card-soc{display:flex;gap:7px;align-items:center}
.cmn-soc{width:28px;height:28px;border-radius:8px;background:var(--bg-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--gold);transition:.15s}
.cmn-soc:hover{border-color:var(--gold);background:var(--surface-2)}
.cmn-soc svg{width:15px;height:15px;display:block}
.cmn-soc.off{color:#6f6b64;cursor:default}
.cmn-soc.off:hover{border-color:var(--border);background:var(--bg-2)}
.cmn-card-turma{margin-left:auto;font-size:10px;color:var(--text-3)}

.cmn-empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.cmn-empty i{width:42px;height:42px;color:var(--gold-deep);opacity:.6}
.cmn-empty h3{font-size:15px;font-weight:600;color:var(--text);margin:14px 0 6px}
.cmn-empty p{font-size:13px;line-height:1.6;max-width:380px;margin:0 auto}
.cmn-empty a{color:var(--gold-light);text-decoration:underline}

.cmn-foot{margin-top:30px;font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:7px;border-top:1px solid var(--border);padding-top:14px}
.cmn-foot i{width:14px;height:14px;color:var(--gold-deep)}

/* ─── MODAL MINI-PERFIL ─── */
.mp-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
.mp-overlay.open{display:flex}
.mp-modal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 24px 48px rgba(0,0,0,.6);max-height:88vh;overflow-y:auto}
.mp-band{height:78px;background:linear-gradient(135deg,rgba(201,169,97,.24),rgba(232,199,102,.05));position:relative}
.mp-close{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,.4);border:none;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.mp-close i{width:16px;height:16px}
.mp-body{padding:0 24px 24px;margin-top:-36px}
.mp-av{width:76px;height:76px;border-radius:50%;border:3px solid var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:26px;overflow:hidden}
.mp-av img{width:100%;height:100%;object-fit:cover}
.mp-name{font-size:19px;font-weight:600;margin-top:13px}
.mp-name .inf{color:var(--gold);font-size:15px}
.mp-meta{font-size:12px;color:var(--text-2);margin-top:2px}
.mp-loc{font-size:12px;color:var(--text-2);margin-top:7px;display:flex;align-items:center;gap:6px}
.mp-loc i{width:14px;height:14px;color:var(--gold)}
.mp-neg-box{margin-top:15px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
.mp-neg-lbl{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:6px}
.mp-neg-lbl i{width:13px;height:13px}
.mp-neg-txt{font-size:13px;color:var(--text);margin-top:6px;line-height:1.5}
.mp-sobre{margin-top:13px;font-size:13px;line-height:1.6;color:#c8c3b6}
.mp-soc-row{margin-top:16px;display:flex;gap:9px}
.mp-soc{flex:1;height:42px;border-radius:11px;background:var(--bg-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--gold);transition:.15s}
.mp-soc:hover{border-color:var(--gold);background:var(--surface-2)}
.mp-soc svg{width:18px;height:18px;display:block}
.mp-soc.off{color:#6f6b64;pointer-events:none}

@media(max-width:768px){
  .btn-menu{display:flex}
  .main{margin-left:0}
  .cmn-wrap{padding:18px 16px 50px}
  .cmn-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:460px){ .cmn-grid{grid-template-columns:1fr} }
</style>
</head>

<script>
window._g20PreloadSidebar = function(){
  try {
    var cached = JSON.parse(localStorage.getItem('g20_user_profile') || '{}');
    if (cached && cached.name) {
      var ini = cached.name.split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase()||'G20';
      var nameEl=document.getElementById('sidebarName');
      var turmaEl=document.getElementById('sidebarTurma');
      var initEl=document.getElementById('sidebarInitials');
      var avEl=document.getElementById('sidebarAvatar');
      if(nameEl) nameEl.innerHTML='<span class="user-name-text">'+cached.name+'</span>'+(cached.infinite?'<span class="badge-infinity">∞ Infinity</span>':'');
      if(turmaEl) turmaEl.textContent=cached.role==='admin'?'Admin':(cached.turma||'');
      if(initEl) initEl.textContent=ini;
      if(avEl&&cached.photo) avEl.innerHTML='<img src="'+cached.photo+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.remove()">';
    }
  } catch(e) {}
};
document.addEventListener('DOMContentLoaded', function(){
  if(typeof _g20PreloadSidebar==='function') _g20PreloadSidebar();
});
</script>

<script>
var firebaseConfig={
  apiKey:"AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",

  appId:"1:1052719482127:web:537c1d67c96532be8a2a7a"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(), db=firebase.firestore();

var _user=null,_userData={},_isAdmin=false;
var _alunos=[];        // lista carregada (real ou preview)
var _catFiltro='';     // '' = todas
var _previewOn=false;

// Categorias de negócio — MESMA lista que o perfil.html deve oferecer
var CATEGORIAS=[
  {id:'tecnologia',  label:'Tecnologia',                icon:'cpu'},
  {id:'saude',       label:'Saúde & Bem-estar',         icon:'heart-pulse'},
  {id:'financas',    label:'Finanças & Contabilidade',  icon:'calculator'},
  {id:'design',      label:'Design & Marketing',        icon:'palette'},
  {id:'educacao',    label:'Educação',                  icon:'graduation-cap'},
  {id:'juridico',    label:'Jurídico',                  icon:'scale'},
  {id:'imobiliario', label:'Imobiliário',               icon:'building'},
  {id:'comercio',    label:'Comércio & Varejo',         icon:'shopping-bag'},
  {id:'alimentacao', label:'Alimentação',               icon:'utensils-crossed'},
  {id:'servicos',    label:'Serviços em geral',         icon:'briefcase'},
  {id:'outros',      label:'Outros',                    icon:'more-horizontal'}
];
function catInfo(id){
  for(var i=0;i<CATEGORIAS.length;i++) if(CATEGORIAS[i].id===id) return CATEGORIAS[i];
  return CATEGORIAS[CATEGORIAS.length-1];
}
var AV_CORES=['#c0392b','#2c3e6b','#1e8449','#7d3c98','#b9770e','#2874a6','#a04000','#117864','#6c3483','#196f3d','#922b21','#884ea0'];
function corDe(str){
  var h=0,s=str||'?';
  for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%9973;
  return AV_CORES[h%AV_CORES.length];
}
function iniciais(nome){
  return (nome||'?').split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase()||'?';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function linkUrl(v){
  if(!v) return '';
  v=String(v).trim();
  if(/^https?:\/\//i.test(v)) return v;
  return 'https://'+v.replace(/^@/,'');
}

// ─── AUTH ───
auth.onAuthStateChanged(function(user){
  if(!user){ location.href='login.html'; return; }
  _user=user;
  function verificarAcesso(tentativa){
    db.collection('users').doc(user.uid).get().then(function(doc){
      if(!doc.exists||(doc.data().aprovado!==true&&doc.data().role!=='admin')){
        if((tentativa||0)<20){ setTimeout(function(){verificarAcesso((tentativa||0)+1);},3000); }
        else { auth.signOut().then(function(){location.href='login.html';}); }
        return;
      }
      var d=doc.data();
      _userData=d; _isAdmin=(d.role==='admin');
      if(_isAdmin) document.body.classList.add('is-admin');
      var _nome=d.name||(d.perfil&&d.perfil.nome)||user.email;
      var _role=d.role||'aluno';
      var _turma=_role==='admin'?'Admin':(d.turma||'G20');
      var _foto=(d.perfil&&d.perfil.foto)||d.photo||user.photoURL||'';
      var _inf=d.infinite===true;
      try{localStorage.setItem('g20_user_profile',JSON.stringify({
        name:_nome, role:_role, turma:_turma, photo:_foto, infinite:_inf
      }));}catch(e){}
      (function(){
        var ini=iniciais(_nome);
        var nameEl=document.getElementById('sidebarName');
        var turmaEl=document.getElementById('sidebarTurma');
        var initEl=document.getElementById('sidebarInitials');
        var avEl=document.getElementById('sidebarAvatar');
        if(nameEl) nameEl.innerHTML='<span class="user-name-text">'+esc(_nome)+'</span>'+(_inf?'<span class="badge-infinity">∞ Infinity</span>':'');
        if(turmaEl) turmaEl.textContent=_turma;
        if(initEl) initEl.textContent=ini;
        if(avEl&&_foto) avEl.innerHTML='<img src="'+_foto+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.remove()">';
      })();
      var ub=document.getElementById('sidebarUserBlock');
      if(ub) ub.style.opacity='1';
      if(typeof _g20PreloadSidebar==='function') _g20PreloadSidebar();
      if(window.lucide) lucide.createIcons();
      initComunidade();
    }).catch(function(){
      setTimeout(function(){verificarAcesso((tentativa||0)+1);},5000);
    });
  }
  verificarAcesso(0);
});

// ─── CARGA DOS ALUNOS ───
function initComunidade(){
  db.collection('users').where('aprovado','==',true).get().then(function(snap){
    var lista=[];
    snap.forEach(function(doc){
      var d=doc.data()||{};
      var p=d.perfil||{};
      // só entram alunos que ativaram o perfil público
      if(p.perfilPublico!==true) return;
      lista.push(montarAluno(doc.id,d,p));
    });
    _alunos=lista;
    construirChips();
    aplicarFiltros();
    _aplicarHashAluno(); // se URL tem #aluno-{uid}, abre o mini-perfil
  }).catch(function(){
    document.getElementById('cmnBody').innerHTML=
      '<div class="cmn-empty"><i data-lucide="alert-triangle"></i><h3>Erro ao carregar o Networking</h3><p>Tente recarregar a página.</p></div>';
    if(window.lucide) lucide.createIcons();
  });
}

function montarAluno(uid,d,p){
  var nome=p.nome||d.name||'Aluno G20';
  var cat=p.negocioCategoria||'';
  if(!catInfo(cat) || cat==='') cat='outros';
  // garante que a categoria existe na lista
  var ok=false; for(var i=0;i<CATEGORIAS.length;i++){ if(CATEGORIAS[i].id===cat) ok=true; }
  if(!ok) cat='outros';
  return {
    uid:uid, nome:nome,
    foto:p.foto||d.photo||'',
    profissao:p.profissao||'',
    empresa:p.empresa||'',
    negocio:p.negocio||'',
    categoria:cat,
    cidade:p.cidade||'', estado:p.estado||'',
    turma:d.turma||'G20',
    infinite:d.infinite===true,
    sobre:p.sobre||'',
    instagram:p.instagram||'', linkedin:p.linkedin||'',
    youtube:p.youtube||'', site:p.site||'',
    whatsapp:p.whatsapp||''
  };
}

// ─── CHIPS DE CATEGORIA ───
function construirChips(){
  var presentes={};
  _alunos.forEach(function(a){ presentes[a.categoria]=(presentes[a.categoria]||0)+1; });
  var html='<button class="cmn-chip on" data-cat="" onclick="filtrarCat(\'\',this)">Todas <span style="font-family:var(--mono)">'+_alunos.length+'</span></button>';
  CATEGORIAS.forEach(function(c){
    if(!presentes[c.id]) return;
    html+='<button class="cmn-chip" data-cat="'+c.id+'" onclick="filtrarCat(\''+c.id+'\',this)"><i data-lucide="'+c.icon+'"></i>'+esc(c.label)+' <span style="font-family:var(--mono)">'+presentes[c.id]+'</span></button>';
  });
  document.getElementById('cmnChips').innerHTML=html;
  if(window.lucide) lucide.createIcons();
}
function filtrarCat(cat,btn){
  _catFiltro=cat;
  document.querySelectorAll('.cmn-chip').forEach(function(b){b.classList.remove('on');});
  if(btn) btn.classList.add('on');
  aplicarFiltros();
}

// ─── RENDER ───
// Remove acentos e baixa caixa — para busca tolerante ("juli" acha "Júlia")
function _semAcento(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function aplicarFiltros(){
  var termo=_semAcento((document.getElementById('cmnSearch').value||'').trim());
  var filtrados=_alunos.filter(function(a){
    if(_catFiltro && a.categoria!==_catFiltro) return false;
    if(termo){
      var hay=_semAcento(a.nome+' '+a.profissao+' '+a.negocio+' '+a.empresa);
      if(hay.indexOf(termo)<0) return false;
    }
    return true;
  });
  renderDiretorio(filtrados);
  var cnt=document.getElementById('cmnCount');
  var nCats=0; CATEGORIAS.forEach(function(c){ if(_alunos.some(function(a){return a.categoria===c.id;})) nCats++; });
  cnt.innerHTML='<i data-lucide="users"></i> <span>'+_alunos.length+' aluno'+(_alunos.length===1?'':'s')+' · '+nCats+' área'+(nCats===1?'':'s')+'</span>';
  if(window.lucide) lucide.createIcons();
}

// Score de completude do perfil — quem caprichou aparece primeiro
function _scorePerfil(a){
  var s=0;
  if(a.foto)      s+=2;   // foto pesa mais — diferencia bastante o card
  if(a.negocio)   s+=2;
  if(a.profissao) s+=1;
  if(a.sobre)     s+=1;
  if(a.instagram) s+=1;
  if(a.linkedin)  s+=1;
  if(a.site)      s+=1;
  return s;
}

function renderDiretorio(lista){
  var body=document.getElementById('cmnBody');
  if(!_alunos.length){
    body.innerHTML='<div class="cmn-empty"><i data-lucide="users"></i><h3>O Networking ainda está vazio</h3>'+
      '<p>Nenhum aluno ativou o perfil público até agora. Seja o primeiro: ative o seu em <a href="perfil.html">Meu Perfil</a>.'+
      (_isAdmin?'<br><br>Como admin, use o botão <strong>Pré-visualizar com exemplos</strong> acima para ver a página populada.':'')+'</p></div>';
    if(window.lucide) lucide.createIcons();
    return;
  }
  if(!lista.length){
    body.innerHTML='<div class="cmn-empty"><i data-lucide="search-x"></i><h3>Nenhum aluno encontrado</h3><p>Tente outro termo de busca ou categoria.</p></div>';
    if(window.lucide) lucide.createIcons();
    return;
  }
  var html='';
  CATEGORIAS.forEach(function(c){
    var doGrupo=lista.filter(function(a){return a.categoria===c.id;});
    if(!doGrupo.length) return;
    doGrupo.sort(function(a,b){
      var d=_scorePerfil(b)-_scorePerfil(a);
      return d!==0 ? d : a.nome.localeCompare(b.nome);
    });
    html+='<div class="cmn-cat">';
    html+='<div class="cmn-cat-head"><div class="cmn-cat-ico"><i data-lucide="'+c.icon+'"></i></div>'+
          '<span class="cmn-cat-name">'+esc(c.label)+'</span>'+
          '<span class="cmn-cat-n">'+doGrupo.length+'</span>'+
          '<span class="cmn-cat-line"></span></div>';
    html+='<div class="cmn-grid">';
    doGrupo.forEach(function(a){ html+=cardHtml(a); });
    html+='</div></div>';
  });
  body.innerHTML=html;
  if(window.lucide) lucide.createIcons();
}

function cardHtml(a){
  var av=a.foto
    ? '<div class="cmn-av"><img src="'+a.foto+'" onerror="this.parentNode.textContent=\''+iniciais(a.nome)+'\'"></div>'
    : '<div class="cmn-av" style="background:'+corDe(a.nome)+'">'+iniciais(a.nome)+'</div>';
  var vb=a.visib||{};
  var soc=''
    +socIco(a.instagram && vb.instagram!==false,'instagram','Instagram')
    +socIco(a.whatsapp  && vb.whatsapp !==false,'whatsapp', 'WhatsApp')
    +socIco(a.site      && vb.site     !==false,'globe',    'Site');
  return '<div class="cmn-card" onclick="abrirMiniPerfil(\''+a.uid+'\')">'
    +'<div class="cmn-card-top">'+av
    +'<div class="cmn-card-id"><div class="cmn-card-name">'+esc(a.nome)+(a.infinite?' <span class="inf">∞</span>':'')+'</div>'
    +'<div class="cmn-card-prof">'+esc(a.profissao||'Aluno G20')+'</div></div></div>'
    +'<div class="cmn-card-neg"><i data-lucide="briefcase"></i><span>'+esc(a.negocio||'Negócio não informado')+'</span></div>'
    +'<div class="cmn-card-soc">'+soc+'<span class="cmn-card-turma">'+esc(a.turma)+'</span></div>'
    +'</div>';
}

function socIco(val,icon,nome){
  if(val) return '<span class="cmn-soc" title="'+nome+'">'+_svgRede(icon,15)+'</span>';

// ─── MINI-PERFIL ───
// Deep-link: abre mini-perfil quando a URL traz #aluno-{uid}
function _aplicarHashAluno(){
  var h = window.location.hash || '';
  var m = h.match(/^#aluno-(.+)$/);
  if(!m) return;
  var uid = decodeURIComponent(m[1]);
  if(!_alunos.length){ setTimeout(_aplicarHashAluno, 200); return; }
  abrirMiniPerfil(uid);
}
window.addEventListener('hashchange', _aplicarHashAluno);

function abrirMiniPerfil(uid){
  var a=_alunos.filter(function(x){return x.uid===uid;})[0];
  if(!a) return;
  var av=a.foto
    ? '<div class="mp-av"><img src="'+a.foto+'" onerror="this.parentNode.textContent=\''+iniciais(a.nome)+'\'"></div>'
    : '<div class="mp-av" style="background:'+corDe(a.nome)+'">'+iniciais(a.nome)+'</div>';
  var meta=[a.profissao,a.empresa].filter(Boolean).join(' · ');
  var local=[a.cidade,a.estado].filter(Boolean).join(', ');
  var locLine=(local||a.turma)
    ? '<div class="mp-loc"><i data-lucide="map-pin"></i>'+esc([local,a.turma].filter(Boolean).join('  ·  '))+'</div>' : '';
  var negBox=a.negocio
    ? '<div class="mp-neg-box"><div class="mp-neg-lbl"><i data-lucide="briefcase"></i> Negócio · '+esc(catInfo(a.categoria).label)+'</div>'
      +'<div class="mp-neg-txt">'+esc(a.negocio)+'</div></div>' : '';
  var sobre=a.sobre?'<div class="mp-sobre">'+esc(a.sobre)+'</div>':'';
  var vb=a.visib||{};
  var soc=''
    +mpSoc(a.instagram && vb.instagram!==false,'instagram',linkUrl(a.instagram?'instagram.com/'+a.instagram.replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,''):''))
    +mpSoc(a.linkedin  && vb.linkedin !==false,'linkedin', linkUrl(a.linkedin))
    +mpSoc(a.site      && vb.site     !==false,'globe',    linkUrl(a.site))
    +mpSoc(a.whatsapp  && vb.whatsapp !==false,'whatsapp', a.whatsapp?'https://wa.me/'+String(a.whatsapp).replace(/\D/g,''):'');
  document.getElementById('mpModal').innerHTML=
    '<div class="mp-band"><button class="mp-close" onclick="fecharMiniPerfil()"><i data-lucide="x"></i></button></div>'
    +'<div class="mp-body">'+av
    +'<div class="mp-name">'+esc(a.nome)+(a.infinite?' <span class="inf">∞</span>':'')+'</div>'
    +(meta?'<div class="mp-meta">'+esc(meta)+'</div>':'')
    +locLine+negBox+sobre
    +'<div class="mp-soc-row">'+soc+'</div>'
    +'</div>';
  document.getElementById('mpOverlay').classList.add('open');
  if(window.lucide) lucide.createIcons();
}
function mpSoc(val,icon,url){
  if(val&&url) return '<a class="mp-soc" href="'+esc(url)+'" target="_blank" rel="noopener">'+_svgRede(icon,18)+'</a>';
  return '<span class="mp-soc off">'+_svgRede(icon,18)+'</span>';
}
function fecharMiniPerfil(){ document.getElementById('mpOverlay').classList.remove('open'); }

// ─── SIDEBAR / TOPBAR ───
function toggleSidebar(){
  var sb=document.getElementById('sidebar'),ov=document.getElementById('overlay');
  sb.classList.toggle('open'); ov.classList.toggle('show');
  document.body.style.overflow=sb.classList.contains('open')?'hidden':'';
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
}
function csm(){ if(window.innerWidth<=768) closeSidebar(); }
function toggleSidebarCollapse(){
  var sb=document.getElementById('sidebar');
  var main=document.querySelector('.main');
  if(!sb||window.innerWidth<=768) return;
  var collapsed=sb.classList.contains('sidebar-collapsed');
  if(!collapsed){
    sb.classList.add('sidebar-collapsed');
    document.body.classList.add('sidebar-collapsed');
    document.documentElement.classList.add('sidebar-collapsed');
    sb.style.setProperty('width','68px','important');
    sb.style.setProperty('min-width','68px','important');
    sb.style.setProperty('max-width','68px','important');
    if(main) main.style.setProperty('margin-left','68px','important');
    try{localStorage.setItem('g20_sidebar_collapsed','1');}catch(e){}
  } else {
    sb.classList.remove('sidebar-collapsed');
    document.body.classList.remove('sidebar-collapsed');
    document.documentElement.classList.remove('sidebar-collapsed');
    sb.style.removeProperty('width');
    sb.style.removeProperty('min-width');
    sb.style.removeProperty('max-width');
    if(main) main.style.removeProperty('margin-left');
    try{localStorage.setItem('g20_sidebar_collapsed','0');}catch(e){}
  }
}
window.toggleSidebarCollapse=toggleSidebarCollapse;
(function(){
  try{
    if(localStorage.getItem('g20_sidebar_collapsed')==='1'){
      var sb=document.getElementById('sidebar');
      var main=document.querySelector('.main');
      if(sb){
        sb.classList.add('sidebar-collapsed');
        document.body.classList.add('sidebar-collapsed');
        document.documentElement.classList.add('sidebar-collapsed');
        sb.style.setProperty('width','68px','important');
        sb.style.setProperty('min-width','68px','important');
        sb.style.setProperty('max-width','68px','important');
        if(main) main.style.setProperty('margin-left','68px','important');
      }
    }
  }catch(e){}
})();

document.addEventListener('keydown',function(e){ if(e.key==='Escape') fecharMiniPerfil(); });
