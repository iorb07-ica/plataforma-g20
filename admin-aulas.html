<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Aulas · G20 Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#1a191e; --bg2:#1f1e22; --bg3:#15141a;
  --surface:#27252c; --sur2:#2d2a33;
  --border:rgba(201,169,97,0.08);
  --gold:#c9a961; --gold2:#e8c766;
  --gold-soft:rgba(201,169,97,0.12);
  --gold-border:rgba(201,169,97,0.3);
  --red:#e63946; --green:#2ecc71;
  --text:#e8e6e3; --text2:#9a958e; --text3:#6b6862;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

.adm-topbar{position:sticky;top:0;z-index:100;height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px}
.adm-topbar-logo{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:1px}
.adm-topbar-title{font-size:13px;font-weight:700;color:var(--text2)}
.adm-topbar-badge{background:rgba(201,169,97,.15);border:1px solid var(--gold-border);color:var(--gold);font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:1px}
.adm-topbar-right{margin-left:auto;display:flex;gap:10px;align-items:center}

.adm-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;border:none}
.adm-btn-primary{background:linear-gradient(135deg,#c9a961,#b89751);color:#0d0c10}
.adm-btn-primary:hover{box-shadow:0 4px 14px rgba(201,169,97,.4)}
.adm-btn-ghost{background:transparent;color:var(--text2);border:1px solid rgba(255,255,255,.1)}
.adm-btn-ghost:hover{border-color:var(--gold-border);color:var(--gold)}
.adm-btn-danger{background:rgba(230,57,70,.12);color:var(--red);border:1px solid rgba(230,57,70,.3)}
.adm-btn-danger:hover{background:rgba(230,57,70,.25)}
.adm-btn-migrate{background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.3)}
.adm-btn-migrate:hover{background:rgba(46,204,113,.25)}

.adm-layout{display:flex;height:calc(100vh - 56px)}

.adm-sidebar{width:260px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.adm-sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.adm-mod-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.03);transition:all .15s;border-left:3px solid transparent}
.adm-mod-item:hover{background:rgba(255,255,255,.04)}
.adm-mod-item.active{background:var(--gold-soft);border-left-color:var(--gold)}
.adm-mod-item-tag{font-size:9px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.adm-mod-item-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.adm-mod-item.active .adm-mod-item-title{color:var(--gold2)}
.adm-mod-count{margin-left:auto;background:rgba(255,255,255,.06);color:var(--text3);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;flex-shrink:0}

.adm-main{flex:1;overflow-y:auto;padding:28px 32px}
.adm-empty-state{text-align:center;padding:80px 20px;color:var(--text3)}
.adm-empty-icon{font-size:48px;margin-bottom:16px}
.adm-empty-title{font-size:18px;font-weight:700;color:var(--text2);margin-bottom:8px}

.adm-mod-header{display:flex;align-items:flex-start;gap:20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:0 24px 48px rgba(0,0,0,.55)}
.adm-mod-img{width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.adm-mod-info{flex:1;min-width:0}
.adm-mod-info-tag{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.adm-mod-info-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:4px}
.adm-mod-info-desc{font-size:13px;color:var(--text2);line-height:1.5}
.adm-mod-info-meta{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.adm-mod-meta-chip{font-size:11px;color:var(--text3);background:rgba(255,255,255,.05);padding:3px 10px;border-radius:6px}
.adm-mod-header-actions{display:flex;gap:8px;flex-shrink:0;align-self:flex-start}

.adm-aulas-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.adm-aulas-title{font-size:15px;font-weight:800;color:var(--text)}
.adm-aulas-count{font-size:12px;color:var(--text3)}

.adm-aula-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:10px;display:flex;align-items:center;gap:16px;transition:all .2s}
.adm-aula-card:hover{border-color:var(--gold-border);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.adm-aula-card.unpublished{opacity:.55}
.adm-aula-num{width:32px;height:32px;border-radius:8px;background:rgba(201,169,97,.1);border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0;font-family:"JetBrains Mono",monospace}
.adm-aula-type-icon{font-size:20px;flex-shrink:0}
.adm-aula-info{flex:1;min-width:0}
.adm-aula-titulo{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-aula-desc{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-aula-url{font-size:10px;color:rgba(201,169,97,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-family:"JetBrains Mono",monospace}
.adm-aula-badges{display:flex;gap:6px;align-items:center;flex-shrink:0}
.adm-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.5px}
.adm-badge-video{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3)}
.adm-badge-artigo{background:rgba(52,152,219,.15);color:#3498db;border:1px solid rgba(52,152,219,.3)}
.adm-badge-draft{background:rgba(255,255,255,.05);color:var(--text3);border:1px solid rgba(255,255,255,.08)}
.adm-badge-live{background:rgba(46,204,113,.12);color:#2ecc71;border:1px solid rgba(46,204,113,.3)}
.adm-aula-actions{display:flex;gap:6px;flex-shrink:0}
.adm-icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:7px;cursor:pointer;transition:all .15s;border:none;background:rgba(255,255,255,.04);color:var(--text2);font-size:14px}
.adm-icon-btn:hover{background:rgba(201,169,97,.15);color:var(--gold)}
.adm-icon-btn.danger:hover{background:rgba(230,57,70,.15);color:var(--red)}

/* MODAL */
#admModal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}
#admModal.open{display:flex}
.adm-modal-box{background:#27252c;border:1px solid rgba(201,169,97,.2);border-radius:18px;width:100%;max-width:660px;max-height:90vh;overflow-y:auto;padding:30px 34px;box-shadow:0 32px 80px rgba(0,0,0,.7)}
.adm-modal-title{font-size:16px;font-weight:800;color:var(--gold);margin-bottom:22px;display:flex;align-items:center;gap:8px}
.adm-form-row{margin-bottom:16px}
.adm-form-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
.adm-input,.adm-select,.adm-textarea{width:100%;background:#1f1e22;border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:10px 14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;transition:border-color .2s;box-sizing:border-box}
.adm-input:focus,.adm-select:focus,.adm-textarea:focus{border-color:rgba(201,169,97,.5)}
.adm-select{cursor:pointer}
.adm-textarea{resize:vertical;min-height:80px}
.adm-form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.adm-modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.adm-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.adm-toggle input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}

/* IMAGE PREVIEW */
.adm-img-preview-wrap{margin-top:8px;position:relative}
.adm-img-preview{width:100%;height:150px;border-radius:10px;object-fit:cover;display:none;border:1px solid rgba(255,255,255,.08)}
.adm-img-preview.show{display:block}
.adm-img-err{display:none;align-items:center;justify-content:center;height:40px;margin-top:6px;border-radius:8px;background:rgba(230,57,70,.08);border:1px solid rgba(230,57,70,.2);color:var(--red);font-size:12px;gap:6px}
.adm-img-err.show{display:flex}
.adm-img-hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.6}
.adm-img-hint a{color:var(--gold);cursor:pointer;text-decoration:underline}
.adm-suggest-path{display:flex;align-items:center;gap:6px;background:rgba(201,169,97,.06);border:1px dashed rgba(201,169,97,.25);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .2s;width:100%;font-family:inherit;text-align:left}
.adm-suggest-path:hover{background:rgba(201,169,97,.14);color:var(--gold)}

/* MIGRATE LOG */
.adm-migrate-box{background:rgba(46,204,113,.05);border:1px solid rgba(46,204,113,.2);border-radius:14px;padding:24px;margin-bottom:8px}
.adm-migrate-title{font-size:15px;font-weight:800;color:#2ecc71;margin-bottom:8px}
.adm-migrate-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:8px}
.adm-migrate-log{background:#1a191e;border-radius:8px;padding:12px;font-family:"JetBrains Mono",monospace;font-size:11px;color:#2ecc71;max-height:220px;overflow-y:auto;display:none;margin-top:12px;white-space:pre-wrap;word-break:break-all}

/* TOAST */
.adm-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#27252c;border:1px solid rgba(201,169,97,.3);color:var(--text);padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none}

/* STATUS */
.adm-status{position:fixed;bottom:0;left:0;right:0;height:28px;background:var(--bg3);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;font-size:11px;color:var(--text3);z-index:50}
.adm-status-dot{width:7px;height:7px;border-radius:50%;background:#e63946;flex-shrink:0}
.adm-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(201,169,97,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.adm-divider{height:1px;background:var(--border);margin:12px 0}

/* ── PREVIEW FIEL AO CARD REAL ── */
.adm-card-preview-wrap {
  margin-top: 14px;
}
.adm-card-preview-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text3); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.adm-card-preview-label span {
  background: rgba(201,169,97,.12); border: 1px solid var(--gold-border);
  color: var(--gold); padding: 2px 7px; border-radius: 5px; font-size: 9px;
}
.adm-card-mock {
  position: relative; width: 195px; height: 234px;
  border-radius: 16px; overflow: hidden;
  background: #27252c;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
  flex-shrink: 0;
}
.adm-card-mock-img {
  width: 100%; height: 100%; object-fit: cover;
  display: block; transition: opacity .3s;
}
.adm-card-mock-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(10,9,14,.95) 0%, rgba(10,9,14,.4) 50%, transparent 100%);
}
.adm-card-mock-body {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 11px;
}
.adm-card-mock-tag {
  font-size: 8px; font-weight: 800; letter-spacing: 2px;
  text-transform: uppercase; color: #c9a961; margin-bottom: 4px;
}
.adm-card-mock-title {
  font-size: 11px; font-weight: 800; color: #fff; line-height: 1.25;
  margin: 0 0 4px;
}
.adm-card-mock-meta {
  font-size: 6px; color: rgba(255,255,255,.5);
}
.adm-card-preview-row {
  display: flex; gap: 16px; align-items: flex-start;
}
.adm-card-preview-info {
  flex: 1; font-size: 11px; color: var(--text3); line-height: 1.8;
}
.adm-card-preview-info b { color: var(--text2); }
.adm-img-no-preview {
  width: 195px; height: 234px; border-radius: 16px;
  background: var(--bg3); border: 1px dashed rgba(255,255,255,.1);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 8px; color: var(--text3); font-size: 12px;
  flex-shrink: 0;
}


/* ── SLIDERS DE REPOSICIONAMENTO ── */
.adm-pos-sliders { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.adm-slider-row { display: flex; align-items: center; gap: 10px; }
.adm-slider-label { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; width: 24px; flex-shrink: 0; }
.adm-slider { flex: 1; accent-color: var(--gold); cursor: pointer; height: 4px; }
.adm-slider-val { font-size: 10px; color: var(--text3); font-family: "JetBrains Mono", monospace; width: 36px; text-align: right; flex-shrink: 0; }

/* ── HERO PREVIEW ── */
.adm-hero-mock {
  position: relative; width: 100%; height: 160px;
  border-radius: 10px; overflow: hidden;
  background: #1a191e; margin-top: 8px;
}
.adm-hero-mock-img {
  width: 100%; height: 100%; object-fit: cover;
  object-position: center top; display: block;
}
.adm-hero-mock-overlay {
  position: absolute; inset: 0;
  background:
    linear-gradient(to bottom, transparent 0%, transparent 45%, rgba(26,25,30,.6) 72%, rgba(26,25,30,1) 100%),
    linear-gradient(to right, rgba(26,25,30,.55) 0%, transparent 55%);
}
.adm-hero-mock-label {
  position: absolute; bottom: 12px; left: 14px;
  font-size: 9px; font-weight: 800; color: #c9a961;
  letter-spacing: 1.5px; text-transform: uppercase;
}

</style>
</head>
<body>

<div class="adm-topbar">
  <span class="adm-topbar-logo">G20</span>
  <span class="adm-topbar-title">Admin · Sala de Aula</span>
  <span class="adm-topbar-badge">ADMIN</span>
  <div class="adm-topbar-right">
    <button class="adm-btn adm-btn-migrate" id="btnMigrate" onclick="showMigratePanel()">🔄 Migrar dados</button>
    <button class="adm-btn adm-btn-primary" onclick="openModalNovoModulo()">+ Novo módulo</button>
    <a href="sala-de-aula.html" class="adm-btn adm-btn-ghost">← Voltar</a>
  </div>
</div>

<div class="adm-layout">
  <div class="adm-sidebar">
    <div class="adm-sidebar-header">
      Módulos
      <span class="adm-spinner" id="sidebarSpinner" style="display:none"></span>
    </div>
    <div id="modsList"></div>
  </div>
  <div class="adm-main" id="admMain">
    <div class="adm-empty-state">
      <div class="adm-empty-icon">📚</div>
      <div class="adm-empty-title">Selecione um módulo</div>
      <p style="font-size:13px;color:var(--text3)">Escolha um módulo na barra lateral ou crie um novo.<br>Se for a primeira vez, clique em <strong style="color:var(--green)">🔄 Migrar dados</strong>.</p>
    </div>
  </div>
</div>

<div class="adm-status">
  <span class="adm-status-dot" id="statusDot"></span>
  <span id="statusText">Conectando…</span>
</div>

<!-- MODAL -->
<div id="admModal">
  <div class="adm-modal-box">
    <div class="adm-modal-title" id="admModalTitle">Título</div>
    <div id="admModalBody"></div>
    <div class="adm-modal-footer">
      <button class="adm-btn adm-btn-danger" id="admBtnDelete" onclick="admDelete()" style="display:none;margin-right:auto">🗑 Excluir</button>
      <button class="adm-btn adm-btn-ghost" onclick="admClose()">Cancelar</button>
      <button class="adm-btn adm-btn-primary" id="admBtnSave" onclick="admSave()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="adm-toast" id="admToast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// ─── FIREBASE ───
const _cfg = {
  apiKey: "AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",
  authDomain: "g20-masterclass.firebaseapp.com",
  projectId: "g20-masterclass",
  storageBucket: "g20-masterclass.firebasestorage.app",
  messagingSenderId: "1052719482127",
  appId: "1:1052719482127:web:537c1d67c96532be8a2a7a"
};
if (!firebase.apps.length) firebase.initializeApp(_cfg);
const auth = firebase.auth();
const db   = firebase.firestore();

auth.onAuthStateChanged(function(user) {
  if (!user) { window.location.href = 'login.html'; return; }
  db.collection('users').doc(user.uid).get().then(function(doc) {
    if (!doc.exists || doc.data().role !== 'admin') {
      alert('Acesso restrito a administradores.');
      window.location.href = 'dashboard.html';
      return;
    }
    setStatus('Conectado · ' + user.email, true);
    loadModulos();
  });
});

// ─── ESTADO ───
var MODULOS = [];
var AULAS   = {};
var _activeModuloId = null;
var _modoModal = '';
var _admCtx    = {};

// ─── HELPERS ───
function _esc(s) {
  return (s || '').toString()
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}
function _gv(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function _gb(id) { var el = document.getElementById(id); return el ? el.checked : false; }
function setStatus(msg, ok) {
  document.getElementById('statusText').textContent = msg;
  document.getElementById('statusDot').style.background = ok ? '#2ecc71' : '#e63946';
}
function toast(msg) {
  var t = document.getElementById('admToast');
  t.textContent = msg; t.style.opacity = '1';
  setTimeout(function(){ t.style.opacity = '0'; }, 2500);
}
function getModulo(id) { return MODULOS.find(function(m){ return m.id === id; }); }

// ─── LOAD MÓDULOS ───
function loadModulos() {
  document.getElementById('sidebarSpinner').style.display = 'inline-block';
  db.collection('cursos').doc('g20-masterclass')
    .collection('modulos').orderBy('ordem').get()
    .then(function(snap) {
      MODULOS = [];
      snap.forEach(function(doc) { var m = doc.data(); m.id = doc.id; MODULOS.push(m); });
      document.getElementById('sidebarSpinner').style.display = 'none';
      renderSidebar();
      if (_activeModuloId) selectModulo(_activeModuloId);
    })
    .catch(function(e) {
      setStatus('Erro Firestore: ' + e.message, false);
      document.getElementById('sidebarSpinner').style.display = 'none';
    });
}

function renderSidebar() {
  var list = document.getElementById('modsList');
  if (!MODULOS.length) {
    list.innerHTML = '<div style="padding:20px;font-size:12px;color:var(--text3);text-align:center">Nenhum módulo.<br>Clique em <b>🔄 Migrar dados</b> para começar.</div>';
    return;
  }
  list.innerHTML = MODULOS.map(function(mod) {
    var cnt = (AULAS[mod.id] || []).length;
    return '<div class="adm-mod-item' + (mod.id === _activeModuloId ? ' active' : '') + '" onclick="selectModulo(\'' + mod.id + '\')">' +
      '<div style="flex:1;min-width:0">' +
        '<div class="adm-mod-item-tag">' + _esc(mod.tag || mod.id) + '</div>' +
        '<div class="adm-mod-item-title">' + _esc(mod.title || 'Sem título') + '</div>' +
      '</div>' +
      (cnt ? '<span class="adm-mod-count">' + cnt + '</span>' : '') +
    '</div>';
  }).join('');
}

function selectModulo(moduloId) {
  _activeModuloId = moduloId;
  renderSidebar();
  loadAulas(moduloId);
}

function loadAulas(moduloId) {
  var main = document.getElementById('admMain');
  main.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text3)"><span class="adm-spinner"></span><br><br>Carregando aulas…</div>';
  db.collection('cursos').doc('g20-masterclass')
    .collection('modulos').doc(moduloId)
    .collection('aulas').orderBy('ordem').get()
    .then(function(snap) {
      var aulas = [];
      snap.forEach(function(doc) { var a = doc.data(); a.id = doc.id; aulas.push(a); });
      AULAS[moduloId] = aulas;
      renderModuloView(moduloId, aulas);
    })
    .catch(function(e) {
      main.innerHTML = '<div style="padding:40px;color:var(--text3)">Erro: ' + e.message + '</div>';
    });
}

function renderModuloView(moduloId, aulas) {
  var mod = getModulo(moduloId);
  if (!mod) return;
  var main = document.getElementById('admMain');

  var aulasHtml = aulas.length ? aulas.map(function(aula, idx) {
    var tipoIcon = aula.tipo === 'video' ? '▶️' : '📄';
    var tipoBadge = aula.tipo === 'video'
      ? '<span class="adm-badge adm-badge-video">▶ VIDEO</span>'
      : '<span class="adm-badge adm-badge-artigo">📄 ARTIGO</span>';
    var pubBadge = aula.publicada !== false
      ? '<span class="adm-badge adm-badge-live">● LIVE</span>'
      : '<span class="adm-badge adm-badge-draft">RASCUNHO</span>';
    var aulaIdEsc = _esc(aula.id);
    var modIdEsc  = _esc(moduloId);
    return '<div class="adm-aula-card' + (aula.publicada === false ? ' unpublished' : '') + '">' +
      '<div class="adm-aula-num">' + (idx + 1) + '</div>' +
      '<span class="adm-aula-type-icon">' + tipoIcon + '</span>' +
      '<div class="adm-aula-info">' +
        '<div class="adm-aula-titulo">' + _esc(aula.titulo || 'Sem título') + '</div>' +
        '<div class="adm-aula-desc">' + _esc(aula.desc || '') + '</div>' +
        '<div class="adm-aula-url">' + _esc(aula.url || '') + '</div>' +
      '</div>' +
      '<div class="adm-aula-badges">' + tipoBadge + pubBadge + '</div>' +
      '<div class="adm-aula-actions">' +
        '<button class="adm-icon-btn" onclick="openModalEditAula(\'' + modIdEsc + '\',\'' + aulaIdEsc + '\')" title="Editar">✏️</button>' +
        '<button class="adm-icon-btn danger" onclick="confirmDeleteAula(\'' + modIdEsc + '\',\'' + aulaIdEsc + '\')" title="Excluir">🗑</button>' +
      '</div>' +
    '</div>';
  }).join('') : '<div style="text-align:center;padding:32px;color:var(--text3);font-size:13px">Nenhuma aula. Clique em "+ Nova aula".</div>';

  main.innerHTML =
    '<div class="adm-mod-header">' +
      (mod.img ? '<img class="adm-mod-img" src="' + _esc(mod.img) + '" onerror="this.style.display=\'none\'">' : '') +
      '<div class="adm-mod-info">' +
        '<div class="adm-mod-info-tag">' + _esc(mod.tag || '') + '</div>' +
        '<div class="adm-mod-info-title">' + _esc(mod.title || 'Sem título') + '</div>' +
        '<div class="adm-mod-info-desc">' + _esc(mod.desc || '') + '</div>' +
        '<div class="adm-mod-info-meta">' +
          '<span class="adm-mod-meta-chip">📚 ' + aulas.length + ' aulas</span>' +
          '<span class="adm-mod-meta-chip">⏱ ' + _esc(mod.duracao || '—') + '</span>' +
          '<span class="adm-mod-meta-chip" style="font-family:monospace;font-size:10px">#' + _esc(moduloId) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="adm-mod-header-actions">' +
        '<button class="adm-btn adm-btn-ghost" onclick="openModalEditModulo(\'' + _esc(moduloId) + '\')">✏️ Editar módulo</button>' +
        '<button class="adm-btn adm-btn-danger" onclick="confirmDeleteModulo(\'' + _esc(moduloId) + '\')">🗑</button>' +
      '</div>' +
    '</div>' +
    '<div class="adm-aulas-header">' +
      '<span class="adm-aulas-title">Aulas</span>' +
      '<span class="adm-aulas-count">' + aulas.length + ' total</span>' +
      '<button class="adm-btn adm-btn-primary" style="margin-left:auto" onclick="openModalNovaAula(\'' + _esc(moduloId) + '\')">+ Nova aula</button>' +
    '</div>' +
    '<div id="aulasList">' + aulasHtml + '</div>';
}

// ─── MODAIS ───
function admClose() {
  document.getElementById('admModal').classList.remove('open');
  var btn = document.getElementById('admBtnSave');
  btn.textContent = '💾 Salvar';
  btn.onclick = admSave;
  btn.disabled = false;
  _modoModal = '';
  _admCtx = {};
}

function openModalNovoModulo() {
  _modoModal = 'novoModulo';
  _admCtx = {};
  document.getElementById('admModalTitle').textContent = '+ Novo Módulo';
  document.getElementById('admBtnDelete').style.display = 'none';
  document.getElementById('admModalBody').innerHTML = buildFormModulo({});
  document.getElementById('admModal').classList.add('open');
  setTimeout(function(){ bindImgPreviews(); }, 50);
}

function openModalEditModulo(moduloId) {
  var mod = getModulo(moduloId) || {};
  _modoModal = 'editModulo';
  _admCtx = { moduloId: moduloId };
  document.getElementById('admModalTitle').textContent = '✏️ Editar — ' + _esc(mod.tag || moduloId);
  document.getElementById('admBtnDelete').style.display = 'none';
  document.getElementById('admModalBody').innerHTML = buildFormModulo(mod);
  document.getElementById('admModal').classList.add('open');
  refreshImgPreview('f_img', 'prev_mod_img');
  refreshImgPreview('f_heroImg', 'prev_mod_hero');
  setTimeout(function(){ bindImgPreviews(); }, 50);
}

function openModalNovaAula(moduloId) {
  var mod = getModulo(moduloId);
  var cnt = (AULAS[moduloId] || []).length;
  _modoModal = 'novaAula';
  _admCtx = { moduloId: moduloId };
  document.getElementById('admModalTitle').textContent = '+ Nova Aula' + (mod ? ' — ' + mod.tag : '');
  document.getElementById('admBtnDelete').style.display = 'none';
  document.getElementById('admModalBody').innerHTML = buildFormAula({ ordem: cnt, publicada: true });
  document.getElementById('admModal').classList.add('open');
  setTimeout(function(){ bindImgPreviews(); }, 50);
}

function openModalEditAula(moduloId, aulaId) {
  var aulas = AULAS[moduloId] || [];
  var aula  = aulas.find(function(a){ return a.id === aulaId; }) || {};
  var mod   = getModulo(moduloId);
  _modoModal = 'editAula';
  _admCtx = { moduloId: moduloId, aulaId: aulaId };
  document.getElementById('admModalTitle').textContent = '✏️ Editar Aula' + (mod ? ' — ' + mod.tag : '');
  document.getElementById('admBtnDelete').style.display = 'inline-flex';
  document.getElementById('admModalBody').innerHTML = buildFormAula(aula);
  document.getElementById('admModal').classList.add('open');
  refreshImgPreview('f_previewImg', 'prev_aula_img');
  setTimeout(function(){ bindImgPreviews(); }, 50);
}

// ─── IMAGE PREVIEW ───

// ─── BIND IMG PREVIEWS via addEventListener ───
function bindImgPreviews() {
  var pairs = [
    ['f_img',        'prev_mod_img'],
    ['f_heroImg',    'prev_mod_hero'],
    ['f_previewImg', 'prev_aula_img']
  ];
  pairs.forEach(function(pair) {
    var input = document.getElementById(pair[0]);
    var prevId = pair[1];
    if (!input) return;
    // Remover listener anterior se existir
    if (input._imgListener) input.removeEventListener('input', input._imgListener);
    input._imgListener = function() { refreshImgPreview(pair[0], prevId); };
    input.addEventListener('input', input._imgListener);
  });
  // Sincroniza campos de texto no mock
  ['f_tag','f_title','f_duracao'].forEach(function(fid) {
    var el = document.getElementById(fid);
    if (!el) return;
    if (el._syncListener) el.removeEventListener('input', el._syncListener);
    el._syncListener = syncMockCard;
    el.addEventListener('input', el._syncListener);
  });
  // Sliders de reposicionamento
  var slX = document.getElementById('slider_img_x');
  var slY = document.getElementById('slider_img_y');
  if (slX) {
    slX.oninput = function() {
      document.getElementById('slider_img_x_val').textContent = slX.value + '%';
      updateImgPosition();
    };
  }
  if (slY) {
    slY.oninput = function() {
      document.getElementById('slider_img_y_val').textContent = slY.value + '%';
      updateImgPosition();
    };
  }
  // Restaurar posição salva se existir
  if (_admCtx && _admCtx.moduloId) {
    var mod = getModulo(_admCtx.moduloId);
    if (mod && mod.imgPosition) {
      var parts = (mod.imgPosition + '').split(' ');
      if (slX && parts[0]) { slX.value = parseInt(parts[0]) || 50; document.getElementById('slider_img_x_val').textContent = slX.value + '%'; }
      if (slY && parts[1]) { slY.value = parseInt(parts[1]) || 50; document.getElementById('slider_img_y_val').textContent = slY.value + '%'; }
      updateImgPosition();
    }
  }
}

function updateImgPosition() {
  var slX = document.getElementById('slider_img_x');
  var slY = document.getElementById('slider_img_y');
  if (!slX || !slY) return;
  var pos = slX.value + '% ' + slY.value + '%';
  var img = document.getElementById('prev_mod_img');
  if (img) img.style.objectPosition = pos;
}

function refreshImgPreview(inputId, previewId) {
  var input   = document.getElementById(inputId);
  var preview = document.getElementById(previewId);
  var errEl   = document.getElementById(previewId + '_err');
  if (!input || !preview) return;
  var url = input.value.trim();
  if (!url) {
    preview.style.opacity = '0.2';
    if (errEl) errEl.style.display = 'none';
    return;
  }
  preview.style.opacity = '1';
  preview.src = url;
  preview.onload  = function() { if (errEl) errEl.style.display = 'none'; };
  preview.onerror = function() { preview.style.opacity = '0.1'; if (errEl) errEl.style.display = 'inline'; };
}

// Sincroniza tag/título/duração no mock card em tempo real
function syncMockCard() {
  var tag   = document.getElementById('f_tag');
  var title = document.getElementById('f_title');
  var dur   = document.getElementById('f_duracao');
  var pTag  = document.getElementById('prev_mod_tag');
  var pTit  = document.getElementById('prev_mod_title');
  var pMet  = document.getElementById('prev_mod_meta');
  if (tag   && pTag)  pTag.textContent  = tag.value   || 'MÓDULO';
  if (title && pTit)  pTit.textContent  = title.value || 'Título do módulo';
  if (dur   && pMet)  pMet.textContent  = dur.value   || '';
}

function suggestAulaPath() {
  var aulaId = _admCtx.aulaId || 'nova-aula';
  var url = 'https://iorb07-ica.github.io/plataforma-g20/assets/aulas/' + aulaId + '.jpg';
  var input = document.getElementById('f_previewImg');
  if (input) { input.value = url; refreshImgPreview('f_previewImg', 'prev_aula_img'); }
}

// ─── SALVAR ───
function admSave() {
  if (_modoModal === 'novoModulo')  { _saveNovoModulo(); return; }
  if (_modoModal === 'editModulo')  { _saveEditModulo(); return; }
  if (_modoModal === 'novaAula')    { _saveNovaAula(); return; }
  if (_modoModal === 'editAula')    { _saveEditAula(); return; }
}

function _setSaving() {
  var btn = document.getElementById('admBtnSave');
  btn.textContent = '⏳'; btn.disabled = true;
  return btn;
}
function _resetBtn(btn) { btn.textContent = '💾 Salvar'; btn.disabled = false; }

function _saveNovoModulo() {
  var btn = _setSaving();
  var id = _gv('f_id');
  if (!id) { alert('ID é obrigatório.'); _resetBtn(btn); return; }
  var data = { id: id, tag: _gv('f_tag'), title: _gv('f_title'), desc: _gv('f_desc'),
    duracao: _gv('f_duracao'), ordem: parseInt(_gv('f_ordem')) || 0,
    img: _gv('f_img'), heroImg: _gv('f_heroImg') || null };
  db.collection('cursos').doc('g20-masterclass').collection('modulos').doc(id).set(data)
    .then(function() {
      MODULOS.push(data);
      MODULOS.sort(function(a,b){ return (a.ordem||0) - (b.ordem||0); });
      renderSidebar(); admClose(); toast('✅ Módulo criado!');
    }).catch(function(e){ alert('Erro: ' + e.message); _resetBtn(btn); });
}

function _saveEditModulo() {
  var btn = _setSaving();
  var mId = _admCtx.moduloId;
  var _slX = document.getElementById('slider_img_x');
  var _slY = document.getElementById('slider_img_y');
  var _imgPos = (_slX && _slY) ? (_slX.value + '% ' + _slY.value + '%') : '50% 50%';
  var data = { tag: _gv('f_tag'), title: _gv('f_title'), desc: _gv('f_desc'),
    duracao: _gv('f_duracao'), ordem: parseInt(_gv('f_ordem')) || 0,
    img: _gv('f_img'), heroImg: _gv('f_heroImg') || null,
    imgPosition: _imgPos };
  db.collection('cursos').doc('g20-masterclass').collection('modulos').doc(mId).update(data)
    .then(function() {
      var mod = getModulo(mId); if (mod) Object.assign(mod, data);
      renderSidebar();
      if (_activeModuloId === mId) renderModuloView(mId, AULAS[mId] || []);
      admClose(); toast('✅ Módulo salvo!');
    }).catch(function(e){ alert('Erro: ' + e.message); _resetBtn(btn); });
}

function _saveNovaAula() {
  var btn = _setSaving();
  var mId = _admCtx.moduloId;
  var pImg = _gv('f_previewImg'), pFonte = _gv('f_previewFonte'), pResumo = _gv('f_previewResumo');
  var data = { titulo: _gv('f_titulo'), desc: _gv('f_desc'), tipo: _gv('f_tipo'),
    url: _gv('f_url'), ordem: parseInt(_gv('f_ordem')) || 0,
    publicada: _gb('f_publicada'), criadoEm: Date.now() };
  if (pImg || pFonte || pResumo) data.preview = { img: pImg, fonte: pFonte, resumo: pResumo };
  var ref = db.collection('cursos').doc('g20-masterclass').collection('modulos').doc(mId).collection('aulas').doc();
  data.id = ref.id;
  ref.set(data).then(function() {
    if (!AULAS[mId]) AULAS[mId] = [];
    AULAS[mId].push(data);
    AULAS[mId].sort(function(a,b){ return (a.ordem||0) - (b.ordem||0); });
    renderSidebar(); renderModuloView(mId, AULAS[mId]);
    admClose(); toast('✅ Aula criada!');
  }).catch(function(e){ alert('Erro: ' + e.message); _resetBtn(btn); });
}

function _saveEditAula() {
  var btn = _setSaving();
  var mId = _admCtx.moduloId, aId = _admCtx.aulaId;
  var pImg = _gv('f_previewImg'), pFonte = _gv('f_previewFonte'), pResumo = _gv('f_previewResumo');
  var data = { titulo: _gv('f_titulo'), desc: _gv('f_desc'), tipo: _gv('f_tipo'),
    url: _gv('f_url'), ordem: parseInt(_gv('f_ordem')) || 0, publicada: _gb('f_publicada') };
  if (pImg || pFonte || pResumo) data.preview = { img: pImg, fonte: pFonte, resumo: pResumo };
  db.collection('cursos').doc('g20-masterclass').collection('modulos').doc(mId).collection('aulas').doc(aId).update(data)
    .then(function() {
      var arr = AULAS[mId] || [];
      var idx = arr.findIndex(function(a){ return a.id === aId; });
      if (idx >= 0) Object.assign(arr[idx], data);
      renderModuloView(mId, arr); admClose(); toast('✅ Aula salva!');
    }).catch(function(e){ alert('Erro: ' + e.message); _resetBtn(btn); });
}

// ─── DELETAR ───
function admDelete() {
  if (_modoModal !== 'editAula') return;
  confirmDeleteAula(_admCtx.moduloId, _admCtx.aulaId);
  admClose();
}

function confirmDeleteAula(moduloId, aulaId) {
  if (!confirm('Excluir esta aula? Não pode desfazer.')) return;
  db.collection('cursos').doc('g20-masterclass').collection('modulos').doc(moduloId).collection('aulas').doc(aulaId).delete()
    .then(function() {
      AULAS[moduloId] = (AULAS[moduloId] || []).filter(function(a){ return a.id !== aulaId; });
      renderModuloView(moduloId, AULAS[moduloId]); renderSidebar(); toast('🗑 Aula excluída.');
    }).catch(function(e){ alert('Erro: ' + e.message); });
}

function confirmDeleteModulo(moduloId) {
  var aulas = AULAS[moduloId] || [];
  if (!confirm('Excluir módulo "' + moduloId + '" e suas ' + aulas.length + ' aulas? IRREVERSÍVEL.')) return;
  var ps = aulas.map(function(a) {
    return db.collection('cursos').doc('g20-masterclass').collection('modulos').doc(moduloId).collection('aulas').doc(a.id).delete();
  });
  Promise.all(ps).then(function() {
    return db.collection('cursos').doc('g20-masterclass').collection('modulos').doc(moduloId).delete();
  }).then(function() {
    MODULOS = MODULOS.filter(function(m){ return m.id !== moduloId; });
    delete AULAS[moduloId]; _activeModuloId = null; renderSidebar();
    document.getElementById('admMain').innerHTML = '<div class="adm-empty-state"><div class="adm-empty-icon">🗑</div><div class="adm-empty-title">Módulo excluído</div></div>';
    toast('🗑 Módulo excluído.');
  }).catch(function(e){ alert('Erro: ' + e.message); });
}

function showMigratePanel() {
  _modoModal = 'migrate';
  document.getElementById('admModalTitle').textContent = '🔄 Migrar dados hardcoded → Firestore';
  document.getElementById('admBtnDelete').style.display = 'none';
  document.getElementById('admModalBody').innerHTML =
    '<div class="adm-migrate-box">' +
      '<div class="adm-migrate-title">⚠️ Operação única</div>' +
      '<div class="adm-migrate-desc">Popula o Firestore com 5 módulos e 30 aulas. Se já existirem dados, serão preservados (merge). Faça isso UMA VEZ.</div>' +
      '<div id="admMigrateLog" class="adm-migrate-log"></div>' +
    '</div>';
  var btn = document.getElementById('admBtnSave');
  btn.textContent = '🔄 Executar migração';
  btn.onclick = executeMigration;
  document.getElementById('admModal').classList.add('open');
}

function executeMigration() {
  var btn = document.getElementById('admBtnSave');
  btn.textContent = '⏳'; btn.disabled = true;
  var log = document.getElementById('admMigrateLog');
  log.style.display = 'block';
  log.textContent = '[START] Iniciando migração...\n';

  var total = SA_MODULOS_DATA.length;
  var done  = 0;

  function logLine(msg) { log.textContent += msg + '\n'; log.scrollTop = log.scrollHeight; }

  SA_MODULOS_DATA.forEach(function(mod) {
    var aulasList = mod.aulas;
    var modData = {};
    Object.keys(mod).forEach(function(k){ if (k !== 'aulas') modData[k] = mod[k]; });

    db.collection('cursos').doc('g20-masterclass').collection('modulos').doc(mod.id)
      .set(modData, { merge: true })
      .then(function() {
        logLine('[OK] Módulo: ' + mod.tag + ' (' + mod.id + ')');
        var aulasPs = aulasList.map(function(aula) {
          return db.collection('cursos').doc('g20-masterclass')
            .collection('modulos').doc(mod.id)
            .collection('aulas').doc(aula.id)
            .set(aula, { merge: true })
            .then(function(){ logLine('     ✓ ' + aula.titulo.substring(0, 45)); })
            .catch(function(e){ logLine('     ✗ ERRO: ' + e.message); });
        });
        return Promise.all(aulasPs);
      })
      .then(function() {
        done++;
        if (done === total) {
          logLine('\n[DONE] Migração concluída! ' + total + ' módulos populados.');
          btn.textContent = '✅ Concluído';
          btn.disabled = false;
          btn.onclick = function() { admClose(); loadModulos(); };
        }
      })
      .catch(function(e) { logLine('[ERRO] ' + mod.id + ': ' + e.message); });
  });
}
