<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Aulas · G20 Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root {
  --bg:#1a191e; --bg2:#1f1e22; --bg3:#15141a;
  --surface:#27252c; --sur2:#2d2a33;
  --border:rgba(201,169,97,0.08);
  --gold:#c9a961; --gold2:#e8c766;
  --gold-soft:rgba(201,169,97,0.12);
  --gold-border:rgba(201,169,97,0.3);
  --red:#e63946; --green:#2ecc71;
  --text:#e8e6e3; --text2:#9a958e; --text3:#6b6862;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 24px 48px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

/* TOPBAR */
.adm-topbar{
  position:sticky;top:0;z-index:100;
  height:56px;background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  padding:0 24px;
}
.adm-topbar-logo{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:1px}
.adm-topbar-title{font-size:13px;font-weight:700;color:var(--text2)}
.adm-topbar-badge{background:rgba(201,169,97,.15);border:1px solid var(--gold-border);color:var(--gold);font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:1px}
.adm-topbar-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.adm-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;border:none}
.adm-btn-primary{background:linear-gradient(135deg,#c9a961,#b89751);color:#0d0c10}
.adm-btn-primary:hover{box-shadow:0 4px 14px rgba(201,169,97,.4)}
.adm-btn-ghost{background:transparent;color:var(--text2);border:1px solid rgba(255,255,255,.1)}
.adm-btn-ghost:hover{border-color:var(--gold-border);color:var(--gold)}
.adm-btn-danger{background:rgba(230,57,70,.12);color:var(--red);border:1px solid rgba(230,57,70,.3)}
.adm-btn-danger:hover{background:rgba(230,57,70,.25)}
.adm-btn-migrate{background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.3)}
.adm-btn-migrate:hover{background:rgba(46,204,113,.25)}

/* LAYOUT */
.adm-layout{display:flex;height:calc(100vh - 56px)}

/* SIDEBAR */
.adm-sidebar{
  width:260px;flex-shrink:0;
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;
}
.adm-sidebar-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  font-size:11px;font-weight:700;letter-spacing:1.5px;
  color:var(--text3);text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;
}
.adm-mod-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.03);
  transition:all .15s;position:relative;
  border-left:3px solid transparent;
}
.adm-mod-item:hover{background:rgba(255,255,255,.04)}
.adm-mod-item.active{background:var(--gold-soft);border-left-color:var(--gold)}
.adm-mod-item-tag{font-size:9px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.adm-mod-item-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.adm-mod-item.active .adm-mod-item-title{color:var(--gold2)}
.adm-mod-count{margin-left:auto;background:rgba(255,255,255,.06);color:var(--text3);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;flex-shrink:0}

/* MAIN AREA */
.adm-main{flex:1;overflow-y:auto;padding:28px 32px}
.adm-empty-state{text-align:center;padding:80px 20px;color:var(--text3)}
.adm-empty-state-icon{font-size:48px;margin-bottom:16px}
.adm-empty-state-title{font-size:18px;font-weight:700;color:var(--text2);margin-bottom:8px}

/* MÓDULO HEADER */
.adm-mod-header{
  display:flex;align-items:flex-start;gap:20px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:24px;margin-bottom:24px;
  box-shadow:var(--shadow);
}
.adm-mod-img{width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.adm-mod-info{flex:1;min-width:0}
.adm-mod-info-tag{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.adm-mod-info-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:4px}
.adm-mod-info-desc{font-size:13px;color:var(--text2);line-height:1.5}
.adm-mod-info-meta{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.adm-mod-meta-chip{font-size:11px;color:var(--text3);background:rgba(255,255,255,.05);padding:3px 10px;border-radius:6px}
.adm-mod-header-actions{display:flex;gap:8px;flex-shrink:0;align-self:flex-start}

/* AULAS TABLE */
.adm-aulas-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:16px;
}
.adm-aulas-title{font-size:15px;font-weight:800;color:var(--text)}
.adm-aulas-count{font-size:12px;color:var(--text3)}

.adm-aula-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px 20px;margin-bottom:10px;
  display:flex;align-items:center;gap:16px;
  transition:all .2s;position:relative;
}
.adm-aula-card:hover{border-color:var(--gold-border);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.adm-aula-card.unpublished{opacity:.55}
.adm-aula-num{
  width:32px;height:32px;border-radius:8px;
  background:rgba(201,169,97,.1);border:1px solid var(--gold-border);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0;
  font-family:"JetBrains Mono",monospace;
}
.adm-aula-type-icon{font-size:20px;flex-shrink:0}
.adm-aula-info{flex:1;min-width:0}
.adm-aula-titulo{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-aula-desc{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-aula-url{font-size:10px;color:rgba(201,169,97,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-family:"JetBrains Mono",monospace}
.adm-aula-badges{display:flex;gap:6px;align-items:center;flex-shrink:0}
.adm-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.5px}
.adm-badge-video{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3)}
.adm-badge-artigo{background:rgba(52,152,219,.15);color:#3498db;border:1px solid rgba(52,152,219,.3)}
.adm-badge-draft{background:rgba(255,255,255,.05);color:var(--text3);border:1px solid rgba(255,255,255,.08)}
.adm-badge-live{background:rgba(46,204,113,.12);color:#2ecc71;border:1px solid rgba(46,204,113,.3)}
.adm-aula-actions{display:flex;gap:6px;flex-shrink:0}
.adm-icon-btn{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:7px;cursor:pointer;transition:all .15s;border:none;
  background:rgba(255,255,255,.04);color:var(--text2);font-size:14px;
}
.adm-icon-btn:hover{background:rgba(201,169,97,.15);color:var(--gold)}
.adm-icon-btn.danger:hover{background:rgba(230,57,70,.15);color:var(--red)}

/* MODAL */
#admModal{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:16px;
}
#admModal.open{display:flex}
.adm-modal-box{
  background:#27252c;border:1px solid rgba(201,169,97,.2);
  border-radius:18px;width:100%;max-width:660px;
  max-height:90vh;overflow-y:auto;padding:30px 34px;
  box-shadow:0 32px 80px rgba(0,0,0,.7);
}
.adm-modal-title{font-size:16px;font-weight:800;color:var(--gold);margin-bottom:22px;display:flex;align-items:center;gap:8px}
.adm-form-row{margin-bottom:16px}
.adm-form-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
.adm-input,.adm-select,.adm-textarea{
  width:100%;background:#1f1e22;border:1px solid rgba(255,255,255,.1);
  border-radius:9px;padding:10px 14px;font-size:14px;color:var(--text);
  font-family:inherit;outline:none;transition:border-color .2s;box-sizing:border-box;
}
.adm-input:focus,.adm-select:focus,.adm-textarea:focus{border-color:rgba(201,169,97,.5)}
.adm-select{cursor:pointer}
.adm-textarea{resize:vertical;min-height:80px}
.adm-form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.adm-modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.adm-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.adm-toggle input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}

/* MIGRATE PANEL */
.adm-migrate-panel{
  background:rgba(46,204,113,.05);border:1px solid rgba(46,204,113,.2);
  border-radius:14px;padding:24px;margin-bottom:24px;
}
.adm-migrate-title{font-size:15px;font-weight:800;color:#2ecc71;margin-bottom:8px}
.adm-migrate-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px}
.adm-migrate-log{
  background:#1a191e;border-radius:8px;padding:12px;
  font-family:"JetBrains Mono",monospace;font-size:11px;color:#2ecc71;
  max-height:200px;overflow-y:auto;display:none;margin-top:12px;
}

/* TOAST */
.adm-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#27252c;border:1px solid rgba(201,169,97,.3);color:var(--text);
  padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;
  z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none;
}

/* LOADING */
.adm-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(201,169,97,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.adm-section-divider{height:1px;background:var(--border);margin:20px 0}

/* STATUS BAR */
.adm-status{
  position:fixed;bottom:0;left:0;right:0;height:28px;
  background:var(--bg3);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:16px;
  font-size:11px;color:var(--text3);z-index:50;
}
.adm-status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}

/* IMAGE PREVIEW */
.adm-img-field { position: relative; }
.adm-img-preview {
  width: 100%; height: 160px;
  border-radius: 10px;
  object-fit: cover;
  margin-top: 8px;
  background: #1f1e22;
  border: 1px solid rgba(255,255,255,.08);
  display: none;
}
.adm-img-preview.visible { display: block; }
.adm-img-preview-error {
  display: none; align-items: center; justify-content: center;
  height: 48px; margin-top: 8px;
  border-radius: 8px; background: rgba(230,57,70,.08);
  border: 1px solid rgba(230,57,70,.2);
  color: var(--red); font-size: 12px; gap: 6px;
}
.adm-img-preview-error.visible { display: flex; }
.adm-img-hint {
  font-size: 11px; color: var(--text3); margin-top: 6px;
  display: flex; align-items: center; gap: 6px;
}
.adm-img-hint a { color: var(--gold); text-decoration: underline; cursor: pointer; }
.adm-img-shortcut {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(201,169,97,.08); border: 1px dashed rgba(201,169,97,.3);
  border-radius: 8px; padding: 8px 12px; margin-top: 8px;
  font-size: 12px; color: var(--text2); cursor: pointer; transition: all .2s; width: 100%;
}
.adm-img-shortcut:hover { background: rgba(201,169,97,.15); color: var(--gold); }

</style>
</head>
<body>

<!-- TOPBAR -->
<div class="adm-topbar">
  <span class="adm-topbar-logo">G20</span>
  <span class="adm-topbar-title">Admin · Sala de Aula</span>
  <span class="adm-topbar-badge">ADMIN</span>
  <div class="adm-topbar-right">
    <button class="adm-btn adm-btn-migrate" onclick="showMigratePanel()" id="btnMigrate">
      🔄 Migrar dados
    </button>
    <button class="adm-btn adm-btn-primary" onclick="openModalNovoModulo()">
      + Novo módulo
    </button>
    <a href="sala-de-aula.html" class="adm-btn adm-btn-ghost">← Voltar</a>
  </div>
</div>

<div class="adm-layout">
  <!-- SIDEBAR MÓDULOS -->
  <div class="adm-sidebar">
    <div class="adm-sidebar-header">
      Módulos
      <div class="adm-spinner" id="sidebarSpinner"></div>
    </div>
    <div id="modsList"></div>
  </div>

  <!-- ÁREA PRINCIPAL -->
  <div class="adm-main" id="admMain">
    <div class="adm-empty-state">
      <div class="adm-empty-state-icon">📚</div>
      <div class="adm-empty-state-title">Selecione um módulo</div>
      <p style="font-size:13px;color:var(--text3)">Escolha um módulo na barra lateral ou crie um novo.</p>
    </div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="adm-status">
  <span class="adm-status-dot" id="statusDot"></span>
  <span id="statusText">Conectando ao Firestore…</span>
</div>

<!-- MODAL GENÉRICO -->
<div id="admModal">
  <div class="adm-modal-box">
    <div class="adm-modal-title" id="admModalTitle">Título</div>
    <div id="admModalBody"></div>
    <div class="adm-modal-footer">
      <button class="adm-btn adm-btn-danger" id="admBtnDelete" onclick="admDelete()" style="display:none;margin-right:auto">🗑 Excluir</button>
      <button class="adm-btn adm-btn-ghost" onclick="admClose()">Cancelar</button>
      <button class="adm-btn adm-btn-primary" onclick="admSave()" id="admBtnSave">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="adm-toast" id="admToast"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const _cfg = {
  apiKey:"AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",
  authDomain:"g20-masterclass.firebaseapp.com",
  projectId:"g20-masterclass",
  storageBucket:"g20-masterclass.firebasestorage.app",
  messagingSenderId:"1052719482127",
  appId:"1:1052719482127:web:537c1d67c96532be8a2a7a"
};
if (!firebase.apps.length) firebase.initializeApp(_cfg);
const auth = firebase.auth();
const db = firebase.firestore();

// ─── AUTH CHECK ───
auth.onAuthStateChanged(function(user) {
  if (!user) { window.location.href = 'login.html'; return; }
  db.collection('users').doc(user.uid).get().then(function(doc) {
    if (!doc.exists || doc.data().role !== 'admin') {
      alert('Acesso restrito a administradores.');
      window.location.href = 'dashboard.html';
      return;
    }
    setStatus('Firestore conectado · ' + user.email, true);
    loadModulos();
  });
});

// ─── ESTADO ───
var MODULOS = []; // [{id, tag, title, ...}]
var AULAS = {};   // {moduloId: [{id, titulo, ...}]}
var _activeModuloId = null;
var _admCtx = {};

// ─── LOAD MÓDULOS ───
function loadModulos() {
  document.getElementById('sidebarSpinner').style.display = 'inline-block';
  db.collection('cursos').doc('g20-masterclass')
    .collection('modulos').orderBy('ordem').get()
    .then(function(snap) {
      MODULOS = [];
      snap.forEach(function(doc) {
        var m = doc.data(); m.id = doc.id;
        MODULOS.push(m);
      });
      document.getElementById('sidebarSpinner').style.display = 'none';
      renderSidebar();
    })
    .catch(function(e) {
      setStatus('Erro: ' + e.message, false);
      document.getElementById('sidebarSpinner').style.display = 'none';
    });
}

function renderSidebar() {
  var list = document.getElementById('modsList');
  if (!MODULOS.length) {
    list.innerHTML = '<div style="padding:20px;font-size:12px;color:var(--text3);text-align:center">Nenhum módulo. Use "Migrar dados" ou "Novo módulo".</div>';
    return;
  }
  list.innerHTML = MODULOS.map(function(mod) {
    var cnt = (AULAS[mod.id] || []).length;
    return '<div class="adm-mod-item' + (mod.id===_activeModuloId?' active':'') + '" onclick="selectModulo(\'' + mod.id + '\')">' +
      '<div style="flex:1;min-width:0">' +
        '<div class="adm-mod-item-tag">' + (mod.tag||mod.id) + '</div>' +
        '<div class="adm-mod-item-title">' + (mod.title||'Sem título') + '</div>' +
      '</div>' +
      (cnt ? '<span class="adm-mod-count">' + cnt + '</span>' : '') +
    '</div>';
  }).join('');
}

// ─── SELECIONA MÓDULO ───
function selectModulo(moduloId) {
  _activeModuloId = moduloId;
  renderSidebar();
  loadAulas(moduloId);
}

function loadAulas(moduloId) {
  var main = document.getElementById('admMain');
  main.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3);font-size:13px"><div class="adm-spinner"></div><br>Carregando aulas…</div>';

  db.collection('cursos').doc('g20-masterclass')
    .collection('modulos').doc(moduloId)
    .collection('aulas').orderBy('ordem').get()
    .then(function(snap) {
      var aulas = [];
      snap.forEach(function(doc) { var a = doc.data(); a.id = doc.id; aulas.push(a); });
      AULAS[moduloId] = aulas;
      renderModuloView(moduloId, aulas);
    })
    .catch(function(e) { main.innerHTML = '<div style="padding:40px;color:var(--text3)">Erro: ' + e.message + '</div>'; });
}

function getModulo(id) { return MODULOS.find(function(m){ return m.id===id; }); }

function renderModuloView(moduloId, aulas) {
  var mod = getModulo(moduloId);
  if (!mod) return;
  var main = document.getElementById('admMain');

  var aulasHtml = aulas.length ? aulas.map(function(aula, idx) {
    var tipoIcon = aula.tipo === 'video' ? '▶️' : '📄';
    var badge = aula.tipo === 'video'
      ? '<span class="adm-badge adm-badge-video">▶ VIDEO</span>'
      : '<span class="adm-badge adm-badge-artigo">📄 ARTIGO</span>';
    var pubBadge = aula.publicada !== false
      ? '<span class="adm-badge adm-badge-live">● LIVE</span>'
      : '<span class="adm-badge adm-badge-draft">RASCUNHO</span>';
    return '<div class="adm-aula-card' + (aula.publicada===false?' unpublished':'') + '" id="aula-' + aula.id + '">' +
      '<div class="adm-aula-num">' + (idx+1) + '</div>' +
      '<span class="adm-aula-type-icon">' + tipoIcon + '</span>' +
      '<div class="adm-aula-info">' +
        '<div class="adm-aula-titulo">' + _esc(aula.titulo||'Sem título') + '</div>' +
        '<div class="adm-aula-desc">' + _esc(aula.desc||'') + '</div>' +
        '<div class="adm-aula-url">' + _esc(aula.url||'') + '</div>' +
      '</div>' +
      '<div class="adm-aula-badges">' + badge + pubBadge + '</div>' +
      '<div class="adm-aula-actions">' +
        '<button class="adm-icon-btn" onclick="openModalEditAula(\'' + moduloId + '\',\'' + aula.id + '\')" title="Editar">✏️</button>' +
        '<button class="adm-icon-btn danger" onclick="deleteAula(\'' + moduloId + '\',\'' + aula.id + '\')" title="Excluir">🗑</button>' +
      '</div>' +
    '</div>';
  }).join('') : '<div style="text-align:center;padding:32px;color:var(--text3);font-size:13px">Nenhuma aula neste módulo.</div>';

  main.innerHTML =
    '<div class="adm-mod-header">' +
      (mod.img ? '<img class="adm-mod-img" src="' + mod.img + '" onerror="this.style.display=\'none\'">' : '') +
      '<div class="adm-mod-info">' +
        '<div class="adm-mod-info-tag">' + (mod.tag||'') + '</div>' +
        '<div class="adm-mod-info-title">' + _esc(mod.title||'Sem título') + '</div>' +
        '<div class="adm-mod-info-desc">' + _esc(mod.desc||'') + '</div>' +
        '<div class="adm-mod-info-meta">' +

function admSave() {
  var btn = document.getElementById('admBtnSave');
  btn.textContent = '⏳'; btn.disabled = true;

  if (_modoModal === 'novoModulo') _saveNovoModulo(btn);
  else if (_modoModal === 'editModulo') _saveEditModulo(btn);
  else if (_modoModal === 'novaAula') _saveNovaAula(btn);
  else if (_modoModal === 'editAula') _saveEditAula(btn);
}

function _gv(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function _gb(id) { var el = document.getElementById(id); return el ? el.checked : false; }

function _saveNovoModulo(btn) {
  var id = _gv('f_id');
  if (!id) { alert('ID é obrigatório'); btn.textContent='💾 Salvar'; btn.disabled=false; return; }
  var data = {
    id: id, tag: _gv('f_tag'), title: _gv('f_title'), desc: _gv('f_desc'),
    duracao: _gv('f_duracao'), ordem: parseInt(_gv('f_ordem'))||0,
    img: _gv('f_img'), heroImg: _gv('f_heroImg')||null
  };
  db.collection('cursos').doc('g20-masterclass')
    .collection('modulos').doc(id).set(data)
    .then(function() {
      MODULOS.push(data);
      MODULOS.sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); });
      renderSidebar();
      admClose();
      toast('✅ Módulo criado!');
      btn.textContent='💾 Salvar'; btn.disabled=false;
    }).catch(function(e){ alert('Erro: '+e.message); btn.textContent='💾 Salvar'; btn.disabled=false; });
}

function _saveEditModulo(btn) {
  var moduloId = _admCtx.moduloId;
  var data = {
    tag: _gv('f_tag'), title: _gv('f_title'), desc: _gv('f_desc'),
    duracao: _gv('f_duracao'), ordem: parseInt(_gv('f_ordem'))||0,
    img: _gv('f_img'), heroImg: _gv('f_heroImg')||null
  };
  db.collection('cursos').doc('g20-masterclass')
    .collection('modulos').doc(moduloId).update(data)
    .then(function() {
      var mod = getModulo(moduloId);
      if (mod) Object.assign(mod, data);
      renderSidebar();
      if (_activeModuloId === moduloId) renderModuloView(moduloId, AULAS[moduloId]||[]);
      admClose(); toast('✅ Módulo salvo!');
      btn.textContent='💾 Salvar'; btn.disabled=false;
    }).catch(function(e){ alert('Erro: '+e.message); btn.textContent='💾 Salvar'; btn.disabled=false; });
}

function _saveNovaAula(btn) {
  var moduloId = _admCtx.moduloId;
  var previewImg = _gv('f_previewImg');
  var previewFonte = _gv('f_previewFonte');
  var previewResumo = _gv('f_previewResumo');
  var data = {
    titulo: _gv('f_titulo'), desc: _gv('f_desc'),
    tipo: _gv('f_tipo'), url: _gv('f_url'),
    ordem: parseInt(_gv('f_ordem'))||0,
    publicada: _gb('f_publicada'),
    criadoEm: Date.now()
  };
  if (previewImg||previewFonte||previewResumo) {
    data.preview = { img: previewImg, fonte: previewFonte, resumo: previewResumo };
  }
  // Gera ID automático
  var newRef = db.collection('cursos').doc('g20-masterclass')
    .collection('modulos').doc(moduloId).collection('aulas').doc();
  data.id = newRef.id;
  newRef.set(data).then(function() {
    if (!AULAS[moduloId]) AULAS[moduloId] = [];
    AULAS[moduloId].push(data);
    AULAS[moduloId].sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); });
    renderSidebar();
    renderModuloView(moduloId, AULAS[moduloId]);
    admClose(); toast('✅ Aula criada!');
    btn.textContent='💾 Salvar'; btn.disabled=false;
  }).catch(function(e){ alert('Erro: '+e.message); btn.textContent='💾 Salvar'; btn.disabled=false; });
}

function _saveEditAula(btn) {
  var moduloId = _admCtx.moduloId;
  var aulaId = _admCtx.aulaId;
  var previewImg = _gv('f_previewImg');
  var previewFonte = _gv('f_previewFonte');
  var previewResumo = _gv('f_previewResumo');
  var data = {
    titulo: _gv('f_titulo'), desc: _gv('f_desc'),
    tipo: _gv('f_tipo'), url: _gv('f_url'),
    ordem: parseInt(_gv('f_ordem'))||0,
    publicada: _gb('f_publicada')
  };
  if (previewImg||previewFonte||previewResumo) {
    data.preview = { img: previewImg, fonte: previewFonte, resumo: previewResumo };
  }
  db.collection('cursos').doc('g20-masterclass')
    .collection('modulos').doc(moduloId)
    .collection('aulas').doc(aulaId).update(data)
    .then(function() {
      var arr = AULAS[moduloId]||[];
      var idx = arr.findIndex(function(a){ return a.id===aulaId; });
      if (idx>=0) Object.assign(arr[idx], data);
      renderModuloView(moduloId, arr);
      admClose(); toast('✅ Aula salva!');
      btn.textContent='💾 Salvar'; btn.disabled=false;
    }).catch(function(e){ alert('Erro: '+e.message); btn.textContent='💾 Salvar'; btn.disabled=false; });
}

function admDelete() {
  if (_modoModal !== 'editAula') return;
  var moduloId = _admCtx.moduloId;
  var aulaId = _admCtx.aulaId;
  if (!confirm('Excluir esta aula? Não pode desfazer.')) return;
  deleteAula(moduloId, aulaId);
  admClose();
}

function deleteAula(moduloId, aulaId) {
  if (!confirm('Excluir aula #' + aulaId + '?')) return;
  db.collection('cursos').doc('g20-masterclass')
    .collection('modulos').doc(moduloId)
    .collection('aulas').doc(aulaId).delete()
    .then(function() {
      AULAS[moduloId] = (AULAS[moduloId]||[]).filter(function(a){ return a.id!==aulaId; });
      renderModuloView(moduloId, AULAS[moduloId]);
      renderSidebar(); toast('🗑 Aula excluída.');
    }).catch(function(e){ alert('Erro: '+e.message); });
}

function deleteModulo(moduloId) {
  var aulas = AULAS[moduloId]||[];
  if (!confirm('Excluir módulo "' + moduloId + '" e suas ' + aulas.length + ' aulas? IRREVERSÍVEL.')) return;
  // Deleta aulas primeiro
  var promises = aulas.map(function(a) {
    return db.collection('cursos').doc('g20-masterclass')
      .collection('modulos').doc(moduloId)
      .collection('aulas').doc(a.id).delete();
  });
  Promise.all(promises).then(function() {
    return db.collection('cursos').doc('g20-masterclass')
      .collection('modulos').doc(moduloId).delete();
  }).then(function() {
    MODULOS = MODULOS.filter(function(m){ return m.id!==moduloId; });
    delete AULAS[moduloId];
    _activeModuloId = null;
    renderSidebar();
    document.getElementById('admMain').innerHTML = '<div class="adm-empty-state"><div class="adm-empty-state-icon">📚</div><div class="adm-empty-state-title">Módulo excluído</div></div>';
    toast('🗑 Módulo excluído.');
  }).catch(function(e){ alert('Erro: '+e.message); });
}

function showMigratePanel() {
  _modoModal = '';
  document.getElementById('admModalTitle').textContent = '🔄 Migrar dados hardcoded → Firestore';
  document.getElementById('admBtnDelete').style.display = 'none';
  document.getElementById('admModalBody').innerHTML =
    '<div class="adm-migrate-panel">' +
    '<div class="adm-migrate-title">⚠️ Operação única</div>' +
    '<div class="adm-migrate-desc">Esta migração vai popular o Firestore com os dados da estrutura atual (5 módulos, 30 aulas). Se já existirem dados no Firestore, eles serão preservados (merge). Você só precisa fazer isso UMA VEZ.</div>' +
    '<div id="admMigrateLog" class="adm-migrate-log"></div>' +
    '</div>';
  document.getElementById('admBtnSave').textContent = '🔄 Executar migração';
  document.getElementById('admBtnSave').onclick = executeMigration;
  document.getElementById('admModal').classList.add('open');
}

function executeMigration() {
  var btn = document.getElementById('admBtnSave');
  btn.textContent = '⏳'; btn.disabled = true;
  var log = document.getElementById('admMigrateLog');
  log.style.display = 'block';
  log.textContent = '[START] Iniciando migração...\n';

  var total = SA_MODULOS_DATA.length;
  var done = 0;

  function logLine(msg) { log.textContent += msg + '\n'; log.scrollTop = log.scrollHeight; }

  var promises = SA_MODULOS_DATA.map(function(mod) {
    var aulasList = mod.aulas;
    var modData = {};
    Object.keys(mod).forEach(function(k){ if(k!=='aulas') modData[k]=mod[k]; });

    return db.collection('cursos').doc('g20-masterclass')
      .collection('modulos').doc(mod.id)
      .set(modData, { merge: true })
      .then(function() {
        logLine('[OK] Módulo: ' + mod.tag + ' (' + mod.id + ')');
        var aulasPromises = aulasList.map(function(aula) {
          return db.collection('cursos').doc('g20-masterclass')
            .collection('modulos').doc(mod.id)
            .collection('aulas').doc(aula.id)
            .set(aula, { merge: true })
            .then(function(){ logLine('     ✓ Aula: ' + aula.titulo.substring(0,40)); })
            .catch(function(e){ logLine('     ✗ ERRO aula ' + aula.id + ': ' + e.message); });
        });
        return Promise.all(aulasPromises);
      })
      .then(function(){ done++; if(done===total) { logLine('\n[DONE] Migração concluída! ' + total + ' módulos populados.'); btn.textContent='✅ Concluído'; btn.disabled=false; btn.onclick=function(){ admClose(); document.getElementById('admBtnSave').textContent='💾 Salvar'; document.getElementById('admBtnSave').onclick=admSave; }; loadModulos(); } })
      .catch(function(e){ logLine('[ERRO] ' + mod.id + ': ' + e.message); });
  });

  Promise.all(promises).catch(function(e){ logLine('[ERRO GERAL] ' + e.message); });
}

// ─── HELPERS ───
function _esc(s) {
  return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toast(msg) {
  var t = document.getElementById('admToast');
  t.textContent = msg; t.style.opacity = '1';
  setTimeout(function(){ t.style.opacity = '0'; }, 2500);
}

function setStatus(msg, ok) {
  document.getElementById('statusText').textContent = msg;
  document.getElementById('statusDot').style.background = ok ? 'var(--green)' : '#e63946';
}


// ─── IMAGE PREVIEW ───
function admImgPreviewData(input) {
  var previewId = input.getAttribute('data-previd');
  admImgPreview(input, previewId);
}
function admImgPreview(input, previewId) {
  var url = input.value.trim();
  var img = document.getElementById(previewId);
  var err = document.getElementById(previewId + '_err');
  if (!img) return;
  if (!url) {
    img.classList.remove('visible');
    if (err) err.classList.remove('visible');
    return;
  }
  img.src = url;
  img.classList.add('visible');
  if (err) err.classList.remove('visible');
}


function admImgErrData(img) {
  var errId = img.getAttribute('data-errid');
  admImgError(img, errId);
}
function admImgOkData(img) {
  var errId = img.getAttribute('data-errid');
  admImgOk(img, errId);
}

function admImgError(img, errId) {
  img.classList.remove('visible');
  var err = document.getElementById(errId);
  if (err) err.classList.add('visible');
}

function admImgOk(img, errId) {
  img.classList.add('visible');
  var err = document.getElementById(errId);
  if (err) err.classList.remove('visible');
}

function admSuggestPath() {
  var aulaId = (_admCtx.aulaId || 'nova-aula');
  var path = 'https://iorb07-ica.github.io/plataforma-g20/assets/aulas/' + aulaId + '.jpg';
  var input = document.getElementById('f_previewImg');
  if (input) {
    input.value = path;
    admImgPreview(input, 'prev_aula');
  }
}
