<style>
a{text-decoration:none;color:inherit}
button{font-family:inherit}
:root{
  --bg:#1a191e; --bg-2:#1a191e; --surface:#27252c; --surface-2:#2d2a33;
  --gold:#c9a961; --gold-light:#e8c766; --gold-deep:#a08543; --gold-dim:#6e5f3a; --shield:#5b7aa6;
  --text:#f0ece0; --text-2:#8b8499; --text-3:#6b6578;
  --border:#3a3740; --border-gold:rgba(201,169,97,.35);
  --topbar:64px; --sidebar:200px;
  --sans:'DM Sans', system-ui, sans-serif; --mono:'JetBrains Mono', monospace;
}
body.light{
  --bg:#f6f3ec; --bg-2:#f6f3ec; --surface:#ffffff; --surface-2:#f1ece1;
  --gold:#a8873f; --gold-light:#8c6d28; --gold-dim:#d9c89c; --shield:#4f74a8;
  --text:#2a2620; --text-2:#6e675c; --text-3:#9a9286; --border:#e3dccd; --border-gold:rgba(168,135,63,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
.sidebar .nav-section{padding:10px 0 !important}
.sidebar .nav-item{color:#fff !important}
.sidebar .nav-item.active{color:var(--gold) !important}
.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .2s ease}
body.sidebar-collapsed .main{margin-left:68px}
.topbar{background:rgba(26,25,30,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:var(--topbar);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.topbar-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.btn-menu{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer}
.page-title{font-size:18px;font-weight:600;letter-spacing:.3px}
.btn-icon{background:transparent;border:1px solid var(--border);color:var(--text-2);width:38px;height:38px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.btn-icon i{width:18px;height:18px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99}
.overlay.show{display:block}

/* ═══ PAINEL DE EVOLUÇÃO ═══ */
.ev-wrap{width:100%;max-width:1600px;margin:0 auto;padding:22px 28px 40px}
.ev-teste{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--border-gold);border-radius:14px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--text-2)}
.ev-teste b{color:var(--gold-light);font-weight:600}
.ev-teste select,.ev-teste button{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:13px;max-width:100%}
.ev-teste button{cursor:pointer}
.ev-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;grid-auto-flow:row dense}
.ev-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;box-shadow:0 24px 48px rgba(0,0,0,.35);min-width:0}
body.light .ev-card{box-shadow:0 10px 30px rgba(60,45,10,.08)}
.ev-span2{grid-column:span 2}.ev-span3,.ev-full{grid-column:1/-1}
.ev-ano-card{display:flex;flex-direction:column}
.ev-ano-card .ev-ano{flex:1 1 auto;min-height:120px;height:auto}
.ev-ano i{max-width:44px}
.ev-lbl{font-size:12px;color:var(--text-2);letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.ev-num{font-family:var(--mono);color:var(--gold-light);font-weight:500}
.ev-sub{font-size:13px;color:var(--text-2);margin-top:4px;line-height:1.45}
.ev-frase{font-style:italic;color:var(--gold);font-size:14px;margin-top:10px;line-height:1.45}
.ev-ok{color:#7cc29a}
.ev-aberto{color:var(--gold-light)}

.ev-hero{text-align:center;padding:26px 20px;display:flex;flex-direction:column;justify-content:center}
.ev-hero .ev-num{font-size:52px;line-height:1.05;margin:6px 0 2px}
.ev-hero .ev-status{font-size:13px;margin-top:10px}

.ev-estudo{display:flex;align-items:center;gap:18px}
.ev-ring{position:relative;width:104px;height:104px;flex:0 0 104px}
.ev-ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ev-ring .ev-ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ev-ring .ev-num{font-size:30px;line-height:1}
.ev-ring .ev-fogo{font-size:18px;line-height:1}
.ev-estudo h3{font-size:17px;font-weight:600}
.ev-escudos{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle}

.ev-mini{display:flex;flex-direction:column;gap:2px}
.ev-mini .ev-num{font-size:26px;margin-top:6px}
.ev-mini .ev-un{font-size:14px;color:var(--text-2);margin-left:4px;font-family:var(--sans)}
.ev-minis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.ev-ofs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ev-of{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ev-of.ok{border-color:var(--border-gold)}
.ev-of .ev-lbl{font-size:12px}
.ev-of .ev-num{font-size:28px;line-height:1.1}
.ev-of .ev-un{font-size:14px;color:var(--text-2);margin-left:4px;font-family:var(--sans)}
.ev-of .ev-st{font-size:12px;margin-top:2px}
.ev-of .ev-rec{font-size:11px;color:var(--text-3)}
.ev-col3{grid-column:span 3}
.ev-minis.ev-tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.ev-totais.ev-largo{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ev-pilares{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.ev-pil{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:9px 10px;font-size:13px;border:1px solid transparent}
.ev-pil.ok{border-color:var(--border-gold)}
.ev-pil b{font-weight:600;color:var(--gold-light);margin-left:auto;font-size:14px}
.ev-pil.no b{color:var(--text-3)}
.ev-cal .ev-d{position:relative}
.ev-cal .ev-d.p::after{content:'';position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#7cc29a}

.ev-totais{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ev-tot{background:var(--surface-2);border-radius:12px;padding:12px}
.ev-tot .ev-num{font-size:20px}

.ev-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ev-cal-head h3{font-size:15px;font-weight:600}
.ev-cal-nav{display:flex;gap:6px}
.ev-cal-nav button{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:16px}
.ev-cal-nav button:disabled{opacity:.35;cursor:default}
.ev-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ev-cal .ev-wd{font-size:11px;color:var(--text-3);text-align:center}
.ev-cal .ev-d{aspect-ratio:1;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-3);font-family:var(--mono)}
.ev-cal .ev-d.e{background:var(--gold);color:#1a191e;font-weight:600}
.ev-cal .ev-d.c{background:var(--gold-dim);color:var(--text)}
.ev-cal .ev-d.s{background:var(--shield);color:#fff}
.ev-cal .ev-d.h{outline:2px solid var(--gold-light);outline-offset:1px}
.ev-cal .ev-d.x{background:transparent}
.ev-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:12px}
.ev-leg span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.ev-ano{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:120px;margin-top:6px}
.ev-ano div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.ev-ano i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--gold);min-height:3px}
.ev-ano i.z{background:var(--border)}
.ev-ano small{font-size:10px;color:var(--text-3)}

.ev-meds{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px}
.ev-med{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;background:none;border:none;color:inherit;padding:0}
.ev-med .ev-art{width:72px;height:72px;border-radius:14px;background:#000;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;transition:transform .2s}
.ev-med .ev-art img{width:100%;height:100%;object-fit:cover}
.ev-med:hover .ev-art{transform:translateY(-2px)}
.ev-med.off .ev-art{border-color:var(--border);filter:grayscale(1);opacity:.45}
.ev-med small{font-size:11px;color:var(--text-2);line-height:1.25}
.ev-med-det{margin-top:12px;font-size:13px;color:var(--text-2);min-height:18px}
.ev-med-det b{color:var(--text)}

.ev-barra{height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.ev-barra i{display:block;height:100%;background:var(--gold);border-radius:5px}
.ev-vazio{text-align:center;padding:40px 20px;color:var(--text-2);line-height:1.6}
.ev-vazio b{color:var(--gold-light);font-size:18px;display:block;margin-bottom:6px}
.ev-rodape{font-size:12px;color:var(--text-3);text-align:center;margin-top:18px;line-height:1.5}

@media (min-width:901px){
  .ev-cal{gap:5px}
  .ev-cal .ev-d{aspect-ratio:auto;height:34px}
}
@media (max-width:1199px){
  .ev-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ev-col3{grid-column:1/-1}
  .ev-ano-card{grid-column:1/-1}
}
@media (max-width:1399px){ .ev-minis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:640px){
  .ev-minis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ev-minis.ev-tres{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .ev-minis.ev-tres .ev-card{padding:12px 10px}
  .ev-minis.ev-tres .ev-num{font-size:20px}
  .ev-minis.ev-tres .ev-sub{font-size:11px}
  .ev-ofs{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ev-of{padding:11px 12px;border-radius:14px}
  .ev-of .ev-num{font-size:24px}
}
@media (max-width:900px){
  .ev-grid{grid-template-columns:minmax(0,1fr)}
  .ev-span2,.ev-span3,.ev-col3{grid-column:auto}
  .ev-ano-card{display:none}
}
@media (max-width:768px){
  .main{margin-left:0 !important}
  .btn-menu{display:block}
  .topbar{padding:0 14px}
  .ev-wrap{padding:14px 12px 28px}
  .ev-grid{gap:12px}
  .ev-card{padding:16px;border-radius:16px}
  .ev-hero{padding:20px 14px}
  .ev-hero .ev-num{font-size:44px}
  .ev-minis{gap:12px}
  .ev-mini .ev-num{font-size:24px}
  .ev-ring,.ev-ring svg{width:92px;height:92px;flex-basis:92px}
  .ev-ring .ev-num{font-size:26px}
  .ev-meds{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .ev-med .ev-art{width:62px;height:62px;font-size:26px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>

}
</style>
<style id="ev-topo-mobile">
@media (max-width: 820px) {
  html body .topbar .topbar-right { gap: 6px !important; flex-shrink: 0 !important; }
  html body .topbar .topbar-right > .btn-gsearch, html body .topbar .topbar-right > #g20FeedbackBtn, html body .topbar .topbar-right > .btn-icon { width: 38px !important; height: 38px !important; min-width: 38px !important; }
  html body .topbar .topbar-right > #g20ThemeSwitch { display: none !important; }
  html body .topbar .topbar-left { min-width: 0 !important; overflow: hidden !important; flex: 1 1 0 !important; }
  html, body { overflow-x: clip !important; }
}
</style>

<script>
window._g20PreloadSidebar = function(){
  try {
    var cached = JSON.parse(localStorage.getItem('g20_user_profile') || '{}');
    if (cached && cached.name) {
      var ini = cached.name.split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase()||'G20';
      var nameEl=document.getElementById('sidebarName');
      var turmaEl=document.getElementById('sidebarTurma');
      var initEl=document.getElementById('sidebarInitials');
      var avEl=document.getElementById('sidebarAvatar');
      if(nameEl) nameEl.innerHTML='<span class="user-name-text">'+cached.name+'</span>'+(cached.infinite?'<span class="badge-infinity">∞ Infinity</span>':'');
      if(turmaEl) turmaEl.textContent=cached.role==='admin'?'Admin':(cached.turma||'');
      if(initEl) initEl.textContent=ini;
      if(avEl&&cached.photo) avEl.innerHTML='<img src="'+cached.photo+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.remove()">';
    }
  } catch(e) {}
};
document.addEventListener('DOMContentLoaded', function(){
  if(typeof _g20PreloadSidebar==='function') _g20PreloadSidebar();
});
</script>

    var itens = [['aula','🎓','Aula'],['cast','🎧','G20Cast'],['leitura','📚','Leitura'],['controle','🧾','Finanças']];
    itens.forEach(function(x){ if (!pl[x[0]]) falta.push(x[2]); });
    var txt = P360.feita ? '<span class="ev-ok">Semana 360° fechada.</span> Estudou, ouviu, leu e controlou.'
      : 'Falta ' + falta.join(', ').replace(/, ([^,]*)$/, ' e $1') + ' para fechar a semana.';
    return '<div class="ev-lbl">🌀 Semana 360°</div>' +
      '<div style="margin-top:6px"><span class="ev-num" style="font-size:24px">' + P360.atual + '</span> <span class="ev-sub">' + (P360.atual === 1 ? 'semana seguida' : 'semanas seguidas') + ' · recorde ' + P360.recorde + '</span></div>' +
      '<div class="ev-pilares">' + itens.map(function(x){ var ok = !!pl[x[0]]; return '<div class="ev-pil ' + (ok ? 'ok' : 'no') + '">' + x[1] + ' ' + x[2] + '<b>' + (ok ? '✓' : '○') + '</b></div>'; }).join('') + '</div>' +
      '<div class="ev-sub" style="margin-top:10px">' + txt + '</div>';
  }
  function mini(ico, nome, n, un, sub){
    return '<div class="ev-card ev-mini"><div class="ev-lbl">' + ico + ' ' + esc(nome) + '</div><div><span class="ev-num">' + n + '</span><span class="ev-un">' + esc(un) + '</span></div><div class="ev-sub">' + esc(sub) + '</div></div>';
  }
  function tot(n, lbl, sub){ return '<div class="ev-tot"><div class="ev-num">' + n + '</div><div class="ev-sub" style="margin-top:2px">' + esc(lbl) + (sub ? '<br><span style="font-size:11px">' + esc(sub) + '</span>' : '') + '</div></div>'; }

  function renderCal(){
    var card = el('evCalCard'); if (!card) return;
    var ano = +mesCal.slice(0,4), mm = +mesCal.slice(5,7);
    var n = new Date(Date.UTC(ano, mm, 0)).getUTCDate(), dow = (new Date(Date.UTC(ano, mm - 1, 1)).getUTCDay() + 6) % 7;
    var limite = hoje.slice(0,7); for (var k = 0; k < 12; k++) limite = mesAnt(limite);
    var h = '<div class="ev-cal-head"><h3>' + esc(cap(nomeMes(mesCal))) + '</h3><div class="ev-cal-nav">' +
      '<button type="button" id="evCalAnt" aria-label="Mês anterior"' + (mesCal <= limite ? ' disabled' : '') + '>‹</button>' +
      '<button type="button" id="evCalSeg" aria-label="Próximo mês"' + (mesCal >= hoje.slice(0,7) ? ' disabled' : '') + '>›</button></div></div><div class="ev-cal">';
    ['S','T','Q','Q','S','S','D'].forEach(function(w){ h += '<div class="ev-wd">' + w + '</div>'; });
    for (var x = 0; x < dow; x++) h += '<div class="ev-d x"></div>';
    var estudados = 0;
    for (var d = 1; d <= n; d++) {
      var dia = mesCal + '-' + String(d).padStart(2,'0'), v = dias[dia] || 0, cls = 'ev-d';
      if (v & B_ESTUDO) { cls += ' e'; estudados++; } else if (v & B_ESCUDO) cls += ' s'; else if (v & (B_CONTROLE | B_LEITURA)) cls += ' c';
      if (dias2[dia] & (C_COMENT | C_AJUDA)) cls += ' p';
      if (dia === hoje) cls += ' h';
      h += '<div class="' + cls + '" title="' + dia.split('-').reverse().join('/') + '">' + d + '</div>';
    }
    h += '</div><div class="ev-leg"><span style="--c:var(--gold)">estudou</span><span style="--c:var(--gold-dim)">só controle ou leitura</span><span style="--c:var(--shield)">escudo</span><span style="--c:#7cc29a">participou</span></div>' +
         '<div class="ev-sub" style="margin-top:8px">' + plural(estudados, 'dia de estudo', 'dias de estudo') + ' neste mês</div>';
    card.innerHTML = h;
    el('evCalAnt').onclick = function(){ mesCal = mesAnt(mesCal); renderCal(); };
    el('evCalSeg').onclick = function(){ mesCal = mesSeg(mesCal); renderCal(); };
  }
  function anoHtml(){
    var m = hoje.slice(0,7), meses = [];
    for (var i = 0; i < 12; i++) { meses.unshift(m); m = mesAnt(m); }
    var cont = meses.map(function(mm){ return Object.keys(dias).filter(function(d){ return d.slice(0,7) === mm && (dias[d] & B_ESTUDO); }).length; });
    var max = Math.max.apply(null, cont.concat([1]));
    return '<div class="ev-lbl">Dias de estudo nos últimos 12 meses</div><div class="ev-ano">' + meses.map(function(mm, i){
      return '<div title="' + cont[i] + ' dias"><i class="' + (cont[i] ? '' : 'z') + '" style="height:' + Math.max(3, Math.round(cont[i] / max * 90)) + 'px"></i><small>' + MES_C[+mm.slice(5,7) - 1] + '</small></div>';
    }).join('') + '</div>';
  }
  function renderMeds(){
    var card = el('evMedCard'); if (!card) return;
    var lista = CQ.map(function(q){ var ok = false; try { ok = !!q.ok(C, E); } catch(e){} return { q: q, ok: ok }; });
    var feitas = lista.filter(function(x){ return x.ok; }).length;
    lista.sort(function(a, b){ return (b.ok ? 1 : 0) - (a.ok ? 1 : 0); });
    card.innerHTML = '<div class="ev-lbl" style="margin-bottom:12px">🏅 Conquistas · ' + feitas + ' de ' + CQ.length + '</div><div class="ev-meds">' +
      lista.map(function(x, i){
        var art = x.q.img ? '<img src="' + BADGE + x.q.img + '" alt="" loading="lazy">' : x.q.emoji;
        return '<button type="button" class="ev-med' + (x.ok ? '' : ' off') + '" data-i="' + i + '"><span class="ev-art">' + (x.ok ? art : '🔒') + '</span><small>' + esc(x.q.nome) + '</small></button>';
      }).join('') + '</div><div class="ev-med-det" id="evMedDet">Toque numa medalha para ver como conquistar.</div>';
    Array.prototype.forEach.call(card.querySelectorAll('.ev-med'), function(b){
      b.onclick = function(){ var x = lista[+b.getAttribute('data-i')]; el('evMedDet').innerHTML = '<b>' + esc(x.q.nome) + '</b> · ' + (x.ok ? '<span class="ev-ok">conquistada</span>' : esc(x.q.dica)); };
    });
  }
  function turmaHtml(){
    var nome = C.turma || 'Sua turma';
    if (!TURMA) return '<div class="ev-lbl">👥 ' + esc(nome) + '</div><div class="ev-sub" style="margin-top:8px">Os números da turma aparecem depois do cálculo das 19h.</div>';
    var h = '<div class="ev-lbl">👥 ' + esc(TURMA.nome || nome) + ' esta semana</div>' +
      '<div style="margin-top:8px"><span class="ev-num" style="font-size:24px">' + (TURMA.aulas7 || 0) + '</span> <span class="ev-sub">aulas concluídas</span></div>' +
      '<div class="ev-sub">' + (TURMA.ativos7 || 0) + ' de ' + (TURMA.alunos || 0) + ' alunos estudaram nos últimos 7 dias</div>' +
      (TURMA.ouvintes7 != null ? '<div class="ev-sub">🎧 ' + TURMA.ouvintes7 + ' ouviram o G20Cast · 💬 ' + (TURMA.participantes7 || 0) + ' participaram das aulas</div>' : '') +
      '<div class="ev-barra"><i style="width:' + (TURMA.alunos ? Math.round(TURMA.ativos7 / TURMA.alunos * 100) : 0) + '%"></i></div>';
    if (Array.isArray(TURMA.seq) && TURMA.seq.length >= 10 && E.atual > 0) {
      var maiores = TURMA.seq.filter(function(v){ return v > E.atual; }).length;
      var top = Math.max(1, Math.ceil((maiores + 1) / TURMA.seq.length * 100));
      h += '<div class="ev-sub ev-aberto" style="margin-top:10px">' + (top <= 50 ? 'Você está entre os ' + top + '% mais constantes da turma.' : 'Cada dia de estudo te leva mais para cima na turma.') + '</div>';
    }
    return h;
  }
  function fraseHtml(){
    try { var f = window.getFraseDoDia && window.getFraseDoDia(); if (!f) return '';
      return '<div class="ev-card" style="margin-top:16px;text-align:center"><div class="ev-frase" style="margin-top:0">“' + esc(f.texto) + '”</div><div class="ev-sub">' + esc(f.autor || '') + '</div></div>';
    } catch(e){ return ''; }
  }

  /* ── zona de teste: escolher aluno ── */
  function montarTeste(){
    var sel = el('evAlunos'), btn = el('evCarregarAlunos');
    btn.onclick = function(){
      btn.disabled = true; btn.textContent = 'Carregando alunos…';
      db.collection('users').where('aprovado', '==', true).get().then(function(s){
        var arr = [];
        s.forEach(function(d){ var u = d.data() || {}, pf = u.perfil || {}; arr.push({ uid: d.id, nome: pf.nome || u.name || u.nome || u.email || d.id, turma: u.turma || '' }); });
        arr.sort(function(x, y){ return String(x.nome).localeCompare(String(y.nome), 'pt-BR'); });
        sel.innerHTML = '<option value="">Escolha um aluno…</option><option value="' + esc(EU) + '">Eu (admin)</option>' +
          arr.map(function(x){ return '<option value="' + esc(x.uid) + '"' + (x.uid === ALVO ? ' selected' : '') + '>' + esc(x.nome) + (x.turma ? ' · ' + esc(x.turma) : '') + '</option>'; }).join('');
        sel.style.display = ''; btn.style.display = 'none';
      }).catch(function(){ btn.disabled = false; btn.textContent = 'Tentar de novo'; });
    };
    sel.onchange = function(){
      if (!sel.value) return;
      location.href = 'evolucao.html' + (sel.value === EU ? '' : '?ver=' + encodeURIComponent(sel.value));
    };
  }

  firebase.auth().onAuthStateChanged(function(u){
    if (!u) return;
    EU = u.uid;
    var m = (location.search || '').match(/[?&]ver=([A-Za-z0-9_-]{6,64})/);
    var alvo = m ? m[1] : u.uid;
    montarTeste();
    if (alvo !== u.uid) {
      el('evQuem').innerHTML = 'Vendo como aluno (somente leitura) · <a href="evolucao.html" style="color:var(--gold-light);text-decoration:underline">voltar para mim</a>';
      db.collection('users').doc(alvo).get().then(function(d){
        var x = d.data() || {}, pf = x.perfil || {};
        el('evQuem').innerHTML = 'Vendo como <b>' + esc(pf.nome || x.name || x.nome || alvo) + '</b> (somente leitura) · <a href="evolucao.html" style="color:var(--gold-light);text-decoration:underline">voltar para mim</a>';
      }).catch(function(){});
    }
    carregar(alvo);
  });
})();
</script>
</body>
