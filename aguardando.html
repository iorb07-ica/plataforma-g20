<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090b0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="G20">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b0f">
<title>Aguardando Aprovação — G20 Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b0f;--bg2:#0f1117;--surface:#1c2030;--border:rgba(255,255,255,0.08);--gold:#e8b84b;--goldd:#c8943a;--red:#e63946;--green:#2ecc71;--text:#f4f6fa;--text2:#b0bac8;--text3:#6b7a94}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:22px;padding:56px 52px;max-width:560px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.icon{font-size:80px;margin-bottom:24px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:2.5px;color:var(--gold);margin-bottom:12px;line-height:1.05}
.desc{font-size:17px;color:var(--text2);line-height:1.7;margin-bottom:32px}
@media(max-width:520px){.card{padding:40px 26px}.icon{font-size:64px}.title{font-size:36px}.desc{font-size:15px}}
.email-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--gold);margin-bottom:28px;word-break:break-all}
.steps{text-align:left;margin-bottom:28px}
.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step-num{width:24px;height:24px;border-radius:50%;background:rgba(232,184,75,.15);border:1px solid rgba(232,184,75,.3);color:var(--gold);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-txt{font-size:13px;color:var(--text2);line-height:1.5}
.step-txt strong{color:var(--text)}
.btn-logout{width:100%;padding:12px;border-radius:10px;background:transparent;border:1px solid var(--border);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}
.status-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.3);color:var(--gold);font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:24px;letter-spacing:.5px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="card">
  <div class="icon">⏳</div>
  <div class="status-badge"><span class="pulse"></span> AGUARDANDO APROVAÇÃO</div>
  <div class="title">Conta criada!</div>
  <div class="desc">Sua conta foi criada com sucesso. Agora é só aguardar a aprovação do Israel para ter acesso à plataforma.</div>
  <div class="email-box" id="userEmail">—</div>
  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-txt">✅ Conta criada com <strong>sucesso</strong></div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-txt">⏳ Israel <strong>aprova seu acesso</strong> (geralmente em até 24h)</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-txt">🚀 Você recebe <strong>acesso completo</strong> à plataforma G20 Masterclass</div>
    </div>
  </div>
  <button class="btn-logout" onclick="sair()">🚪 Sair e usar outra conta</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",
  authDomain:"g20-masterclass.firebaseapp.com",
  projectId:"g20-masterclass",
  storageBucket:"g20-masterclass.firebasestorage.app",
  messagingSenderId:"1052719482127",
  appId:"1:1052719482127:web:537c1d67c96532be8a2a7a"
});
const auth = firebase.auth();
const db = firebase.firestore();

var _user = null;
var _pollTimer = null;
var _pollStarted = false;
var _liberado = false;
var _waitingUid = null;

auth.onAuthStateChanged(function(user) {
  if (!user) { window.location.href = 'login.html'; return; }
  // Trava de sessão: esta tela espera por UM aluno específico. Se a sessão mudar pra
  // outra conta (ex: admin logado em outra aba DO MESMO navegador), NÃO entra com a
  // conta errada — volta pro login. Em produção cada aluno usa seu próprio navegador,
  // então isso só protege o cenário de teste.
  if (_waitingUid && user.uid !== _waitingUid) {
    window.location.href = 'login.html';
    return;
  }
  _waitingUid = user.uid;
  _user = user;
  document.getElementById('userEmail').textContent = user.email;
  iniciarPoll();
});

// ── Polling de liberação ──────────────────────────────────────
// Checa a aprovação direto no SERVIDOR (não no cache) e, assim que o Israel aprovar,
// mostra a tela de "Acesso Liberado" — o aluno entra clicando no botão.
function iniciarPoll() {
  verificarAprovacao();                       // checa já na hora
  if (_pollStarted) return;                   // só monta o intervalo uma vez
  _pollStarted = true;
  _pollTimer = setInterval(function(){
    if (document.visibilityState === 'visible') verificarAprovacao();
  }, 5000);                                   // a cada 5s (só com a aba visível)
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') verificarAprovacao(); // volta pra aba = checa
  });
}

async function verificarAprovacao() {
  if (!_user || _liberado) return;
  try {
    var doc = await db.collection('users').doc(_user.uid).get({ source: 'server' });
    if (!doc.exists) return;
    var data = doc.data();
    if (data.aprovado === true || data.role === 'admin') {
      _liberado = true;
      if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
      try { localStorage.setItem('g20_uid', _user.uid); } catch(e){}
      mostrarLiberado();  // NÃO redireciona sozinho — o aluno clica pra entrar
    }
  } catch (e) { console.warn('poll aprovacao:', e); }
}

// Tela de celebração — fica na tela com um botão pro aluno entrar empolgado
function mostrarLiberado() {
  var card = document.querySelector('.card');
  if (!card) { entrarPlataforma(); return; }
  card.innerHTML =
    '<div class="icon" style="animation:pop .6s cubic-bezier(.2,.9,.3,1.4) both">🎉</div>' +
    '<div class="status-badge" style="color:var(--green);border-color:rgba(46,204,113,.4);background:rgba(46,204,113,.12)"><span class="pulse" style="background:var(--green)"></span> ACESSO LIBERADO</div>' +
    '<div class="title" style="color:var(--green)">Bem-vindo(a) ao G20!</div>' +
    '<div class="desc">Sua conta foi <strong style="color:var(--text)">aprovada</strong>! 🚀<br>A partir de agora, você tem acesso completo: carteira de investimentos G20, área exclusiva para controlar suas despesas e receitas, aulas, G20Cast, comunidade e muito mais. Bora começar sua jornada?</div>' +
    '<button onclick="entrarPlataforma()" style="width:100%;padding:18px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--goldd));border:none;color:#0d0c10;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.5px;box-shadow:0 12px 32px rgba(232,184,75,.35);transition:transform .15s,box-shadow .15s" onmouseover="this.style.transform=&quot;translateY(-2px)&quot;;this.style.boxShadow=&quot;0 16px 40px rgba(232,184,75,.45)&quot;" onmouseout="this.style.transform=&quot;&quot;;this.style.boxShadow=&quot;0 12px 32px rgba(232,184,75,.35)&quot;">🚀 Acessar Plataforma G20</button>';
}

function entrarPlataforma() {
  try { if (_user) localStorage.setItem('g20_uid', _user.uid); } catch(e){}
  window.location.href = 'dashboard.html';
}

function sair() {
  if (_pollTimer) clearInterval(_pollTimer);
  auth.signOut().then(function(){ window.location.href = 'login.html'; });
}
</script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js')
          .then(function(reg) { console.log('SW registrado:', reg.scope); })
          .catch(function(e) { console.warn('SW erro:', e); });
      });
    }
  </script>
</body>
</html>
