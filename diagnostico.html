<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico G20</title>
<style>
body{background:#1a191e;color:#e8e6e3;font-family:Arial,sans-serif;padding:24px;margin:0}
h1{color:#e8c766;font-size:22px}
.item{padding:10px 14px;margin:6px 0;border-radius:8px;background:#27252c;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.ok{border-left:5px solid #4caf50}
.fail{border-left:5px solid #f44336;background:#3a2326}
.wait{border-left:5px solid #e8c766}
.tag{font-weight:bold;font-size:13px}
.ok .tag{color:#4caf50}.fail .tag{color:#f44336}.wait .tag{color:#e8c766}
#resumo{margin-top:18px;padding:16px;border-radius:10px;background:#2d2a33;font-size:15px;line-height:1.5}
.sec{color:#9a958e;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:18px 0 4px}
</style>
</head>
<body>
<h1>🔍 Diagnóstico Plataforma G20</h1>
<p style="color:#9a958e">Testando cada recurso que o Game e o Atlas usam. Aguarde até o fim (~20s).</p>
<div id="lista"></div>
<div id="resumo">⏳ Rodando testes...</div>

<script>
(function(){
  var lista = document.getElementById('lista');
  var resumo = document.getElementById('resumo');
  var falhas = [], lentos = [], pend = 0;

  var grupos = [
    {nome:'CSS locais', itens:[
      'assets/g20-topbar.css?v=10','assets/g20-sidebar.css?v=10',
      'assets/g20-scrollbar.css?v=10','assets/g20-topbar-v21.css?v=13','assets/g20-search.css?v=10'
    ]},
    {nome:'Scripts locais (assets)', itens:[
      'assets/tradingview-logos.js','assets/g20-notifications.js?v=10',
      'assets/g20-sidebar.js?v=11','assets/g20-search.js?v=10','assets/market-hours.js?v=1'
    ]},
    {nome:'Scripts externos', itens:[
      'https://unpkg.com/lucide@latest/dist/umd/lucide.min.js',
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js',
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js',
      'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
      'https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap'
    ]},
    {nome:'Páginas', itens:['game-g20.html','atlas.html','dashboard.html']}
  ];

  function addItem(url, cls, tag, extra){
    var d = document.createElement('div');
    d.className = 'item ' + cls;
    var nome = url.replace('https://','').slice(0,60);
    d.innerHTML = '<span>'+nome+'</span><span class="tag">'+tag+(extra?(' · '+extra):'')+'</span>';
    lista.appendChild(d);
    return d;
  }

  function testar(url){
    return new Promise(function(res){
      var el = addItem(url,'wait','TESTANDO...');
      var t0 = Date.now();
      var ctl = new AbortController();
      var timeout = setTimeout(function(){ ctl.abort(); }, 12000);
      fetch(url, {cache:'no-store', signal: ctl.signal})
        .then(function(r){
          clearTimeout(timeout);
          var ms = Date.now()-t0;
          if(r.ok){
            el.className = 'item ok';
            el.querySelector('.tag').textContent = 'OK · '+ms+'ms';
            if(ms>4000){ lentos.push(url+' ('+ms+'ms)'); }
          } else {
            el.className = 'item fail';
            el.querySelector('.tag').textContent = 'HTTP '+r.status;
            falhas.push(url+' (HTTP '+r.status+')');
          }
          res();
        })
        .catch(function(e){
          clearTimeout(timeout);
          var ms = Date.now()-t0;
          el.className = 'item fail';
          el.querySelector('.tag').textContent = (ms>=11500?'TRAVOU (12s+)':'FALHOU');
          falhas.push(url+(ms>=11500?' (TRAVOU — nunca respondeu)':' (falhou: '+(e&&e.message||'?')+')'));
          res();
        });
    });
  }

  // Estado do Service Worker e caches
  function infoSW(){
    var sec = document.createElement('div');
    sec.className = 'sec'; sec.textContent = 'Service Worker & Cache';
    lista.appendChild(sec);
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(regs){
        addItem('Service Workers registrados: '+regs.length, regs.length<=1?'ok':'wait', regs.length<=1?'OK':'VÁRIOS');
        regs.forEach(function(r){
          addItem('SW: '+(r.active?r.active.scriptURL.replace(location.origin,''):'(inativo)'), 'ok', r.active?'ATIVO':'-');
        });
      });
    }
    if(window.caches && caches.keys){
      caches.keys().then(function(keys){
        addItem('Caches: '+(keys.join(', ')||'nenhum'), 'ok', keys.length+'');
      });
    }
  }

  // Roda tudo em sequência por grupo
  var fila = [];
  grupos.forEach(function(g){
    fila.push(function(){
      var sec = document.createElement('div');
      sec.className = 'sec'; sec.textContent = g.nome;
      lista.appendChild(sec);
      return Promise.all(g.itens.map(testar));
    });
  });

  fila.reduce(function(p, f){ return p.then(f); }, Promise.resolve())
    .then(function(){
      infoSW();
      setTimeout(function(){
        if(falhas.length===0 && lentos.length===0){
          resumo.innerHTML = '✅ <b>TODOS os recursos carregaram rápido.</b><br>Se o Game/Atlas ainda travam, o problema NÃO é carregamento de recurso — é no código/navegador. Me mande este print mesmo assim.';
        } else {
          var html = '';
          if(falhas.length){ html += '🔴 <b>FALHARAM/TRAVARAM:</b><br>' + falhas.join('<br>') + '<br><br>'; }
          if(lentos.length){ html += '🟡 <b>MUITO LENTOS:</b><br>' + lentos.join('<br>'); }
          resumo.innerHTML = html;
        }
      }, 1500);
    });
})();
</script>
</body>
</html>
