<title>Login — G20 Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090b0f;--bg2:#0f1117;--bg3:#171b23;--surface:#1c2030;--sur2:#242838;
  --border:rgba(255,255,255,0.08);--gold:#e8b84b;--goldd:#c8943a;
  --red:#e63946;--green:#2ecc71;--text:#f4f6fa;--text2:#b0bac8;--text3:#6b7a94;
  --ease:cubic-bezier(.4,0,.2,1)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100svh;overflow:hidden;position:relative;
}

/* Fundo animado */
.bg-glow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 20%, rgba(232,184,75,.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 80%, rgba(139,92,246,.05) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(232,184,75,.03) 0%, transparent 70%);
  animation:bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse{
  from{opacity:.6} to{opacity:1}
}

/* Card central */
.login-wrap{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  padding:16px;
  animation:fadeUp .5s var(--ease) both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.login-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:32px 36px 36px;
  box-shadow:0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(232,184,75,.06);
}
@media(max-width:480px){.login-card{padding:28px 20px;border-radius:16px}}

/* Logo */
.logo-wrap{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:24px;gap:0;
}
/* Logo G20 com glow pulsante */
.logo-img-wrap{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:4px;
}
.logo-img{
  width:120px;
  filter:
    drop-shadow(0 0 12px rgba(232,184,75,.9))
    drop-shadow(0 0 28px rgba(232,184,75,.6))
    drop-shadow(0 0 56px rgba(232,184,75,.35));
  animation:logoGlow 2s ease-in-out infinite alternate;
}
@keyframes logoGlow{
  from{
    filter:
      drop-shadow(0 0 8px rgba(232,184,75,.7))
      drop-shadow(0 0 20px rgba(232,184,75,.4))
      drop-shadow(0 0 40px rgba(232,184,75,.2));
  }
  to{
    filter:
      drop-shadow(0 0 16px rgba(232,184,75,1))
      drop-shadow(0 0 36px rgba(232,184,75,.8))
      drop-shadow(0 0 72px rgba(232,184,75,.5))
      drop-shadow(0 0 100px rgba(232,184,75,.25));
  }
}

/* Título */
.login-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;letter-spacing:2px;
  text-align:center;margin-bottom:6px;
}
.login-desc{
  font-size:13px;color:var(--text3);
  text-align:center;margin-bottom:28px;line-height:1.5;
}

/* Botão Google */
.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:13px 20px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s;font-family:inherit;
  margin-bottom:20px;
}
.btn-google:hover{border-color:rgba(232,184,75,.4);background:var(--sur2);transform:translateY(-1px)}
.btn-google:active{transform:translateY(0)}
.btn-google svg{flex-shrink:0}

/* Divisor */
.divider{
  display:flex;align-items:center;gap:12px;
  margin-bottom:20px;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;background:var(--border);
}
.divider span{font-size:11px;color:var(--text3);white-space:nowrap;letter-spacing:1px}

/* Form */
.form-group{margin-bottom:14px}
.form-label{
  display:block;font-size:11px;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;
  color:var(--text3);margin-bottom:6px;
}
.form-control{
  width:100%;background:var(--bg3);
  border:1px solid var(--border);
  color:var(--text);padding:11px 14px;
  border-radius:9px;font-size:14px;
  font-family:inherit;transition:border .2s,box-shadow .2s;
  outline:none;
}
.form-control:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(232,184,75,.1);
}
.form-control::placeholder{color:var(--text3)}

/* Botão entrar */
.btn-submit{
  width:100%;padding:13px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--goldd));
  color:#090b0f;font-size:15px;font-weight:800;
  border:none;cursor:pointer;transition:all .2s;
  font-family:inherit;letter-spacing:.5px;margin-top:4px;
}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,184,75,.4)}
.btn-submit:active{transform:translateY(0)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* Mensagem de erro */
.msg{
  display:none;padding:10px 14px;border-radius:8px;
  font-size:12px;font-weight:600;margin-bottom:14px;
  text-align:center;
}
.msg.error{background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.3);color:var(--red)}
.msg.success{background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.3);color:var(--green)}
.msg.show{display:block}
.msg.info{background:rgba(201,169,97,.12);border:1px solid rgba(201,169,97,.3);color:#e8c766}
.remember-row{display:flex;align-items:center;gap:8px;margin:2px 0 4px;cursor:pointer;font-size:13px;color:var(--text2,#9aa5b8);user-select:none}
.remember-row input{width:16px;height:16px;accent-color:#c9a961;cursor:pointer;flex-shrink:0}
.remember-hint{font-size:11px;color:var(--text3,#6b6862);margin:0 0 14px 24px;line-height:1.3}

/* Tab email/senha */
.tabs-auth{
  display:flex;gap:4px;background:var(--bg3);
  border-radius:8px;padding:3px;margin-bottom:20px;
}
.tab-auth{
  flex:1;padding:8px;border-radius:6px;font-size:12px;
  font-weight:700;cursor:pointer;border:none;
  background:transparent;color:var(--text3);
  transition:all .2s;font-family:inherit;
}
.tab-auth.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* Loading overlay */
.loading-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(9,11,15,.7);z-index:999;
  align-items:center;justify-content:center;
  flex-direction:column;gap:16px;
  backdrop-filter:blur(4px);
}
.loading-overlay.show{display:flex}
.spinner{
  width:40px;height:40px;border-radius:50%;
  border:3px solid rgba(232,184,75,.2);
  border-top-color:var(--gold);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text2)}

/* Rodapé */
.login-footer{
  margin-top:24px;text-align:center;
  font-size:11px;color:var(--text3);line-height:1.6;
}
.login-footer strong{color:var(--gold)}
</style>
</head>

        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Entrar com Google
    </button>

    <!-- Divisor -->
    <div class="divider"><span>ou</span></div>

    <!-- Tabs login/cadastro -->
    <div class="tabs-auth">
      <button class="tab-auth on" id="tabLogin" onclick="setTab('login')">Entrar</button>
      <button class="tab-auth" id="tabCadastro" onclick="setTab('cadastro')">Criar conta</button>
    </div>

    <!-- Form email/senha -->
    <div id="formLogin">
      <form id="loginForm" autocomplete="on" onsubmit="loginEmail();return false;">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input class="form-control" type="email" id="inputEmail"
               name="email" autocomplete="email"
               inputmode="email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-control" type="password" id="inputSenha"
               name="password" autocomplete="current-password"
               placeholder="••••••••">
      </div>
      <label class="remember-row">
        <input type="checkbox" id="chkRemember">
        <span>Manter conectado neste dispositivo</span>
      </label>
      <div class="remember-hint">Não marque em computador compartilhado.</div>
      <button class="btn-submit" id="btnSubmit" type="submit">
        Entrar na plataforma
      </button>
      </form>
    </div>

    <!-- Form cadastro -->
    <div id="formCadastro" style="display:none">
      <div class="form-group">
        <label class="form-label">Nome completo</label>
        <input class="form-control" type="text" id="inputNome" name="name" autocomplete="name" placeholder="Seu nome">
      </div>
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input class="form-control" type="email" id="inputEmailCad" name="email" autocomplete="email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-control" type="password" id="inputSenhaCad" name="new-password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
      </div>
      <button class="btn-submit" onclick="cadastrarEmail()">
        Solicitar acesso
      </button>
    </div>

    <!-- Rodapé -->
    <div class="login-footer">
      Acesso controlado · Apenas <strong>alunos aprovados</strong> entram na plataforma.<br>
      Problemas? Fale com Israel via WhatsApp.
    </div>

  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// ── Config Firebase ──────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBDX1wS7TyiY_of3hW7eTlphwoEPSaziHU",
  authDomain: "g20-masterclass.firebaseapp.com",
  projectId: "g20-masterclass",
  storageBucket: "g20-masterclass.firebasestorage.app",
  messagingSenderId: "1052719482127",
  appId: "1:1052719482127:web:537c1d67c96532be8a2a7a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ── UI helpers ───────────────────────────────────────────────
function showMsg(txt, tipo) {
  var el = document.getElementById('msgBox');
  el.textContent = txt;
  el.className = 'msg ' + tipo + ' show';
}
function hideMsg() {
  document.getElementById('msgBox').className = 'msg';
}
function setLoading(show, txt) {
  var ov = document.getElementById('loadingOverlay');
  ov.className = 'loading-overlay' + (show ? ' show' : '');
  if (txt) document.getElementById('loadingText').textContent = txt;
}
function setTab(tab) {
  document.getElementById('tabLogin').className    = 'tab-auth' + (tab==='login'    ? ' on' : '');
  document.getElementById('tabCadastro').className = 'tab-auth' + (tab==='cadastro' ? ' on' : '');
  document.getElementById('formLogin').style.display    = tab==='login'    ? 'block' : 'none';
  document.getElementById('formCadastro').style.display = tab==='cadastro' ? 'block' : 'none';
  hideMsg();
}

// ── Verifica aprovação e redireciona ─────────────────────────
// Emails que são automaticamente admin (nunca precisam de aprovação)
var ADMIN_EMAILS = ['iorb@hotmail.com', 'iorb07@gmail.com'];
// Nome digitado no cadastro (usado ao criar o doc do usuário, antes do displayName ficar pronto)
var _pendingCadastroName = '';

async function checkApprovalAndRedirect(user) {
  try {
    var isAdminEmail = ADMIN_EMAILS.indexOf(user.email) !== -1;
    var doc = await db.collection('users').doc(user.uid).get();

    if (!doc.exists) {
      await db.collection('users').doc(user.uid).set({
        uid:       user.uid,
        email:     user.email,
        name:      _pendingCadastroName || user.displayName || user.email.split('@')[0],
        photo:     user.photoURL || '',
        turma:     'Turma 20',
        role:      isAdminEmail ? 'admin' : 'Membro',
        aprovado:  isAdminEmail ? true : false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setLoading(false);
      if (isAdminEmail) {
        localStorage.setItem('g20_uid', user.uid);
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'aguardando.html';
      }
      return;
    }

    var data = doc.data();

    if (data.role === 'admin' || isAdminEmail) {
      if (isAdminEmail && (data.role !== 'admin' || data.aprovado !== true)) {
        await db.collection('users').doc(user.uid).update({ role: 'admin', aprovado: true });
      }
      localStorage.setItem('g20_uid', user.uid);
      setLoading(false);
      window.location.href = 'dashboard.html';
      return;
    }

    if (data.aprovado === true) {
      localStorage.setItem('g20_uid', user.uid);
      setLoading(false);
      window.location.href = 'dashboard.html';
    } else {
      setLoading(false);
      window.location.href = 'aguardando.html';
    }

  } catch (e) {
    setLoading(false);
    _authProcessing = false;
    showMsg('⚠️ ERRO: ' + (e.code || '') + ' — ' + (e.message || e), 'error');
  }
}

// ── Controle para evitar duplo processamento ─────────────────
var _authProcessing = false;

// ── onAuthStateChanged: gate único de entrada ─────────────────
// Cobre TODOS os casos: email/senha, Google popup, Google redirect.
// Quando o signInWithRedirect volta, o Firebase dispara onAuthStateChanged
// automaticamente — não precisa de getRedirectResult para o redirect.
auth.onAuthStateChanged(function(user) {
  if (user && !_authProcessing) {
    _authProcessing = true;
    _limparTimeoutLogin();
    setLoading(true, 'Verificando acesso...');
    checkApprovalAndRedirect(user);
  }
});

// ── getRedirectResult: captura erros do redirect (fallback) ────
auth.getRedirectResult().catch(function(e) {
  if (e.code && e.code !== 'auth/no-auth-event' && e.code !== 'auth/null-user') {
    setLoading(false);
    showMsg('Erro no login Google: ' + (e.message || e.code), 'error');
  }
});

// ── Persistência da sessão (checkbox "Manter conectado") ─────
// Marcado = LOCAL (continua logado ao fechar o navegador).
// Desmarcado = SESSION (fechar o navegador desconecta — seguro p/ PC compartilhado).
function _salvarPrefPersistencia() {
  try {
    var manter = document.getElementById('chkRemember');
    localStorage.setItem('g20_keep_logged', manter && manter.checked ? '1' : '0');
  } catch(e){}
}
async function _aplicarPersistencia() {
  try {
    var keep = localStorage.getItem('g20_keep_logged');
    var modo = (keep === '1')
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION;
    await auth.setPersistence(modo);
  } catch (e) { console.warn('persistencia:', e); }
}

// Aplica a persistência JÁ no carregamento e sempre que o checkbox muda — assim, no
// clique de login, a persistência já está setada e o popup abre SEM corrida (era isso
// que perdia o resultado do popup e travava a 1ª tentativa após o logout por inatividade).
(function(){
  try{
    var chk = document.getElementById('chkRemember');
    if(chk){
      chk.checked = (localStorage.getItem('g20_keep_logged') === '1');
      chk.addEventListener('change', function(){
        _salvarPrefPersistencia();
        _aplicarPersistencia();
      });
    }
    _aplicarPersistencia();
  }catch(e){}
})();

// ── Rede de segurança: solta o overlay se o login travar (sem precisar de F5) ──
var _loginTimeout = null;
function _armarTimeoutLogin() {
  _limparTimeoutLogin();
  _loginTimeout = setTimeout(function(){
    _authProcessing = false;
    setLoading(false);
    showMsg('O login demorou demais. Clique novamente para tentar.', 'error');
  }, 30000);
}
function _limparTimeoutLogin() {
  if (_loginTimeout) { clearTimeout(_loginTimeout); _loginTimeout = null; }
}

// ── Login Google ─────────────────────────────────────────────
// Usa popup em TODAS as plataformas. O redirect quebra silenciosamente
// quando o authDomain (g20-masterclass.firebaseapp.com) difere do domínio
// do app (iorb07-ica.github.io) — caso clássico no Safari/iOS.
// O popup precisa ser chamado IMEDIATAMENTE no clique (sem await antes),
// senão o browser bloqueia por perder a cadeia de gesto do usuário.
function loginGoogle() {
  hideMsg();
  _salvarPrefPersistencia();
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  setLoading(true, 'Abrindo login Google...');
  _armarTimeoutLogin();
  // A persistência JÁ foi aplicada (no load / no change do checkbox). Aqui o popup é
  // chamado direto, SEM setPersistence em paralelo — isso elimina a corrida que fazia
  // o resultado do popup se perder e travar a 1ª tentativa depois do logout.
  auth.signInWithPopup(provider)
    .then(function(result){
      // Processa o resultado do popup DIRETAMENTE (não depende só do onAuthStateChanged)
      if (result && result.user && !_authProcessing) {
        _authProcessing = true;
        _limparTimeoutLogin();
        setLoading(true, 'Verificando acesso...');
        checkApprovalAndRedirect(result.user);
      }
    })
    .catch(function(e){
      _limparTimeoutLogin();
      setLoading(false);
      if (e.code === 'auth/popup-blocked') {
        // se o popup for bloqueado, cai pro redirect
        auth.signInWithRedirect(provider).catch(function(err){
          showMsg('Erro no login Google: ' + (err.message || err.code), 'error');
        });
      } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
        showMsg('Erro no login Google: ' + (e.message || e.code), 'error');
      }
    });
}

// ── Login Email/Senha ────────────────────────────────────────
async function loginEmail() {
  var email = document.getElementById('inputEmail').value.trim();
  var senha = document.getElementById('inputSenha').value;
  if (!email || !senha) { showMsg('Preencha e-mail e senha.', 'error'); return; }
  hideMsg();
  setLoading(true, 'Entrando...');
  try {
    await _aplicarPersistencia();
    await auth.signInWithEmailAndPassword(email, senha);
    // onAuthStateChanged cuida do redirect
  } catch (e) {
    setLoading(false);
    var msgs = {
      'auth/user-not-found':   'E-mail não encontrado.',
      'auth/wrong-password':   'Senha incorreta.',
      'auth/invalid-email':    'E-mail inválido.',
      'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.',
      'auth/invalid-credential':'E-mail ou senha incorretos.'
    };
    showMsg(msgs[e.code] || 'Erro: ' + e.message, 'error');
  }
}

// ── Cadastro Email/Senha ─────────────────────────────────────
async function cadastrarEmail() {
  var nome  = document.getElementById('inputNome').value.trim();
  var email = document.getElementById('inputEmailCad').value.trim();
  var senha = document.getElementById('inputSenhaCad').value;
  if (!nome || !email || !senha) { showMsg('Preencha todos os campos.', 'error'); return; }
  if (senha.length < 6) { showMsg('Senha precisa ter ao menos 6 caracteres.', 'error'); return; }
  hideMsg();
  setLoading(true, 'Criando conta...');
  try {
    // Guarda o nome ANTES de criar a conta. O doc no Firestore é criado pelo gatilho
    // onAuthStateChanged (que dispara já no createUser, antes do updateProfile terminar),
    // então sem isso o nome cairia pro prefixo do e-mail. Com isso, grava o nome certo.
    _pendingCadastroName = nome;
    var cred = await auth.createUserWithEmailAndPassword(email, senha);
    await cred.user.updateProfile({ displayName: nome });
    // checkApprovalAndRedirect vai criar o doc e redirecionar para aguardando
  } catch (e) {
    setLoading(false);
    var msgs = {
      'auth/email-already-in-use':'Este e-mail já está cadastrado. Tente fazer login.',
      'auth/invalid-email':       'E-mail inválido.',
      'auth/weak-password':       'Senha muito fraca. Use ao menos 6 caracteres.'
    };
    showMsg(msgs[e.code] || 'Erro: ' + e.message, 'error');
  }
}

// ── Aviso de logout automático por inatividade ───────────────
(function(){
  try{
    if(new URLSearchParams(location.search).get('timeout') === '1'){
      showMsg('🔒 Você foi desconectado por inatividade. Faça login novamente.', 'info');
    }
  }catch(e){}
})();
</script>
